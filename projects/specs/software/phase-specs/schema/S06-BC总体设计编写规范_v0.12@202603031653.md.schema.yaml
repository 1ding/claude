# BC总体设计编写规范 Schema
# 来源规范：projects/specs/software/phase-specs/drafts/S06-BC总体设计编写规范_v0.12@202603031653.md
# 用途：AI 内容编写阶段加载此 schema（替代完整规范），提供 BC总体设计文档 结构与内容约束
# 完整规则（更多示例和详细说明）：见原规范文件
# 最近验证：2026-03-03

doc_id: S06
doc_name: BC总体设计编写规范

# ── 文档结构总览 ──
structure:
  四域: [I战略定位, II业务架构, III技术架构, IV工程治理]
  必选章节: [第1章总则, 第2章上下文概述, 第3章业务职责与功能清单, 第4章子领域划分,
             第5章上下文映射与协作设计, 第6章公共架构决策, 第7章基础设施与集成规范,
             第8章安全与权限设计, 第9章非功能需求与可观测性, 附录A术语表, 修订记录]
  可选章节: [第10章测试策略, 第11章部署运维]
  裁剪规则: "第10/11章仅小型项目可裁剪；第1~9章及附录A不可裁剪；小BC可简化第4章但不可删除"
  定位: "1+N文档体系：BC总体设计是骨架（1），子领域详细设计是血肉（N），每个子领域对应一份阶段7文档"

# ── 第1章 总则 ──
ch1_总则:
  格式: "列表形式，无下级章节"
  强制元数据顺序:
    - BC编号: "格式：BC-{序号}，与阶段3一致"
    - BC名称: "中文名称，与阶段3一致"
    - 文档编号: "格式：06-BC{编号}，如 06-BC11"
    - 文档版本: "格式：V{主版本}.{次版本}"
    - 目的: "一句话描述"
    - 范围: "版本范围+子领域范围"
    - 管理要点: "3~6个关键词，顿号分隔"
    - 文档密级: "格式：【商密X级】-- 外发必追责"

# ── 第2章 上下文概述 ──
ch2_上下文概述:
  节结构: [2.1 BC归属信息, 2.2 上下文价值定位, 2.3 上下文边界, 2.4 版本范围, 2.5 架构约束引用, 2.6 安全约束]
  BC归属信息表:
    字段: [BC编号, BC名称, BC英文名, 所属域, 上下文类型, 所属微服务, 微服务端口,
           所属数据库, 代码包路径, 上游依赖, 下游被依赖, 文档版本, 设计状态]
    格式:
      - "BC编号：BC-{序号}"
      - "BC英文名：PascalCase，用于代码包命名"
      - "所属微服务：svc-{名称}"
      - "代码包路径：com.{company}.{bc-name}"
      - "上游依赖：BC-XX(OHS+ACL)"
      - "设计状态：草稿/评审中/已发布"
    一致性约束: "BC编号、名称、所属域、微服务映射、数据库映射须与阶段3/阶段4完全一致；如需调整先走变更流程"
  上下文价值定位:
    段落顺序: [核心价值(≤30字一句话), 业务目标(1~3条), 服务对象, 核心能力(3~5条短语)]
  上下文边界:
    明确排除:
      - 至少3项，不可为空
      - 字段: [排除项, 归属BC, 排除原因]
      - 约束: "必须同时说明'我不做什么+由谁做'"
    职责对比表: "存在边界争议或易混淆相邻BC时添加；标记：Y负责/N不负责/P参与协作"
  版本范围:
    字段: [版本, 设计范围(当前版本/未来版本), 核心交付]
    原则: "当前版本内容详尽；未来版本仅概要，不展开完整细节"
  架构约束引用:
    定位: "只做显式引用与遵守说明，不重新定义约束内容"
    字段: [约束编号(ARC-XX), 约束描述, 约束来源, 本BC遵守说明]
  安全约束:
    最少覆盖: [数据隔离级别(租户级/部门级), 敏感字段加密要求, 跨BC数据传输安全]
    字段: [约束项, 适用范围, 实现方式]
    与第8章区别: "本节是约束规则，第8章是实现方案"

# ── 第3章 业务职责与功能清单 ──
ch3_职责与功能:
  节结构: [3.1 核心职责, 3.2 功能清单]
  主要职责清单:
    字段: [职责编号(R-01起), 职责名称, 职责描述, 重要性(核心/重要)]
    规模: "3~7项"
  辅助职责清单:
    字段: [职责编号(R-10起), 职责名称, 职责描述, 依赖方]
    规模: "1~5项"
  语言要求: "业务视角：'管理XX全生命周期''提供XX查询能力'；禁用：'实现XX接口''调用XX服务'"
  职责详细说明: "每项含：业务场景/触发条件/预期结果/关联功能（指向3.2节）"
  功能汇总表:
    字段: [版本, 功能数量, 优先级分布(P0:X/P1:X/P2:X), 说明]
  功能详细清单:
    字段: [功能编号(F-{序号}), 功能名称, 功能描述, 优先级(P0/P1/P2), 版本, 关联职责, 关联页面, 关联接口]
  功能依赖关系:
    字段: [功能编号, 前置功能, 依赖说明]
    约束: "仅记录BC内部依赖；跨BC依赖在第5章定义"
  编号规则: "全BC唯一，一经分配不变（可废弃不可回收复用），不可跨BC复用"
  对应关系: "功能=Feature，与Feature清单一一对应，不遗漏/不拆分/不合并"
  填写顺序: "①Feature映射功能清单→②归纳职责清单→③填依赖关系表→④汇总表"

# ── 第4章 子领域划分 ──
ch4_子领域划分:
  节结构: [4.1 子领域划分总览, 4.2 各子领域职责说明, 4.3 子领域间依赖关系]
  清单表字段: [子领域编号(SD{序号}), 子领域名称, 英文缩写, 核心关注问题, 归属功能, 文档编号(BC-XX-SD0X)]
  编排规则: "序号按业务依赖顺序：核心子领域在前，依赖子领域在后"
  划分标准:
    - 每个子领域有独立的核心关注问题（不与其他重叠）
    - 内部功能围绕同一组业务概念（高内聚）
    - 子领域间通过ID引用或领域事件通信（低耦合）
  规模: "大BC通常2~5个；超过5个应审视是否需拆分BC"
  横切子领域:
    特征: "横跨多个子领域提供服务（如审计管理/配置管理）"
    约束: "不受数量上限；不承载核心业务功能"
    图示: "横向带状区域表示，标注[横切]"
  关系图要素:
    - "外框标注BC编号和名称"
    - "每个子领域矩形框：编号+名称+类型（核心/支撑/通用）"
    - "箭头：────▶同步调用；▼[异步]异步事件"
    - "图例说明符号含义"
  职责说明五项:
    - 核心职责: "一句话说明职责边界"
    - 核心实体: "1~4个；含英文类名和关键字段；格式：实体名（EnglishName）：字段1、字段2..."
    - 核心能力: "按版本阶段分组（P1/P2+），对应第3章功能编号"
    - 数据存储方案: "列技术+职责；不展开表结构（表结构在子领域详细设计中）"
    - 对外接口: "接口摘要；详细定义在第5章或子领域详细设计中"
  横切子领域职责说明补充:
    - 核心职责: "明确横切范围（'横切所有子领域'或'服务SD01~SDxx'）"
    - 核心能力: "以'为被服务的各子领域提供X能力'方式描述"
    - 对外接口: "明确调用模式：被动型（接收领域事件）或主动型（提供查询接口）"
  依赖关系表:
    字段: [调用方, 被调用方, 调用方式(方法调用/领域事件/共享数据库表), 调用目的, 数据流向(单向/双向)]
    共享数据: "如有，补充共享表清单：所属子领域（写入方）+引用子领域（只读方）"
  划分禁忌:
    - 禁止按技术层划分（如服务层子领域/数据层子领域）
    - 禁止按CRUD操作划分（如查询子领域/管理子领域）
    - 禁止用"公共子领域"承载无法归类的功能
  小BC处理: "标注'本BC无需子领域划分'并说明依据；填写简化版清单表（SD01，归属功能=全部功能编号）"

# ── 第5章 上下文映射与协作设计 ──
ch5_上下文映射:
  节结构: [5.1 输入输出全景, 5.2 上下文映射图, 5.3 映射关系说明, 5.4 协作设计决策, 5.5 上下游依赖治理规则, 5.6 逐对接口细化(可选)]
  输入定义表:
    字段: [输入编号(IN-{序号}), 输入名称, 输入来源, 输入方式(REST/Feign/消息队列), 数据内容, 触发场景]
  输出定义表:
    字段: [输出编号(OUT-{序号}), 输出名称, 输出目标, 输出方式(REST/消息队列/文件), 数据内容, 触发场景]
  数据流图: "ASCII图：左侧输入来源→中央本BC→右侧输出目标；箭头标注数据名称和传输方式"
  映射图要素:
    - "所有协作BC（矩形框，标注编号和名称）"
    - "上下游方向：U=上游，D=下游"
    - "映射模式：OHS/PL/ACL/CF/SK/Partnership/Customer-Supplier/Separate-Ways"
    - "集成方式：同步/异步"
  映射关系表:
    字段: [协作方, 方向(本BC依赖/依赖本BC/双向), 映射模式, 集成方式, 说明]
  协作决策表:
    字段: [决策编号(CTX-{序号}), 协作关系, 映射模式, 调用方式, 决策原因, 风险与缓解]
    决策详细说明: "每条含：协作场景/模式选择原因/调用方式选择原因/风险与缓解策略"
  映射模式参考:
    OHS+ACL: "推荐的标准集成方式；上游提供OHS，下游实现ACL"
    OHS+PL: "对外提供标准化API；须定义发布语言（如OpenAPI/Proto）"
    ACL: "隔离外部系统变化；下游必须实现模型转换层"
    Conformist: "下游完全依赖上游模型；须评审确认，记录风险"
    Partnership: "两个团队紧密协作；须明确协调机制和变更通知流程"
    Customer-Supplier: "上游为下游提供服务；须明确SLA和变更通知机制"
    Separate-Ways: "无集成需求；须评审确认，记录决策原因"
    Shared-Kernel: "多BC共享核心模型；不推荐大范围使用，须严格变更管理"
  治理规则五类:
    查询类依赖: "允许同步，建议走缓存，必须设超时和熔断"
    命令类依赖: "优先领域事件异步；需同步时必须实现Saga补偿"
    跨BC一致性: "禁止2PC；必须最终一致性"
    上游模型变更: "下游必须ACL隔离；禁止直接依赖上游领域模型"
    双向依赖: "原则上禁止；如确需必须双向ACL并架构评审说明"
  逐对接口细化:
    触发条件: "协作对≥4对，或存在双向依赖/多接口协作"
    每节包含: [映射概述(一句话), 接口定义表(接口名称/类型/提供方/调用方/说明), 数据流说明(2~3条)]
    粒度: "只列接口名称和说明，不展开参数（参数定义在子领域详细设计中）"

# ── 第6章 公共架构决策 ──
ch6_公共架构:
  节结构: [6.1 分层架构, 6.2 核心聚合状态机, 6.3 技术栈选型, 6.4 模块结构]
  分层:
    四层: [interfaces接口层, application应用层, domain领域层, infrastructure基础设施层]
    职责表字段: [层名称, 英文名, 职责(2~4条), 包路径, 依赖规则]
    依赖规则:
      - "领域层零依赖（不依赖任何外层）"
      - "应用层仅依赖领域层"
      - "接口层仅依赖应用层"
      - "基础设施层实现领域层接口（依赖倒置）"
    约束: "不额外自创分层；层内细分通过包结构体现"
  技术栈清单:
    字段: [技术类别(框架/数据库/缓存/消息/监控/测试), 技术名称, 版本, 用途, 选型原因]
    基线原则: "以阶段4技术选型基线为基础；与系统基线完全一致的可注明'遵循系统基线'"
    完整性: "必须按类别列出所有技术依赖，遗漏将导致子领域引入未经评审的技术"
  模块结构:
    形式: "目录树（ASCII图），每个模块标注用途注释"
    职责表字段: [模块名, 职责, 对应分层, 依赖模块]
    约束: "所有子领域共享同一工程骨架时定义一次即可"
  核心聚合状态机:
    适用范围: "BC级共享的核心聚合根（跨多子领域使用）；子领域私有的在子领域详细设计中定义"
    状态定义表字段: [聚合根, 状态(中文+SCREAMING_SNAKE_CASE编码), 状态说明, 前置状态, 触发条件]
    状态机图要素: "所有状态节点+所有迁移边（标注触发条件）+初始状态（入口箭头）+终态"

# ── 第7章 基础设施与集成规范 ──
ch7_基础设施:
  节结构: [7.1 数据隔离架构, 7.2 仓储实现策略, 7.3 缓存设计, 7.4 消息队列设计, 7.5 防腐层实现, 7.6 并发幂等策略]
  数据隔离:
    适用: "多租户场景必填；不涉及时标注'本BC不涉及数据隔离'并说明原因"
    字段: [隔离维度(租户级/部门级/个人级), 隔离方式, 隔离字段, 过滤方式, 实现机制]
  仓储命名三件套:
    接口: "{Aggregate}Repository（领域层）"
    实现: "{Aggregate}RepositoryImpl（基础设施层）"
    映射器: "{Aggregate}Assembler（领域对象↔PO转换）"
  仓储实现清单: "字段：仓储接口/实现类/持久化技术/完整类名"
  缓存:
    Key规范: "{bc}:{entity}:{identifier}（示例：tenant:detail:550e8400）"
    策略表字段: [缓存对象, 缓存类型(Redis/本地/不缓存), 缓存Key, 过期时间, 更新策略]
    一致性表字段: [场景(创建/更新/删除/查询), 一致性策略(Cache-Aside/Write-Through等), 说明]
  消息队列:
    Topic规范: "{bc}.{event-type}（示例：tenant.tenant-created）"
    消息基础字段: [eventId, eventType, eventVersion, occurredOn, aggregateId, aggregateType, payload]
    消费者策略表字段: [幂等策略(基于eventId), 重试策略, 死信处理, 顺序性要求]
  防腐层表字段: [上游BC, ACL类名, 转换规则(上游模型→本BC模型), 降级策略]
  幂等策略表字段: [场景类型(接口调用/消息消费), 幂等机制, 幂等键来源, 存储位置, 过期策略]

# ── 第8章 安全与权限设计 ──
ch8_安全权限:
  节结构: [8.1 认证方案, 8.2 角色定义, 8.3 权限命名规范, 8.4 权限-角色矩阵框架, 8.5 数据权限通用策略, 8.6 前端权限控制策略, 8.7 敏感数据与审计]
  认证方案: "段落形式；含：认证方式/Token管理策略/内部服务间认证/用户群差异化认证（如有多个独立用户群）"
  角色清单:
    定义范围: "BC总体设计统一定义角色；子领域详细设计引用角色并定义具体权限点和权限-角色映射"
    字段: [角色编码(如SUPER_ADMIN), 角色名称, 角色说明, 适用范围(平台级/租户级)]
  权限命名:
    规则: "三段式：模块:资源:操作"
    标准动词: [create, read, update, delete, export, manage, approve]
    示例: "tenant:tenant:create"
  权限矩阵格式: "列：权限代码/权限名称/各角色列（Y授权/N不授权/C条件授权）；C须补充条件说明"
  数据权限层级:
    租户级: "tenant_id过滤"
    部门级: "department_id过滤"
    个人级: "created_by/owner_id过滤"
  安全策略覆盖:
    敏感数据: [加密算法, 脱敏规则, 存储策略]
    传输安全: [HTTPS要求, 内部通信加密策略]
    审计日志: [审计日志范围, 保留策略]
    输入校验: [XSS防护, SQL注入防护, 参数校验规范]

# ── 第9章 非功能需求与可观测性 ──
ch9_非功能:
  节结构: [9.1 性能设计, 9.2 日志规范, 9.3 监控指标, 9.4 链路追踪, 9.5 告警规则]
  性能目标表字段: [指标, 目标值(如P99<200ms), 适用场景, 测量方式]
  性能优化表字段: [优化手段(缓存/异步/批量/索引), 适用场景, 预期效果, 副作用]
  日志规范:
    字段: [日志级别(ERROR/WARN/INFO/DEBUG), 使用场景, 必含字段, 禁止内容]
    标准字段: [traceId, spanId, timestamp, level, logger, message, extra]
    格式: "统一JSON结构化日志"
  监控指标:
    必覆盖维度: [健康检查(存活/就绪), 请求量(QPS/状态码), 响应时间(P50/P95/P99), 错误率, 资源使用(JVM/线程池/连接池), 业务指标]
    指标表字段: [指标名称(Prometheus), 指标类型(Counter/Gauge/Histogram), 标签, 说明]
  链路追踪:
    Span命名: "{layer}.{operation}（示例：api.createTenant, repo.findById）"
    段落含: [追踪框架, Span命名规范, 采样策略(全量/按比例/规则), 跨服务传播(HTTP-Header/MQ-Header)]
  告警规则:
    必覆盖: [服务健康异常, 响应时间超标(P99超目标值), 错误率突增(5xx>阈值), 资源超限, 业务异常(核心操作失败率突增)]
    字段: [告警名称, 监控指标, 告警条件(如>500ms持续5min), 告警级别(P0/P1/P2), 通知方式, 处理预案]

# ── 第10章 测试策略（可选）──
ch10_测试:
  可裁剪: "仅小型项目可裁剪"
  节结构: [10.1 测试分层策略, 10.2 测试覆盖要求, 10.3 契约测试策略, 10.4 测试数据策略]
  测试金字塔表字段: [测试层级, 测试目标, 比例, 执行频率(每次提交/每次PR/每次发布)]
  各层重点:
    单元测试: [聚合根业务方法, 值对象校验, 领域服务逻辑, 状态机转换]
    集成测试: [仓储CRUD, ACL模型转换, 消息发布消费, 缓存读写]
    E2E测试: "核心业务流程端到端验证"
  覆盖要求表字段: [覆盖维度(领域层/应用层/接口层/整体), 行覆盖率目标, 关键场景, 说明]
  契约测试:
    覆盖范围: "第5章定义的所有协作关系"
    字段: [契约类型(API/消息), 协作BC, 测试方式(Consumer-Driven/Provider-Driven), 测试工具, 执行时机]
  测试数据策略: "段落形式；含：数据构造方式/数据隔离方式/数据清理方式"

# ── 第11章 部署运维（可选）──
ch11_部署:
  可裁剪: "仅小型项目可裁剪"
  节结构: [11.1 部署拓扑, 11.2 环境配置]
  部署拓扑: "ASCII图；含微服务实例/数据库/缓存/消息队列的部署位置和网络关系"
  资源配置表字段: [组件, 环境(生产/预发/测试), 实例数, CPU/内存, 存储, 说明]
  环境配置表字段: [配置项, 开发环境, 测试环境, 预发环境, 生产环境(敏感信息用占位符)]
  基线: "以阶段4系统设计文档部署架构为基础，在BC层面做具体化配置"

# ── 附录编写规则 ──
appendix:
  编号: "大写字母：附录A/B/C..."
  标题格式: "附录{字母}（规范性/资料性）{附录名称}"
  排列: "规范性附录在前；修订记录不编号为附录，固定位于文档末尾"
  附录A_术语表:
    必选: true
    三层体系:
      业界通用术语: "仅列名称（BC/DDD/ACL/OHS/Feature/User-Story/Enabler-Feature）"
      天帷通用术语: "引用C99，仅列名称和编号，不展开定义"
      文档专有术语: "含完整定义"
  附录B_参考文档:
    必要性: 推荐
    格式: "《文档名称》：一句话说明与本文档的关联"
  附录C_Epic映射:
    必要性: 推荐
    字段: [Epic编号, Epic名称, 对应子领域, 核心能力]
  附录D_版本规划:
    必要性: 推荐
    字段: [版本, 子领域范围, 核心功能, 里程碑(可选)]
  附录E_追溯矩阵:
    必要性: "可选，大BC推荐"
  附录F_接口变更规范:
    必要性: "可选，涉及外部依赖时添加"
