# S07-BC详细设计编写规范 Schema
# 来源规范：/home/1ding/claude/projects/specs/software/phase-specs/outputs/S07-BC详细设计编写规范_v0.13@202603032144.md
# 用途：AI 内容编写阶段加载此 schema（替代完整规范），提供BC详细设计约束
# 完整规则（更多示例和详细说明）：见原规范文件
# 最后校验：2026-03-03（对标 v0.13 规范，同步ch3重写：第3章改名"业务设计"，双类清单+业务操作三件套）

doc_id: S07
doc_name: BC详细设计编写规范

# ── 文档整体结构 ──
doc_structure:
  管理要点: "12章正文结构、三表模型、五件套接口设计、追溯链设计、分版本展开策略"
  required_chapters:
    - "第1章 总则（文档元数据）"
    - "第2章 背景与约束"
    - "第3章 业务设计"
    - "第4章 领域模型设计"
    - "第5章 应用层设计"
    - "第6章 接口设计"
    - "第11章 权限设计"
  optional_chapters:
    - "第7章 数据模型设计（纯前端可省略）"
    - "第8章 前端交互设计（纯后端可省略）"
    - "第9章 后端工程结构设计（小BC或BC总体设计已统一可省略）"
    - "第10章 前端工程结构设计（无独立前端可省略）"
    - "第12章 单元测试设计（按需）"
    - "第13章 Task细化与工作量估算（按需）"
    - "附录A 专属错误码（无专属错误码可省略）"
    - "附录B 缓存/性能设计 或 业务规则索引（按需）"
    - "附录C 术语表 或 版本规划追溯矩阵（按需）"
  tailoring_rules:
    - "第4章+第5章：小BC（聚合数<3）可合并"
    - "第6章RPC部分：非微服务架构可省略"
    - "未来版本（P2+）：各章仅保留概述表和清单表，不展开详细设计"
    - "裁剪后在文档开头说明裁剪理由"

# ── 第1章 总则 ──
ch1_总则:
  rule: "文档元数据声明，全部内容以列表呈现，篇幅控制在半页以内"
  required_fields:
    文档编号: "{BC编号}-{设计单元编号}，如BC11-SD01"
    文档名称: "{BC名称} {设计单元名称}详细设计"
    目的: "一句话描述"
    范围: "本设计单元边界声明"
    管理要点: "3-6个关键词，含当前版本展开情况和核心结构特征"
    文档密级: "【商密二级】 -- 外发必追责（固定，不可调整）"

# ── 第2章 背景与约束 ──
ch2_背景与约束:
  rule: "收录本规范以外的全部背景信息与约束性输入；设计决策（状态机、并发、幂等）不在本章"
  sections:
    "2.1 设计单元定位":
      form: "键值对定位表"
      fields: ["所属BC（编号+名称）", "子领域编号", "子领域名称", "一句话描述（≤40字）", "核心关注问题（2~5条）"]
      rule: "所属BC和子领域编号/名称须与BC总体设计完全一致，不得自行新增或修改；小BC填'无子领域划分'"
    "2.2 版本范围":
      form: "版本清单表"
      cols: ["版本标识", "核心交付内容", "文档状态（当前版完整展开/未来版概要）"]
    "2.3 业务边界":
      form: "范围内+范围外双清单表，各5~10行"
      范围内列: ["序号", "业务能力"]
      范围外列: ["序号", "业务能力", "负责方（子领域编号+名称或BC）"]
    "2.4 场景索引":
      form: "索引表（引用需求文档，不重复展开）"
      cols: ["场景编号", "场景名称", "触发者", "版本归属", "需求文档引用"]
    "2.5 架构约束引用":
      form: "约束引用表"
      cols: ["约束项", "引用来源（BC总体设计章节号）", "对本设计单元的约束"]
    "2.6 安全合规约束":
      form: "安全约束表"
      cols: ["约束项", "涉及范围", "实施方式", "引用来源"]
  key_rules:
    - "状态机统一在第4章对应聚合中定义，不在第2章"
    - "并发与幂等策略：乐观锁在第4章属性清单，接口幂等在第6章，长流程在第3章或第4章"
    - "场景索引是引用而非定义，与需求文档1:1对应"

# ── 第3章 业务设计 ──
ch3_业务设计:
  structure_rule: "3.1 设计总览（两张分类清单）+ 3.x 各业务流程（四件套）+ 3.n 各业务操作（三件套）；无业务流程时3.x节可省略，无业务操作时3.n节可省略"
  业务能力分类判断:
    业务流程: "操作触发聚合根状态跃迁 → 四件套（概述+流程图+步骤表+异常处理）"
    业务操作: "纯查询/无状态跃迁的数据更新 → 三件套（功能描述+技术实现要点+异常处理）"
    判断标准表: "是否触发聚合根状态跃迁：是→业务流程；否（含纯查询/无跃迁写入）→业务操作"
  业务流程清单_cols: ["流程编号（FL-{缩写}-{序号}）", "流程名称", "触发场景（引用2章场景编号）", "操作角色", "版本归属"]
  业务操作清单_cols: ["操作编号（共用FL-{缩写}-{序号}体系）", "操作名称", "操作角色", "版本归属"]
  流程编号规则: "顶层FL-{缩写}-{序号}，子流程加点分如FL-TL-01.1，体现总分关系；业务操作与业务流程共用此编号体系"
  总分图原则:
    - "总图：端到端全景，用活动图"
    - "分图：跨组件协作用时序图，单一参与者活动展开用活动图"
    - "接口内部步骤不在本章展开，在第6章"
  流程拆分判断: "多个独立触发时机或不同参与者组合→拆分；同一事件同一事务→合并"
  业务流程四件套:
    概述: "流程目标+触发条件+结束条件"
    流程图: "ASCII图，未来版本仅保留概述和总图"
    步骤表_cols: ["步骤号（分支用1a/1b）", "步骤名称（动宾结构）", "执行者", "输入", "输出", "业务规则引用（如TN-R-04，无则-）"]
    异常处理表_cols: ["异常场景", "检测时机（步骤号）", "处理策略", "补偿操作", "最终状态"]
  业务操作三件套:
    功能描述: "列表形式：功能目标+使用角色+接口对应（引用第6章）+触发路径（按需）"
    技术实现要点: "查询路由/缓存策略/安全保障/分页策略等关键实现细节；逻辑简单（仅DB读取无特殊策略）时可省略"
    异常处理: "简要表格，列：异常场景+处理策略"
  异常完备性检查: "业务流程须覆盖：①参数/业务规则校验失败；②外部服务超时/失败；③状态非法转换；④并发冲突；⑤基础设施故障"
  多阶段流程: "步骤表可增加'阶段'列，圆圈数字标注（①②③）"

# ── 第4章 领域模型设计 ──
ch4_领域模型设计:
  structure: "4.1聚合概述 / 4.2各聚合详细定义（三表模型） / 4.3状态机定义 / 4.4值对象定义 / 4.5领域服务 / 4.6领域事件清单"
  聚合设计五原则:
    - "原则1：聚合内共同维护一个业务不变性"
    - "原则2：代表完整业务概念"
    - "原则3：尽量小（实体≤5，值对象≤10）"
    - "原则4：跨聚合通过ID引用，禁止直接对象引用"
    - "原则5：边界不跨微服务/BC/数据库"
  聚合边界判断:
    同一聚合: "事务一致性必须一致、与聚合根同生同灭、同频变更、总是一起加载"
    独立聚合: "可接受最终一致、有独立生命周期、变更频率显著不同、经常独立访问"
  聚合清单表_cols: ["聚合根（PascalCase）", "包含实体", "包含值对象", "核心不变式", "版本（如P1）"]
  聚合关系图: "ASCII图，聚合用方框，虚线箭头标ID引用方向；图后可附设计决策说明段落"
  三表模型:
    属性清单表_cols: ["属性名（camelCase）", "数据类型（Java类型或值对象类型）", "约束（含条件约束如'当credType=X时必填'）", "默认值", "业务含义", "版本"]
    业务规则表_cols: ["规则编号（{缩写}-R-{序号}，全BC唯一）", "规则名称（动宾结构）", "规则简述（'当…→…'格式）", "验证时机", "违反后果（错误码）", "版本"]
    业务方法表_cols: ["方法名（含签名）", "方法简述", "关联规则（规则编号）", "异常", "事件", "版本"]
  业务规则粒度: "一条规则对应一个可独立验证的业务约束；含'且/或'多个独立条件须拆分"
  值对象分类:
    简单值对象: "字段<3且无业务方法：仅属性表，方法表注明'由聚合根管理'"
    含业务方法值对象: "完整三表模型"
    嵌套值对象: "属性表约束列用条件表达式说明"
  状态机定义:
    触发条件: "存在守卫条件约束的转换规则→定义状态机；仅展示标记型→不需要"
    状态枚举表_cols: ["状态值（枚举常量名）", "状态名称", "说明", "是否终态"]
    状态转换规则表_cols: ["当前状态", "事件", "目标状态", "守卫条件（无则-）", "副作用（无则-）"]
    状态机图: "ASCII图，节点=状态，有向边=转换，边标签='事件[守卫条件]'"
    rule: "一个聚合根如有多个独立状态维度，每个维度独立定义状态机"
  领域服务清单表_cols: ["服务名（以DomainService结尾）", "职责简述", "所协调的聚合"]
  领域服务方法表_cols: ["方法签名", "业务语义", "所协调的聚合及操作", "关联规则"]
  领域服务判断: "逻辑不自然归属任何聚合根→领域服务；仅涉及单聚合内部→聚合根方法"
  领域事件清单表_cols: ["事件名称（{Aggregate}{Action}edEvent过去式）", "触发时机", "发布聚合", "消费方", "版本（v1/v2）"]
  副作用隔离: "领域层禁止数据库读写/外部服务调用/消息发送/缓存操作；可收集领域事件和业务计算"
  其他规则:
    - "业务规则编号全BC唯一，各设计单元使用不同前缀"
    - "每个领域事件必须包含：eventId、eventVersion、occurredOn、aggregateId、aggregateType"
    - "Payload和消费方契约在第6章消息接口设计中定义"

# ── 第5章 应用层设计 ──
ch5_应用层设计:
  structure: "5.1应用层职责说明 / 5.2应用服务清单 / 5.3命令对象设计 / 5.4查询对象设计"
  应用层职责:
    承担: ["用例编排", "事务边界定义", "权限校验（前置）", "DTO转换（入参转Command/出参转DTO）", "领域事件收集发布"]
    不承担: ["业务逻辑（领域层）", "业务校验（领域层）", "数据持久化（基础设施层）", "HTTP处理（接口层）"]
  应用服务方法清单表_cols: ["方法名（含签名）", "方法简述", "关联用例（第2章场景编号）", "事务类型（读写/只读）", "异常"]
  协调步骤备注:
    rule: "满足以下任一条件才附步骤说明：①跨聚合校验或操作；②外部服务调用；③长流程触发；④分布式锁或事务补偿"
    format: "以'{方法名}协调步骤：'为标题，有序列表，通常6~10步，不展开代码级细节"
  Command对象:
    命名规范: "{动作}{聚合名}Command，如CreateTenantCommand"
    字段表_cols: ["字段名（camelCase）", "数据类型", "必填（是/否/系统注入）", "约束", "业务含义"]
  Query对象:
    命名规范: "{聚合名}{条件}Query，如TenantListQuery"
    字段表_cols: "同Command（字段名/数据类型/必填/约束/业务含义）"
  拆分粒度:
    应用服务: "一个应用服务对应一个聚合根或一组高度关联的用例；方法数超10个须评估按用例群拆分"
    Command_Query: "一个写操作对应一个Command；一个查询场景对应一个Query"
  key_rules:
    - "一个方法对应一个用例，一个事务"
    - "应用层是'薄'层：大量if-else业务分支说明逻辑泄漏，须重构回领域层"
    - "系统注入字段（operatorId/tenantId）在约束列标注'系统注入'，前端不传"
    - "不写Java接口或类代码，仅通过表格定义契约"
    - "每个方法可追溯到第2章场景索引或第3章流程步骤"
    - "当前版本完整展开；未来版本仅保留方法名和简述"

# ── 第6章 接口设计 ──
ch6_接口设计:
  structure: "6.1接口总览（三张分类清单） / 6.2 RPC接口设计 / 6.3消息接口设计 / 6.4 RESTful API设计"
  接口编号规则:
    "P-{缩写}-{序号}": "RESTful API（供给侧）"
    "T-{缩写}-{序号}": "RESTful API（租户侧）"
    "PUB-{缩写}-{序号}": "RESTful API（公共）"
    "RPC-{缩写}-{序号}": "RPC接口"
    "MSG-{缩写}-{序号}": "消息接口"
  接口总览三张表:
    RESTful清单_cols: ["接口编号", "接口名称", "方法（HTTP Method）", "路径", "权限码（无则-）", "应用方法（追溯关键字段）", "版本"]
    RPC清单_cols: ["接口编号", "接口名称", "调用方", "说明", "版本"]
    消息清单_cols: ["接口编号", "消息名称", "方向（发布/订阅）", "Topic", "消费方", "版本"]
  RPC接口:
    方法清单表_cols: ["方法名（Feign签名）", "功能简述", "入参", "返回值", "异常"]
    降级策略表_cols: ["方法名", "降级条件", "降级返回值", "业务影响"]
    rule: "降级策略是必备内容，每个RPC方法都必须有降级方案"
  消息接口:
    概述表_cols: ["消息编号（MSG-{缩写}-{序号}）", "消息名称", "Topic", "消费方", "触发时机"]
    Payload字段表_cols: ["字段名（camelCase）", "数据类型", "必填", "业务含义"]
    Payload基础字段: "必须包含：eventId（幂等用）、eventVersion、occurredOn、aggregateId、aggregateType"
    消费方处理契约表_cols: ["消费方", "处理逻辑", "幂等策略（如基于eventId去重）", "失败处理（重试次数/死信队列）"]
    版本管理: "新增可选字段→向后兼容无需升版；删除或修改已有字段→破坏性变更，新建类型并保留旧版过渡期"
  RESTful_API五件套:
    "①接口概述表（键值对）":
      必填字段: ["接口编号", "方法/路径（如'POST /api/v1/tenants'）", "权限码", "应用方法（如AppService.createTenant(cmd)）"]
      可选字段: ["频率限制"]
      路径参数: "路径含{xxx}占位符时，在概述表后列参数表；无则省略"
    "②请求参数表":
      "GET/DELETE（Query参数）_cols": ["参数名", "类型", "必填", "默认值", "说明"]
      "POST/PUT/PATCH（Body参数）_cols": ["字段名", "类型", "必填", "约束", "说明"]
    "③响应体表（data部分）_cols": ["字段名", "类型", "必有", "说明"]
    "④处理逻辑": "有序编号列表，3~8步，不展开代码级；纯查询简单时可省略"
    "⑤异常映射表_cols": ["异常场景", "HTTP状态码", "错误码", "错误信息"]
  key_rules:
    - "应用方法是追溯链关键字段，不可省略"
    - "⑤异常映射表须覆盖该接口所有可能业务异常场景，不遗漏"
    - "通用响应格式、接口版本管理、通用错误码引用BC总体设计，本章不重复定义"
    - "当前版本API完整五件套；未来版本API仅保留接口概述表"

# ── 第7章 数据模型设计 ──
ch7_数据模型设计:
  structure: "7.1领域模型-数据模型映射 / 7.2表结构设计 / 7.3表关系图（ASCII ER图）/ 7.4 DDL脚本"
  映射关系表_cols: ["领域对象", "对象类型（聚合根/实体/值对象）", "映射方式", "目标表", "说明"]
  映射方式判断:
    独立表: "聚合根、有独立生命周期的实体"
    嵌入主表: "值对象字段<5且无集合语义"
    JSON列: "值对象结构复杂但无需独立查询"
    关联表: "值对象为集合类型或多对多关系"
    ES索引: "需全文检索或复杂聚合查询（注明ES索引名和存储策略）"
  字段定义表_cols: ["字段名（snake_case）", "数据类型（MySQL如VARCHAR(64)）", "可空（YES/NO）", "默认值", "说明（含枚举值）", "版本"]
  公共审计字段: "每张表必含：created_by、created_at、updated_by、updated_at；逻辑删除加deleted；乐观锁加version"
  索引设计表_cols: ["索引名（idx_/uk_前缀）", "索引字段（复合索引标顺序）", "类型（主键/唯一/普通/复合）", "说明（使用场景）"]
  key_rules:
    - "领域模型-数据模型映射表是本章核心，解释值对象字段平铺到主表的原因"
    - "嵌入式值对象字段命名用统一前缀（如contact_name）"
    - "枚举字段在说明列列出所有枚举值"
    - "主表字段>30→评估拆分；单表索引数宜≤5"

# ── 第8章 前端交互设计 ──
ch8_前端交互设计:
  structure: "8.1页面总览（清单表+导航结构图） / 8.2页面详细设计 / 8.3汇总收尾（页面接口映射+功能操作汇总）"
  页面清单表_cols: ["页面编号（PG-{池}-{领域缩写}-{序号}）", "页面名称", "用户群（provider/ur/uc/公共）", "路由路径", "说明"]
  页面编号规则: "PG-{池P/UR/UC/PUB}-{领域缩写}-{序号01起}"
  单页面必含子节:
    必选: ["页面说明（用途/入口/权限）", "页面布局（ASCII线框图）", "功能说明表"]
    按需: ["搜索条件表（列表页）", "列表字段表（列表页）", "状态/标签展示表（有枚举状态列）", "交互规则（特殊交互）", "详情弹窗/抽屉"]
  功能说明表_cols: ["功能编号（F{两位序号}）", "功能类型（展示/操作）", "功能名称", "说明", "关联API（接口编号，无则-）", "前置条件（权限码或交互条件，无则-）"]
  搜索条件表_cols: ["字段名", "组件类型（Input/Select/DateRange等）", "数据来源", "默认值", "说明（匹配方式/枚举值）"]
  列表字段表_cols: ["字段名", "列宽（px或auto）", "对齐（左/中/右）", "是否排序", "说明"]
  状态标签表_cols: ["枚举值", "标签文本", "颜色（success/warning/danger/info）"]
  汇总表:
    页面接口映射_cols: ["页面编号", "页面功能", "调用接口（编号+简要名）"]
    功能操作汇总_cols: ["功能编号（页面编号:F序号）", "所属页面", "功能类型", "功能名称", "关联API", "权限标识"]
  节引导语_rule: "第8章须以固定两行引导语开头：①'本节设计{设计单元名称}的前端页面，包括页面清单、页面结构和交互设计。'②一句话说明该设计单元前端的特点"
  key_rules:
    - "页面详细设计章节结构须与导航结构图完全一致"
    - "汇总收尾节不可省略"
    - "线框图聚焦布局与区域划分，不标注功能编号（功能编号只在功能说明表）"
    - "当前版本完整展开；未来版本仅保留页面清单"

# ── 第9章 后端工程结构设计 ──
ch9_后端工程结构设计:
  structure: "9.1模块划分 / 9.2包结构 / 9.3核心类清单 / 9.4关键类职责（按需） / 9.5配置文件结构（按需） / 9.6构建与部署（按需）"
  包结构分层:
    接口层: "controller、dto.request、dto.response"
    应用层: "service、command、query、assembler"
    领域层: "model.aggregate、model.entity、model.valueobject、event、service（领域服务）、repository（接口）"
    基础设施层: "repository.impl、mapper、gateway、config"
  模块职责表_cols: ["模块名（Maven/Gradle模块名称）", "职责", "依赖模块"]
  包路径表_cols: ["包路径（完整Java包路径）", "所属层", "职责"]
  核心类清单表_cols: ["类名（PascalCase）", "所在包", "类型（聚合根/实体/值对象/领域服务/应用服务/Controller/Repository/DTO等）", "职责简述"]
  核心类须覆盖: ["聚合根", "领域服务", "应用服务", "Controller", "Repository接口", "核心值对象"]
  防腐层Gateway清单_cols: ["Gateway接口名", "实现类名", "外部依赖", "方法概述"]
  防腐层_触发条件: "BC依赖多个外部系统并通过Gateway/防腐层模式隔离时补充"
  关键配置项表_cols: ["配置分组", "配置Key", "默认值", "说明（敏感配置注明'由配置中心管理'）"]
  多环境配置说明表_cols: ["环境（本地/开发/测试等）", "Profile（Spring Profile标识）", "配置文件（yaml路径或名称）", "说明（与生产环境的关键差异）"]
  Docker部署配置表_cols: ["配置项（基础镜像/JVM参数等）", "值", "说明（健康检查路径、端口映射等）"]
  key_rules:
    - "包结构体现DDD分层依赖方向：接口层→应用层→领域层←基础设施层（领域层不依赖外层）"
    - "核心类清单是'领域模型到代码'的追溯桥梁"
    - "如BC总体设计已定义Maven模块结构，9.1模块划分引用即可，仅补充差异"

# ── 第10章 前端工程结构设计 ──
ch10_前端工程结构设计:
  structure: "10.1目录结构设计 / 10.2类型定义 / 10.3路由配置 / 10.4页面与组件映射表"
  目录模块:
    API模块: "src/api/{BC目录}/，按资源分.ts文件，types/子目录存类型定义"
    页面组件: "src/views/{BC目录}/{用户群}/{领域}/，每页面独占目录以index.vue为入口"
    公共组件: "src/components/{领域}/，跨页面复用组件"
    权限常量: "src/permission/constants/或src/constants/"
    状态管理: "src/stores/modules/{BC目录}/，每聚合或功能模块一个.ts Store文件"
  页面组件映射表_cols: ["页面编号", "页面名称", "组件文件路径（相对src/）"]
  key_rules:
    - "路径分隔符统一用/，文件名kebab-case"
    - "类型定义文件与API模块一一对应，类型名以I前缀（如ITenantPolicy）"
    - "页面组件和API模块命名与第8章页面编号、第6章接口编号一一对应"

# ── 第11章 权限设计 ──
ch11_权限设计:
  structure: "11.1权限点定义 / 11.2角色权限矩阵 / 11.3 API权限映射 / 11.4数据权限规则（按需） / 11.5前端权限控制（有前端时必选）"
  权限编码规则: "三段式：模块:资源:操作（如tenant:tenant:create）"
  权限点清单表_cols: ["权限编码（三段式）", "权限名称", "模块", "资源", "操作（create/read/update/delete/export/manage等）"]
  角色权限矩阵: "行=权限编码，列=角色名称，单元格填Y或-；角色定义引用BC总体设计"
  API权限映射汇总表_cols: ["API编号", "API名称", "HTTP方法", "路径", "权限标识（三段式）"]
  数据隔离规则表_cols: ["数据类型", "隔离维度（租户级/部门级/个人级）", "隔离规则", "实现方式（如tenant_id=?）"]
  数据可见性规则表_cols: ["角色", "可见范围", "过滤条件（SQL）", "说明"]
  前端权限控制表_cols: ["页面（第8章编号）", "按钮/操作", "所需权限（三段式）", "无权限处理（隐藏/禁用）"]
  key_rules:
    - "所有接口都应关联权限编码，API权限映射汇总表须覆盖第6章全部API"
    - "本章仅定义本设计单元新增权限点和映射关系，不重复BC总体设计已定义内容"

# ── 第12章 单元测试设计 ──
ch12_单元测试设计:
  structure: "12.1测试范围与策略 / 12.2关键测试用例 / 12.3测试数据准备"
  测试范围表_cols: ["测试对象（类或组件名）", "测试类型（不变式/业务规则/状态转换/应用服务编排）", "优先级（高/中/低）", "说明"]
  优先级:
    高: "聚合根业务规则验证、状态机转换、核心不变式"
    中: "应用服务用例编排、领域服务跨聚合协调"
    低: "值对象自验证、DTO转换"
  测试用例表_cols: ["用例编号（TC-{缩写}-{序号}）", "测试类型", "被测对象", "测试场景（Given-When-Then）", "预期结果", "关联规则（无则-）"]
  测试用例分组: ["聚合不变式测试", "业务规则测试（正向+反向）", "边界条件测试", "状态转换测试（合法+非法）", "异常路径测试"]
  key_rules:
    - "每条业务规则至少一个正向用例和一个反向用例"
    - "状态机每条转换规则至少一个合法转换和一个非法转换"
    - "不写测试代码，仅通过表格定义测试设计"

# ── 第13章 Task细化 ──
ch13_Task细化:
  structure: "13.1 Task清单 / 13.2 Task依赖与开发顺序"
  Task汇总表_cols: ["Task编号（TK-{缩写}-{序号}）", "Task描述（动宾结构）", "对应User Story", "所属聚合/服务", "Task类型（领域层/应用层/接口层/基础设施层/前端/测试）", "预估工时（人天）"]
  Task依赖表_cols: ["Task编号", "前置Task（无则-）", "可并行（是/否）"]
  key_rules:
    - "每个Task须可追溯到User Story，该列不可为空"
    - "工作量粒度控制在1~3个工作日，超过3天必须拆分"
    - "依赖方向：领域层→应用层→接口层→前端；基础设施层（建表）通常最早启动"

# ── 附录A 专属错误码 ──
appendix_A_错误码:
  structure: "A.2 专属错误码清单（必选）/ A.1 枚举名称映射（按需）/ A.0 整体设计说明（按需，专属错误码≥20条或BC规模大时启用，含8个子节：设计原则/命名规范/号段规划/通用码引用/扩展规范/响应格式/前端处理指南/i18n）"
  错误码格式: "E-{3位HTTP状态码}{3位序号}，如E-409001；或含BC编号如E-40935001"
  分类:
    参数校验错误: "HTTP 400"
    冲突错误: "HTTP 409（唯一性约束或乐观锁冲突）"
    业务逻辑错误: "HTTP 422（业务规则校验失败）"
    基础设施错误: "HTTP 500"
  专属错误码清单表_cols: ["错误码", "HTTP状态码", "错误名称", "错误描述（面向开发者）", "触发条件", "版本"]
  枚举映射表_cols: ["错误码", "Java枚举名（UPPER_SNAKE_CASE）", "错误描述"]
  key_rules:
    - "仅定义本设计单元专属错误码，通用错误码引用BC总体设计附录A"
    - "号段在BC总体设计中统一分配，禁止跨号段使用"
    - "每个API⑤异常映射表引用的错误码必须在本附录有对应定义"
    - "每个错误码可追溯到第4章业务规则'违反后果'列或第6章异常映射表"
    - "错误码支持i18n，错误描述面向开发者不作为用户提示语"
  推导顺序: "①第4章业务规则违反后果→②第6章API异常映射→③第4章状态机非法转换/第3章异常处理表"

# ── 附录B 按需 ──
appendix_B_按需:
  用途1_缓存与性能设计:
    缓存项清单表_cols: ["缓存项名称", "Key模板（如tenant:info:{tenantId}）", "数据来源", "数据结构（String/Hash等）", "TTL", "失效策略（主动删除/被动过期/定时刷新）", "一致性保证方式"]
    性能优化措施表_cols: ["优化场景", "性能目标（引用BC总体设计第9章）", "优化方案", "实现要点"]
    一致性策略: "强一致→写时删除+读时回填；最终一致→设置TTL+异步刷新；高并发读→缓存预热+多级缓存"
  用途2_业务规则索引_cols: ["规则编号", "规则名称", "所属聚合", "定义章节（第4章小节）", "版本"]

# ── 附录C 按需 ──
appendix_C_按需:
  用途1_术语表_cols: ["术语", "英文", "简要说明", "来源（本设计单元定义/引用BC总体设计X.X节）"]
  用途2_版本规划追溯矩阵_cols: ["设计元素类型", "P1设计数量", "P2+新增", "说明（各版本主要元素清单摘要）"]
  术语表规则: "仅收录本设计单元核心术语，不重复BC总体设计已定义术语，不含通用DDD技术术语"

# ── 追溯链要求 ──
traceability:
  rule: "文档各层次必须形成可追溯链"
  chain:
    - "场景索引（第2章）→ 流程设计（第3章）→ 领域模型（第4章）"
    - "业务规则（第4章）→ 应用服务方法（第5章）→ 接口（第6章）→ 错误码（附录A）"
    - "领域事件（第4章）→ 消息接口（第6章）"
    - "接口（第6章）→ 权限（第11章）→ 前端功能（第8章）"
    - "Task（第13章）→ User Story（需求文档）"
  key_traceability_fields:
    - "第5章应用服务方法：'关联用例'列不可省略"
    - "第6章接口概述表：'应用方法'列不可省略"
    - "第8章功能说明表：'关联API'和'前置条件'列建立前后端追溯"
    - "第13章Task：'对应User Story'列不可为空"
