# 监管条文结构化拆解 Schema
# 来源规范：projects/ClariSphere/outputs/监管条文拆解指南_v0.03@202603140933.md
# 用途：AI 执行条款拆解时加载此 schema，替代完整规范，提供结构约束与词库枚举
# 完整规则（详细说明和更多示例）：见原规范文件

doc_id: GUIDE-REG-001
doc_name: 监管条文结构化拆解指南

# ══════════════════════════════════════════════
# 一、原子记录 JSON 结构（完整骨架）
# ══════════════════════════════════════════════
#
# 每条原子记录 = 一条条款中可独立理解且可独立落地的单条要求
# 一条条款可派生 1..N 条原子记录，所有派生记录共享相同 clause_code

json_skeleton: |
  {
    "regulation": {
      "clause_id": "",          // 存储键：系统回填，拆解时留空
      "clause_code": "",        // 必填：可读定位符，如 "数据安全法§29"
      "clause_contents": "",    // 必填：条款原文文本，供 AI 拆解时输入
      "clause_restored": "",    // 中间结果：省略还原后的条文（还原主体/客体/语法主语/隐含动词后的完整表述）
      "law_name": "",           // 必填：法规全称
      "effect_level": "",       // 必填：效力层级枚举（见下方 vocab.effect_level）
      "applicable_industry": [] // 必填：行业节点 id 列表，通用填 ["通用"]
    },
    "target": {
      "security_targets": []    // COAST 安全目标数组（见 vocab.coast），处罚条款可为 []
    },
    "consequence": {
      "legal_consequence": []   // 后果条款引用数组，如 ["数据安全法§48"]；无则 null
    },
    "subjects": [               // 必填：至少一个主体
      {
        "name":     "",         // 必填：条款原文实体名（逐字照录）
        "class":    "",         // 必填：归一化身份类型（见 vocab.identity）
        "category": "",         // 枚举：组织 / 岗位 / 角色
        "attributes": [
          { "attr": "职责", "value": ["R"], "required": true },  // RACISV 枚举，必填
          { "attr": "规模", "value": "",    "required": false }, // 阈值型自由文本，可省略
          { "attr": "属地", "value": "",    "required": false }  // 枚举：境内 / 境外，可省略
        ]
      }
    ],
    "object": [                 // 客体数组；无客体时为 null
      {
        "name": "",             // 必填：条款原文客体名（逐字照录）
        "code": "",             // DASPR 编码（见 vocab.daspr）；DASPR 无法覆盖时填 null（如治理事务类客体）
        "attributes": [
          { "attr": "状态", "value": "",  "required": false }, // 见各资产状态集
          { "attr": "规模", "value": "",  "required": false }, // 阈值型自由文本
          { "attr": "分级", "value": "",  "required": false }, // 格式：{体系}: {值}
          { "attr": "属地", "value": "",  "required": false }  // 枚举：境内 / 境外
        ]
      }
    ],
    "action": "",               // 归一化动词（见 vocab.verbs）；subjects(R) + object 同时存在时必填，否则 null
    "environment": {
      "resource_env": [],       // DASPR 编码列表（充当基础设施上下文）；无则 null
      "deployment_env": [       // 部署属性数组；全部可选，无限定则 null
        { "attr": "边界",     "value": "", "required": false },
        { "attr": "阶段",     "value": "", "required": false },
        { "attr": "承载方式", "value": "", "required": false },
        { "attr": "属地",     "value": "", "required": false }
      ]
    },
    "condition": {
      "trigger_event": "",      // 自由文本：义务激活的动态事件；无则 null
      "exception":     ""       // 自由文本：豁免条件；无则 null
    },
    "control": {
      "mechanisms": {
        "T": [],                // 技术控制机制（见 vocab.control_T）
        "M": [],                // 管理控制机制（见 vocab.control_M）
        "G": []                 // 治理控制机制（见 vocab.control_G）
      },
      "attributes": [
        { "attr": "义务模态", "value": "应",  "required": true  }, // 必填
        { "attr": "时限",     "value": "",    "required": false },
        { "attr": "量化指标", "value": "",    "required": false }  // 数值型自由文本
      ]
    }
  }

# ══════════════════════════════════════════════
# 二、词库枚举
# ══════════════════════════════════════════════

vocab:

  # ── 效力层级 ──
  effect_level:
    - 法律
    - 行政法规
    - 部门规章
    - 国家标准
    - 行业标准
    - 团体标准

  # ── 主体·身份词库 ──
  identity:
    运营主体:
      - 网络运营者【组织】
      - 数据处理者【组织】
      - 重要数据处理者【组织】
      - 个人信息处理者【组织】
      - 关键信息基础设施运营者【组织】
    机构主体:
      - 数据交易中介机构【组织】
      - 国家机关【组织】
      - 行业主管部门【组织】
      - 统筹协调机构【组织】
    泛化角色:
      - 受托方【角色】
      - 任何组织或个人【角色】
      - 境内组织或个人【角色】
    内部岗位:
      - 数据安全负责人【岗位】
      - 直接负责的主管人员【岗位】
      - 直接责任人员【岗位】
    外部机构:
      - 监管机构【组织】
      - 第三方服务商/外包【组织】
      - 云服务商【组织】
      - 合作伙伴/数据接收方【角色】
      - 境外接收方【角色】
      - 评估/认证机构【组织】
    数据主体:
      - 用户/个人信息主体【角色】

  # ── 主体·职责（RACISV） ──
  racisv:
    R: 执行者（直接责任，主要责任）
    A: 负责人（管理责任，每条义务只能有1个A）
    C: 顾问（技术/建议责任，双向沟通）
    I: 知情者（无问责，单向通知）
    S: 审批者（管理/领导责任，含会签和终审）
    V: 验证者（监督责任）

  # ── 归一化动词 ──
  verbs:
    - 建立   # 建立健全、制定、设置、设立、构建
    - 开展   # 开展、实施、执行、落实、组织
    - 处理   # 处理（数据）、使用、加工、存储
    - 监测   # 监测、监控、检查、扫描
    - 评估   # 评估、审查、核查、测试
    - 报告   # 报告、告知、通报、公开、披露
    - 配合   # 配合、提供（数据/材料）、提交
    - 承担   # 承担、负责、担任
    - 取得   # 取得、具备、持有
    - 提供   # 提供（服务）、提供（数据）
    - 处置   # 处置、采取措施、补救
    - 变更   # 变更、修改、调整、升级

  # ── 行为·IT/M 管理事项 ──
  matters_ITM:
    - 风险评估
    - 安全审计/检查
    - 安全培训/意识教育
    - 应急演练
    - 变更管理
    - 供应商/第三方管理
    - 事件管理/响应
    - 资产管理
    - 介质管理
    - 人员管理
    - 物理环境管理
    - 安全评估/测评
    - 数据分类分级
    - 跨境传输管理
    - 制度建设/文档管理  # 仅用于无具体R类文档客体的抽象制度建设义务

  # ── 行为·IT/G 治理事项 ──
  matters_ITG:
    - 岗位/角色设置
    - 职责分配
    - 汇报机制
    - 决策权限
    - 资源保障
    - 组织架构
    - 责任制度

  # ── 客体编码体系总览 ──
  object_coding:
    IT/R: DASPR 编码（见 vocab.daspr；格式 D1/A2/R1 等）
    IT/M: M- 前缀编码（见 vocab.obj_itm；格式 M-风险评估 等）
    IT/G: G- 前缀编码（见 vocab.obj_itg；格式 G-组织架构 等）
    # DASPR 无法覆盖时 code 填 null，并在 name 中保留原文

  # ── IT/M 客体编码 ──
  obj_itm:
    - M-风险评估
    - M-安全审计/检查
    - M-安全培训/意识教育
    - M-应急演练
    - M-变更管理
    - M-供应商/第三方管理
    - M-事件管理/响应
    - M-资产管理
    - M-介质管理
    - M-人员管理
    - M-物理环境管理
    - M-安全评估/测评
    - M-数据分类分级
    - M-跨境传输管理
    - M-制度建设/文档管理

  # ── IT/G 客体编码 ──
  obj_itg:
    - G-岗位/角色设置
    - G-职责分配
    - G-汇报机制
    - G-决策权限
    - G-资源保障
    - G-组织架构
    - G-责任制度

  # ── IT/R 资源域词库（DASPR） ──
  daspr:
    D:  # 数据层
      D1:  {name: 个人信息,     states: [采集, 传输, 存储, 使用, 共享, 出境, 删除/销毁]}
      D2:  {name: 敏感个人信息, states: [采集, 传输, 存储, 使用, 共享, 出境, 删除/销毁]}
      D3:  {name: 重要数据,     states: [采集, 传输, 存储, 使用, 共享, 出境, 删除/销毁]}
      D4:  {name: 核心数据,     states: [采集, 传输, 存储, 使用, 共享, 出境, 删除/销毁]}
      D5:  {name: 政务数据,     states: [采集, 传输, 存储, 使用, 共享, 出境, 删除/销毁]}
      D6:  {name: 一般业务数据, states: [采集, 传输, 存储, 使用, 共享, 出境, 删除/销毁]}
      D7:  {name: 日志数据,     states: [生成, 存储, 分析, 归档, 删除]}
      D8:  {name: 鉴别信息,     states: [生成, 传输, 存储, 使用, 变更, 销毁]}
      D9:  {name: 配置数据,     states: [创建, 变更, 存储, 备份, 恢复]}
    A:  # 应用层
      A1:  {name: 业务应用系统,     states: [规划, 开发, 测试, 部署, 运行, 变更, 下线]}
      A2:  {name: 基础设施平台,     states: [规划, 开发, 测试, 部署, 运行, 变更, 下线]}
      A3:  {name: 数据库,           states: [部署, 运行, 维护, 备份, 迁移, 下线]}
      A4:  {name: 中间件与接口,     states: [规划, 开发, 测试, 部署, 运行, 变更, 下线]}
      A5:  {name: 关键信息基础设施, states: [规划, 开发, 测试, 部署, 运行, 变更, 下线]}
    S:  # 系统层
      S1:  {name: 内部网络,   states: [规划, 建设, 运行, 维护, 变更], note: 作为保护/管理对象时使用客体，否则用部署环境·边界}
      S2:  {name: 互联网,     states: [接入, 运行, 维护],             note: 同 S1}
      S3:  {name: 通信链路,   states: [建立, 运行, 维护, 变更]}
      S4:  {name: 无线网络,   states: [部署, 运行, 维护]}
      S5:  {name: 边界/DMZ,   states: [部署, 运行, 维护, 变更],       note: 同 S1}
      S6:  {name: 服务器,     states: [采购, 部署, 运行, 维护, 报废]}
      S7:  {name: 用户终端,   states: [采购, 注册, 使用, 维护, 报废]}
      S8:  {name: 移动设备,   states: [注册, 使用, 回收]}
      S9:  {name: 移动存储介质, states: [采购, 登记, 使用, 销毁]}
      S10: {name: IoT设备,    states: [部署, 运行, 维护, 报废]}
    P:  # 物理层
      P1: {name: 机房/数据中心, states: [规划, 建设, 运行, 扩容, 退役]}
      P2: {name: 办公场所,      states: []}
      P3: {name: 灾备中心,      states: [规划, 建设, 运行, 扩容, 退役]}
    R:  # 文档层
      R1: {name: 安全策略/制度文件, states: [制定, 发布, 评审, 修订, 废止]}
      R2: {name: 技术方案/报告,     states: [编制, 评审, 归档]}
      R3: {name: 审计报告,          states: [编制, 评审, 归档]}
      R4: {name: 应急预案,          states: [制定, 评审, 演练, 修订]}
      R5: {name: 操作记录/日志,     states: [生成, 留存, 审查, 归档, 销毁]}

  # ── 客体·分级参考词库 ──
  object_classification:
    数安: [核心数据, 重要数据, 一般数据]
    等保: [等保一级, 等保二级, 等保三级, 等保四级]
    个保: [敏感个人信息, 一般个人信息]
    # 格式："{体系}: {值}"，如 "数安: 重要数据"

  # ── 环境·部署属性枚举 ──
  deployment_env:
    边界:     [内网, 外网, DMZ, 有线网络, 无线网络]
    阶段:     [开发, 测试, 预发布, 生产]
    承载方式: [公有云, 私有云, 混合云, 本地IDC]
    属地:     [境内, 境外, 跨境]

  # ── 控制·T 类技术机制 ──
  control_T:
    # 默认标到一级；条文明确指定具体手段时才标二级
    - 身份鉴别          # 二级示例：口令认证、多因素认证、生物识别、数字证书、单点登录
    - 访问控制          # 二级示例：自主/强制/基于角色的访问控制、最小权限、权限回收
    - 密码/加密         # 二级示例：TLS、存储加密、端到端加密、数字签名、密钥管理、国密算法
    - 安全审计/日志     # 二级示例：操作审计、安全事件日志、数据库审计、日志集中管理
    - 入侵防范          # 二级示例：IDS、IPS、WAF、蜜罐
    - 恶意代码防护      # 二级示例：防病毒、EDR、沙箱检测
    - 网络隔离/分段     # 二级示例：VLAN、网络分区、微隔离、物理隔离、逻辑隔离
    - 数据脱敏/去标识化 # 二级示例：静态脱敏、动态脱敏、匿名化、假名化
    - 数据备份/恢复     # 二级示例：全量备份、增量备份、异地备份、恢复验证
    - 冗余/容灾         # 二级示例：双机热备、异地容灾、负载均衡、业务连续性
    - 安全监测/态势感知 # 二级示例：流量监测、异常行为分析、态势感知平台、告警
    - 漏洞管理/补丁     # 二级示例：漏洞扫描、补丁管理、渗透测试
    - 安全配置/基线     # 二级示例：安全基线、配置核查、最小安装、默认账户处理
    - 接口安全/API安全  # 二级示例：接口认证、鉴权、传输加密、接口审计、限流/防重放
    - 开发安全/代码安全 # 二级示例：安全编码规范、代码审计、SAST/DAST、开源组件管理

  # ── 控制·M 类管理机制 ──
  control_M:
    - 审批/授权
    - 四眼原则/双人复核
    - 定期审查/复审
    - 合同约束/SLA
    - 背景审查/尽职调查
    - 保密协议/NDA
    - 准入审查/白名单
    - 台账/登记
    - 备案/报告
    - 演练/测试验证
    - 分类分级标识

  # ── 控制·G 类治理机制 ──
  control_G:
    - 职责分离
    - 授权矩阵
    - 升级机制
    - 考核/问责
    - 委员会决策
    - 资源配额/预算控制

  # ── 控制·义务模态 ──
  obligation_modality:
    应:   {keywords: [应, 应当, 须, 必须],     meaning: 强制作为}
    不得: {keywords: [不得, 不应, 禁止, 严禁], meaning: 强制不作为}
    可以: {keywords: [可以, 可],               meaning: 授权许可，非强制}
    宜:   {keywords: [宜, 鼓励, 支持],         meaning: 推荐做法，非强制}

  # ── 控制·时限 ──
  time_limit:
    - 立即   # 事件发生后须即刻执行，无延迟
    - 及时   # 合理时间内尽快执行（条文未指定具体时限）
    - 定期   # 按固定周期执行，需标注周期，如"每年一次"
    - N日内  # 在指定天数内完成，N 填具体数字

  # ── 安全目标词库（COAST） ──
  coast:
    主体安全:
      身份真实性: [来源权威性, 凭证真实性]
      身份有效性: [实体绑定性, 状态有效性]
    行为安全:
      行为可验证性: [行为可追溯, 行为可审计, 行为抗抵赖]
      行为可预期性: [行为一致性]
    客体安全:
      数据安全性: [数据保密性, 数据完整性, 数据可用性]
      数据隐私性: [处理受限性, 主体参与性, 过程透明性, 结果公平性]
    通信安全:
      信道安全性: [信道保密性, 传输完整性, 网络隔离性]
      端点可信性: [端点真实性, 接口安全性]
    协作安全:
      协作透明性: [数据可溯源]
      协作私密性: [协作可私密, 协作抗串通]
    环境安全:
      平台可信性: [运行环境可信, 运行状态可信, 供应依赖可信]
      资源可控性: [资源隔离性, 访问可控性]
      平台稳定性: [风险可预性, 威胁防御性, 故障恢复性, 安全事件响应]
    管控安全:
      规则明确性: [策略完备性, 标准一致性, 要求清晰性]
      分工合理性: [职责分离性, 权责匹配性, 授权合理性]
      执行有效性: [落实到位性, 监督持续性, 改进闭环性]
    # 格式："{一级} > {二级} > {三级}"，尽量填到三级；跨多个三级可停留二级

  # ── 行业清单树（初始节点） ──
  industry:
    通用: 全行业适用（不限行业的法规）
    JR:  金融
    YD:  通信
    WS:  卫生
    NB:  能源
    JT:  交通运输
    MH:  民用航空

# ══════════════════════════════════════════════
# 三、拆解规则
# ══════════════════════════════════════════════

rules:

  # ── clause_type 与字段填写规则 ──
  clause_type_rules:
    义务条款:
      control: 必填（义务模态必填；T/M/G mechanisms 按条文内容填写，无控制措施时为空数组）
    职责定义条款:
      control: null（职责条款为陈述句，无规范性情态，不涉及控制手段）
      object.attributes: 空数组（条文未描述资产生命周期状态时不填）

  # ── 原子化基准 ──
  atomization:
    unit: 以可独立定位的最小编号节点为读入单元（一个处理单元可产出 1..N 条原子记录）
    grain:
      法律/行政法规/部门规章: 条（第X条）
      国家/行业标准:          最小数字编号节（如 8.1.4.1）
      通知/发文:              最小编号层级
    split_when:
      - 条文涉及多个不同 R 角色 → 每个执行者单独一条
      - 义务模态混合（应与不得并存）→ 按模态各一条
      - 存在不同触发事件 → 每个触发事件一条
      - 含证据要求（如留存操作记录）→ 证据要求单独一条

  # ── 跳过条款类型 ──
  skip_types:
    - 定义条款（无义务，仅定义术语）
    - 政策宣示（无可验证合规动作）
    - 立法目的（无义务）
    - 纯授权条款（义务在子法规中）

  # ── 省略还原 ──
  omission_restore:
    主体省略:     从章节标题或适用范围条款推断
    客体省略:     从动词和上下文推断处理对象
    语法主语偏移: 活动名称作主语时还原真正的执行者（如"变更管理应……"→负责变更管理的组织）
    隐含义务动词: '"是……"句式还原为"应当承担……"'

  # ── 关键判断规则 ──
  key_rules:
    动词必填条件: 主体(R角色)和客体同时存在时必填
    行为域判定:
      IT/R: 作用对象是 DASPR 资产
      IT/M: 作用对象是管理活动
      IT/G: 作用对象是治理结构
    客体vs资源环境:
      客体:     条款要求对该资产进行保护/部署/审计
      资源环境: 该资产描述义务发生的基础设施上下文（如"在云上部署的系统"）
    DASPR颗粒度就高: 原文为"敏感个人信息"时标 D2，不标 D1
    控制机制层级: 默认标到T类一级；条文明确指定具体手段时才标二级
    声明性目标条款: 控制机制可为空数组，义务模态仍需填写

  # ── 行为域与字段对应 ──
  domain_field_mapping:
    IT/R: {object: DASPR资产（必填）,      matter: null（资产由客体承载）}
    IT/M: {object: DASPR资产或null（可选）, matter: matters_ITM中的事项}
    IT/G: {object: DASPR资产或null（可选）, matter: matters_ITG中的事项}
  # object 补充说明：
  #   - 三个域均允许有 object；domain 描述动作性质，object 描述作用对象，两者正交
  #   - IT/R：object 为保护/处理的核心资产，必填
  #   - IT/M：object 为管理活动的承载文档（如 R 类文档），可选
  #   - IT/G：object 为治理动作的产出文档或制度载体（如策略文件、方针），可选

  # ── 归一化检查清单 ──
  normalization_checklist:
    - 身份类型已对照 vocab.identity 归一化
    - 客体编码已映射至 DASPR（颗粒度就高）
    - 属性值已匹配对应枚举词库
    - 控制机制已规范为 T/M/G 前缀 + 一级词条

# ══════════════════════════════════════════════
# 四、regulation 扩展字段说明
# ══════════════════════════════════════════════

clause_contents_spec:
  field: clause_contents
  label: 条款内容
  location: regulation 对象内
  type: string
  required: true
  description: >
    存储条款原文文本，作为 AI 执行拆解操作的输入源。
    拆解时，AI 从此字段读取原文，依据本 schema 的拆解规则和词库，
    将原文映射到九个维度组，产出原子记录。
  note: >
    存储侧：clause_contents 与其他展示键（law_name、effect_level 等）
    同存于条款表，不随原子记录冗余。JSON 展示形态中保留此字段以便 AI 溯源。

clause_restored_spec:
  field: clause_restored
  label: 省略还原结果
  location: regulation 对象内，紧跟 clause_contents 之后
  type: string
  required: false  # 原文无省略时可与 clause_contents 相同或留空
  description: >
    拆解前置步骤"省略还原"的中间结果：AI 将 clause_contents 中隐含的主体、
    客体、语法主语、义务动词等补全后，写成完整自然语言表述，存入此字段。
    九维展开直接以 clause_restored 为输入，而非原文。
  restore_rules:
    主体省略:     从章节标题或适用范围条款推断后，显式补入主语
    客体省略:     从动词和上下文推断处理对象后，显式补入宾语
    语法主语偏移: 活动名称作主语时，还原为真正的执行者（如"变更管理应……"→"负责变更管理的组织应……"）
    隐含义务动词: '"是……安全第一责任人"句式还原为"应当承担……安全责任"'
  example:
    clause_contents: "开展数据处理活动应当加强风险监测，发现数据安全缺陷、漏洞等风险时，应当立即采取补救措施。"
    clause_restored:  "数据处理者开展数据处理活动应当加强风险监测，发现数据安全缺陷、漏洞等风险时，数据处理者应当立即采取补救措施。"
