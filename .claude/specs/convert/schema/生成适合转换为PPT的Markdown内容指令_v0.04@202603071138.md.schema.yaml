# TW-FMT-PPT-01 Markdown 转 PPT 内容格式规范 — Schema
# 来源规范：specs/convert/outputs/生成适合转换为PPT的Markdown内容指令_v0.04@202603071138.md
# 用途：AI 执行 /md-to-ppt-content 时加载此 schema，提供内容转换约束
# 版本：0.04（2026-03-07）

doc_id: TW-FMT-PPT-01
doc_name: Markdown 转 PPT 内容格式规范

# ── 执行原则 ──
principles:
  - 保持原文档章节顺序和核心观点
  - 不忽略、跳过或删减原文档内容；内容过多时分页
  - 每页内容适合一个 PPT 页展示
  - 段落文字转为结构化要点
  - 以标注形式提供 PPT 可视化建议

# ── 标题层级映射 ──
heading_mapping:
  "#": { ppt_type: 封面页, count: 1, note: "包含标题、副标题、日期" }
  "##": { ppt_type: 章节分隔页, count: 不限, note: "大章节起始页，仅标题" }
  "###": { ppt_type: 标准内容页, count: 不限, note: "每个###独立成页" }
  "####": { ppt_type: 子页面, count: 可选, note: "标题显示为'主题/子主题'" }
  max_depth: 4

# ── 页面容量 ──
page_capacity:
  title_max_chars: 20
  bullet_count: { min: 3, standard: "4-6", max: 8 }
  bullet_chars: { min: 20, max: 60 }
  page_total_chars: { min: 350, max: 550, note: "不含代码和标注；目标填充率≥70%" }
  code_max_lines: 50
  list_nesting_max: 2
  char_count_rule: "标题+要点+补充说明；不计代码块、标注标签、分隔符"

# ── 内容密度参考 ──
density_tiers:
  - { tier: 标准密度, range: "400-550字", scenarios: "框架介绍、方法论说明、实施步骤" }
  - { tier: 中密度, range: "300-400字", scenarios: "要点列举、对比分析、案例说明" }
  - { tier: 低密度, range: "250-300字", scenarios: "数据展示、简单流程、关键结论" }
  - { tier: 极简, range: "<250字", scenarios: "章节封面、引用金句、单一图表" }

# ── 分页规则 ──
pagination:
  trigger: "要点数>8条 或 总字数>550字 或 单条>60字且要点>5条"
  strategy: "优先按逻辑维度拆分；无法按逻辑拆分时按顺序均匀分配"
  title_format: "使用'主题（续）'或按逻辑维度命名"
  continuity: "首页末尾可添加'详见下页'提示"

# ── 单条要点精炼规则 ──
refinement:
  trigger: "单条要点超过60字"
  priority:
    - "优先级1：去冗余（删除虚词和冗余结构）"
    - "优先级2：拆分（一条含多信息点的要点拆为2-3条）"
    - "优先级3：提炼（长描述改为'关键词+短说明'格式）"

# ── 标注系统 ──
annotations:
  content:
    "[KEY]": "核心信息强调（关键结论、重要概念）"
    "[DATA]": "数据突出（统计数据、百分比、指标）"
    "[QUOTE]": "引用（权威观点、文献引用）"
    "[CASE]": "实际案例（真实案例、应用场景）"
    "[VS]": "对比说明（前后对比、优劣对比）"
  visual:
    "[CHART:bar]": "柱状图（对比数据、排名）"
    "[CHART:line]": "折线图（趋势变化、时间序列）"
    "[CHART:pie]": "饼图（占比分布、构成）"
    "[CHART:flow]": "流程图（步骤、流程、关系）"
    "[CHART:compare]": "对比图（方案对比、优缺点）"
    "[CHART:table]": "表格（规范数据、矩阵）"
    "[CHART:timeline]": "时间线（发展历程、路线图）"
    "[IMAGE:photo]": "实景图片"
    "[IMAGE:diagram]": "示意图"
    "[IMAGE:screenshot]": "截图"
    "[ICON:类型]": "图标建议"
  layout:
    "[LAYOUT:left-right]": "左右分栏"
    "[LAYOUT:top-bottom]": "上下布局"
    "[LAYOUT:center]": "居中突出"
    "[LAYOUT:grid]": "网格布局（多模块并列、分类展示）"
    "[EMPHASIS:number]": "大号数字"
    "[PROGRESS:比例]": "进度展示"
  code:
    "[CODE:single]": "单栏代码（≤15行）"
    "[CODE:double]": "双栏代码（16-30行）"
    "[CODE:compare]": "代码对比（Before/After）"
    "[CMD]": "命令行示例"
    "[CONFIG]": "配置文件"
    "[PSEUDO]": "伪代码"
  section:
    "[SECTION:keywords]": "关键词预览（章节标题下方3-5个关键词）"
    "[SECTION:progress]": "进度指示（第N章/共M章）"
    "[SECTION:outline]": "章节目录（本章3-4个子主题）"

# ── 内容转换规则 ──
conversion_rules:
  paragraph: "拆解为4-6个要点，每条20-60字，加粗关键词引导，保留上下文说明，添加标注"
  long_list: "按逻辑维度分组（每组3-4条），每条补充具体说明，超8条分页"
  complex_sentence: "一句话拆多个要点，每个聚焦一个信息单元"
  data_visualization:
    单个关键数字: "[DATA] + [EMPHASIS:number]"
    时间序列: "[CHART:line]"
    分类对比: "[CHART:bar]"
    占比构成: "[CHART:pie]"
    多维度: "[CHART:table]"
    流程步骤: "[CHART:flow]"

# ── 逻辑结构标注 ──
logic_annotation:
  format_single: "[LOGIC:type]"
  format_multi: "[LOGIC:L1→L2]  或  [LOGIC:L1→L2→L3]"
  max_layers: 3
  types:
    cause-effect: { cn: "因果", pattern: "原因→结果、问题→影响", layout: "[LAYOUT:top-bottom] 或 [CHART:flow]" }
    compare: { cn: "对比", pattern: "A vs B、优劣、前后、现状vs目标", layout: "[LAYOUT:left-right] + [CHART:compare]" }
    progressive: { cn: "递进", pattern: "阶段→阶段、逐步深入", layout: "[CHART:flow] 或 [CHART:timeline]" }
    classify: { cn: "分类", pattern: "按维度/类型分组", layout: "[LAYOUT:grid] 或分组列表" }
    hierarchy: { cn: "层级", pattern: "核心→支撑、上位→下位", layout: "[LAYOUT:top-bottom]，上区[KEY]卡片" }
    total-parts: { cn: "总分", pattern: "总述→分项展开", layout: "首行[KEY]高亮+分项列表" }
    condition: { cn: "条件", pattern: "条件→响应、触发→动作", layout: "[LAYOUT:top-bottom] 或 [CHART:flow]" }
    evolution: { cn: "演进", pattern: "起点→变化→终点", layout: "[CHART:timeline]" }
    matrix: { cn: "矩阵", pattern: "两维度交叉分析", layout: "[CHART:table] 或 [LAYOUT:grid]" }
    parallel: { cn: "并列", pattern: "等权重无内在关系（最后选择）", layout: "[LAYOUT:grid]卡片 或列表" }
  multi_layer_rules:
    - "L1决定页面整体结构（区块划分）"
    - "L2决定区块内部结构（子要点组织）"
    - "L3决定要点内部格式（标注与强调方式）"
    - "超过3层必须拆页"
    - "L1最多4个区块，超出拆页或合并"
  conversion_flow: "①识别逻辑关系→②标注[LOGIC:*]→③按结构组织内容→④选择布局标注"
  anti_pattern: "禁止先列要点再找结构——应先识别关系，再按关系组织"

# ── 代码块 ──
code_blocks:
  max_lines: 50
  max_line_length: 80
  language_tag: required
  comments: required
  annotation_choice:
    "≤15行": "[CODE:single]"
    "16-30行": "[CODE:double]"
    对比: "[CODE:compare]"
    配置文件: "[CONFIG]"
    命令行: "[CMD]"

# ── 特殊场景 ──
special_scenarios:
  大量表格:
    "2-3列": "转为要点列举"
    "4列以上": "[CHART:table]"
    对比表格: "[CHART:compare]"
  大量代码: "每块≤50行，保留核心逻辑，根据行数选标注"
  概念密集: "每页≤3-4个核心概念，标注[KEY]，复杂概念补充类比"
  数据丰富: "关键数据标[DATA]，核心指标标[EMPHASIS:number]，按数据特点选图表"

# ── 视觉多样性 ──
visual_diversity:
  consecutive_list_max: 2  # 连续纯列表页不超过2页，第3页起必须切换布局
  chapter_non_list_min: 1  # 每章至少1页使用非列表布局
  short_list_upgrade: "要点≤4条且总字数<300字时，禁止纯列表，改用卡片/网格/highlight-row"
  data_page_rule: "≥3个[DATA]时，必须使用数据卡片网格+[EMPHASIS:number]"
  mandatory_annotation: "每个###页必须至少1个布局/图表标注"
  preferred_layouts:
    - "上下分区：上区核心摘要/数据/图 + 下区详细列表"
    - "卡片网格：3-4个并列概念各占一卡"
    - "highlight-row：高亮背景条替代普通列表"
    - "流程/时间线：递进或演进内容"
    - "两栏对比：A vs B 结构"

# ── 空间利用 ──
space_utilization:
  fill_rate_min: "70%"  # 内容实际占用面积 / 可用面积 ≥ 70%
  anti_patterns:
    - "4条要点每条仅20字（总80字）→ 填充率约25%，不合格"
    - "全部要点为'名词：短语'格式，缺乏说明 → 信息密度不足"
    - "页面无任何视觉元素标注 → 视觉单调"
  enrichment_rules:
    - "要点应包含'是什么+为什么/怎么做'两层信息"
    - "保留原文的背景、原因、影响等上下文"
    - "抽象概念补充具体示例或数据佐证"

# ── 禁止事项 ──
prohibited:
  format:
    - "单页>550字"
    - ">3行连续段落文字"
    - "单句>60字"
    - "代码块>50行"
    - "Markdown表格作为PPT内容（应标注[CHART:table]）"
    - "标题>4级"
    - "单页>8个要点"
    - "列表嵌套>2层"
  content:
    - "忽略或跳过原文档章节或要点"
    - "因字数限制删除关键信息（应分页）"
    - "不同主题合并到一页"
    - "模糊表述（可能/大概/一些）"
    - "重复内容"
  annotations:
    - "滥用标注（每条都标[KEY]）"
    - "标注不准确"
    - "关键数据缺少标注"

# ── 质量检查 ──
quality_checks:
  per_page:
    - "标题≤20字"
    - "要点4-6条（最少3，最多8）"
    - "每条20-60字，含关键词+说明两部分"
    - "总字数350-550（不含代码），填充率≥70%"
    - "有适当标注"
    - "代码块≤50行且有注释"
    - "无Markdown表格"
    - "无>3行连续段落"
    - "无过长单句（>60字）"
    - "每页至少1个布局/图表标注（无纯无标注列表页）"
    - "连续纯列表页≤2页"
    - "列表嵌套≤2层"
    - "已识别逻辑结构并添加布局标注"
  full_document:
    - "有且仅有1个#标题"
    - "每章内容页≥3页"
    - "标题≤4级"
    - "逻辑连贯，章节过渡自然"
    - "每页有核心观点"
    - "[KEY]每章至少2-3处"
    - "有数据处标[DATA]"
    - "≥60%页面有视觉元素建议"
    - "无重复内容"
    - "超容量页面已分页处理"
    - "页面密度均衡，填充率≥70%"
    - "连续纯列表页不超过2页"
    - "每章至少1页非列表布局"
    - "章节页使用了[SECTION:*]标注"
  special:
    - "代码逻辑正确，注释充分"
    - "数据有来源说明，单位统一"
    - "核心概念标[KEY]（每章2-4个）"
    - "所有数字标[DATA]"
    - "复杂流程标[CHART:flow]"
    - "对比内容标[VS]或[CHART:compare]"
