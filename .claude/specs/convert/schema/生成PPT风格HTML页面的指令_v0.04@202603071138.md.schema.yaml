# TW-FMT-PPT-02 PPT 风格 HTML 页面生成规范 — Schema
# 来源规范：specs/convert/outputs/生成PPT风格HTML页面的指令_v0.04@202603071138.md
# 用途：AI 执行 /ppt-to-html 时加载此 schema，提供 HTML 生成约束
# 完整 CSS 代码和 HTML 模板：见原规范文件第 8-9 章
# 版本：0.04（2026-03-07）

doc_id: TW-FMT-PPT-02
doc_name: PPT 风格 HTML 页面生成规范

# ── Markdown 解析映射 ──
heading_mapping:
  "#": { html_type: "标题页 Title Slide", css_class: layout-title }
  "##": { html_type: "章节页 Section Divider", css_class: layout-section }
  "###": { html_type: "标题+内容页", css_class: layout-content }
  "####": { html_type: "标题+内容页（面包屑三级）", css_class: layout-content }

annotation_mapping:
  "[KEY]": { html: ".highlight 类包裹文字，或 .highlight-row 整行高亮" }
  "[DATA]": { html: ".data-card 组件，大号数字+小标签" }
  "[CHART:bar]": { html: "CSS Grid 简化柱状图" }
  "[CHART:line]": { html: "箭头符号或简化趋势" }
  "[CHART:pie]": { html: "百分比卡片网格" }
  "[CHART:flow]": { html: ".flow-container + .flow-box 卡片链" }
  "[CHART:compare]": { html: ".compare-container + .compare-item" }
  "[CHART:timeline]": { html: ".timeline-bar 组件" }
  "[CHART:table]": { html: ".grid-table 网格布局" }
  "[CODE:single]": { html: "<pre><code>, width: 740px" }
  "[CODE:double]": { html: ".two-column-wrapper 两栏布局" }
  "[LOGIC:*]": { html: "驱动布局选择（见priority_0_logic），不直接渲染为HTML元素" }
  "[SECTION:keywords]": { html: ".section-keywords 关键词卡片" }
  "[SECTION:progress]": { html: ".section-progress 进度指示器" }
  "[SECTION:outline]": { html: ".section-outline 子主题列表" }

# ── 布局选择策略 ──
layout_selection:
  priority_0_logic:
    note: "最高优先级：基于[LOGIC:*]标注选择布局"
    mapping:
      cause-effect: "上下分区：上区.card-key原因→下区结果列表"
      compare: ".two-column-wrapper 或 .compare-container"
      progressive: ".flow-container 或 .timeline-bar+说明"
      classify: ".grid-4网格卡片 或 分组标题+分组列表"
      hierarchy: "上下分区：上区.card-key→下区.list-items"
      total-parts: "上区.highlight-row总述→下区列表/网格"
      condition: "上下分区：上区条件→下区响应；或.flow-container"
      evolution: ".timeline-bar+阶段说明"
      matrix: ".grid-table网格表格"
      parallel: ".grid-4网格卡片（非纯列表）"
    multi_layer:
      rule: "L1决定页面级布局，L2决定区块内布局，L3决定要点格式"
      L1_classify: "页面分为2-4个并列区块"
      L1_cause_effect: "页面分为上(原因)下(结果)两区"
      L1_compare: "页面分为左右两栏"
      L1_hierarchy: "页面分为上(核心)下(支撑)"
  priority_1_annotation:
    - { condition: "有[CODE:double]", layout: ".two-column-wrapper 两栏" }
    - { condition: "有[CHART:compare]或成对[DATA]", layout: "两栏或.compare-container" }
    - { condition: "4-6个[DATA]", layout: "2×2或3×2网格(.data-grid)" }
    - { condition: "要点≥6且字数少", layout: "3列网格" }
  priority_2_content_logic:
    - { condition: "对比结构（A vs B）", layout: ".compare-container 两栏对比" }
    - { condition: "递进结构（阶段/步骤）", layout: ".flow-container 或 .timeline-bar" }
    - { condition: "分类结构（3-4并列模块）", layout: "网格布局" }
    - { condition: "层级结构（摘要+详细列表）", layout: "上下分区(.section-label+内容块)" }
    - { condition: "总分结构（KEY摘要+要点）", layout: ".card-key顶部+列表区" }
  priority_2b_space_utilization:
    - { condition: "内容高度<175px（<50%可用）", action: "强制升级：highlight-row/card/grid替代纯列表" }
    - { condition: "列表项≤5条且高度<200px", action: "增加间距：.list-items.spacious（margin-bottom:16px）" }
    - { condition: "连续≥3页纯列表", action: "第3页起切换为highlight-row/card-key+列表/网格布局" }
  priority_3_default:
    - { condition: "其他", layout: "layout-content + .content-box" }

# ── 页面尺寸 ──
dimensions:
  container: { width: 800, height: 450, ratio: "16:9" }
  page_gap: 20
  margin_lr: 30
  title_bar: { top: 30, height: 25, width: 740, border_bottom: "1px solid #e2e8f0" }
  content_area: { top: 66, height: 349, width: 740 }
  footer: { bottom: 5, height: 20 }
  note: "30(top)+25(height)+1(border)=56, 内容区从66开始, 间距10px"

# ── 设计系统 ──
colors:
  primary: { main: "#6366f1", purple: "#8b5cf6" }
  accent: { green: "#10b981", amber: "#f59e0b", blue: "#3b82f6", red: "#ef4444" }
  neutral:
    title: "#1e293b"
    body: "#334155"
    secondary: "#64748b"
    light: "#94a3b8"
    border: "#e2e8f0"
    bg_light: "#f8fafc"
    bg_card: "#ffffff"

typography:
  body: { size: 13px, weight: 400 }
  breadcrumb: { size: 14px, weight: 600 }
  card_title: { size: 14px, weight: 600 }
  section_label: { size: 13px, weight: 600 }
  footer: { size: 10px, weight: 100 }
  title_main: { size: 26px, weight: 700 }
  title_sub: { size: 12px, weight: 400 }
  compact: { size: "11-12px", min: 11px }

flat_design:
  - "无 box-shadow（所有元素用 1px 边框，ppt-container 除外）"
  - "无渐变图标（纯色方块 28px + 字符）"
  - "简洁列表（6px 纯色圆点）"
  - "统一边距"
  - "1px 浅灰分隔线 #e2e8f0"
  - "卡片使用 1px 边框，无阴影"

font_rendering:
  - "-webkit-font-smoothing: antialiased"
  - "-moz-osx-font-smoothing: grayscale"
  - "text-rendering: optimizeLegibility"

# ── 布局框架 ──
layouts:
  title_page:
    trigger: "#"
    features: "无标题栏、无页脚、全屏渐变背景"
    elements:
      main_title: { top: 165px, size: 26px, align: center }
      subtitle: { top: 215px, size: 12px, align: center }
      author: { bottom: 50px, size: 8px, align: center }

  section_page:
    trigger: "##"
    features: "简化标题页样式，无页脚"
    elements:
      section_title: { top: 160px, size: 22px, align: center }
      section_sub: { top: 200px, size: 12px, align: center }
    optional_enhancements:
      "[SECTION:keywords]": ".section-keywords 关键词标签（top:230px）"
      "[SECTION:progress]": ".section-progress 进度指示器（bottom:40px）"
      "[SECTION:outline]": ".section-outline 子主题列表（top:240px）"

  content_page:
    trigger: "### / ####"
    title_bar: { top: 30, height: 25, border: "1px分隔线" }
    content: { top: 66, width: 740, height: 349 }

  two_columns:
    trigger: "[CODE:double] / [CHART:compare] / 成对[DATA] / [LAYOUT:left-right]"
    container: ".two-column-wrapper（flexbox，position:absolute, top:66, left:30, width:740, height:349, display:flex, gap:30）"
    columns: "左栏/右栏各 flex:1, height:100%"
    padding: "16px（可调14-18px）"
    rule: "两栏容器直接放在 ppt-content 下，不应用 content-box 包裹"

  top_bottom:
    trigger: "[LAYOUT:top-bottom] / 层级结构内容"
    upper: "核心信息（.card-key / .data-card 网格 / .flow-container）"
    separator: ".divider（1px线）或 12px 间距"
    lower: "详细列表或补充说明"

  grid:
    standard_gap: 14
    compact_gap: "10-12"

# ── 计算公式 ──
formulas:
  column_width: "(740 - gap × (列数-1)) / 列数"
  row_height: "(349 - gap × (行数-1)) / 行数"
  element_position:
    left: "30 + i × (列宽 + gap)"
    top: "66 + j × (行高 + gap)"

common_layouts:
  "2列_gap30":
    col_width: 355
    positions: [{ left: 30 }, { left: 415 }]
    verify: "30+355+30+355=770"
  "3列_gap14":
    available: 712
    col_widths: [237, 237, 238]
    positions: [{ left: 30 }, { left: 281 }, { left: 532 }]
  "2x2_gap14":
    col_width: 363
    row_heights: [167, 168]
    verify_w: "363+14+363=740"
    verify_h: "167+14+168=349"
  "3行_gap14":
    row_height: 107
    positions: [{ top: 66 }, { top: 187 }, { top: 308 }]

# ── CSS 组件清单 ──
css_components:
  highlight: "行内关键词高亮（[KEY]方案1）"
  highlight-row: "整行高亮，border-left:3px solid #6366f1（[KEY]方案2）"
  card-key: "左侧彩色条卡片（[KEY]方案3）"
  data-card: "数据卡片，data-value 24px + data-label 11px"
  data-grid: "数据卡片网格容器（cols-2/cols-3/cols-4）"
  flow-container: "流程容器 + .flow-box + .flow-arrow"
  compare-container: "对比容器 + .compare-item.current/.target"
  timeline-bar: "时间线 + .timeline-item"
  grid-table: "网格表格 + .grid-table-header/.grid-table-cell"
  section-label: "分组标题（font-size:13px, weight:600）"
  section-keywords: "章节关键词标签（top:230px）"
  section-progress: "章节进度指示器（bottom:40px）"
  section-outline: "章节目录（top:240px）"
  tag-series: ".tag-red/.tag-green/.tag-blue/.tag-purple/.tag-amber"
  list-dot: "6×6 纯色圆点（border-radius:50%）"
  list-items-spacious: "间距扩展列表（margin-bottom:16px），短列表自动填充"
  list-items-expanded: "大间距列表（margin-bottom:20px, font-size:14px），极短内容填充"
  grid-4: "2×2 网格卡片（grid-template-columns:1fr 1fr, gap:12px）"
  grid-card: "网格卡片项（border:1px, padding:14px, border-radius:6px）"
  divider: "1px 分隔线（#e2e8f0）"
  icon-text: "28px 纯色方块图标"
  two-column-wrapper: "flexbox 两栏容器（替代绝对定位）"

# ── 生成流程 ──
generation_flow:
  - "解析 Markdown（标题层级、标注类型数量、要点、代码块）"
  - "选择页面布局（优先级1标注→优先级2内容逻辑→优先级3默认）"
  - "列出元素清单（每个注明预估高度）"
  - "精确计算高度（求和，验证≤349px）"
  - "超出时调整（减分行→减间距→减padding→减字号→精简→改布局）"
  - "重新计算直到满足"
  - "验证边界（top:66, bottom≤415）"

compaction_rules:
  - "横排优先于竖排：短数据项用·连接为一行"
  - "去除冗余词汇"
  - "合并同类信息（同条目多属性用|分隔）"
  - "符号代替文字：·(顿号) →(变为) -(减少) +(增加)"

# ── 文件格式 ──
file_format:
  type: "单文件 HTML"
  css: "内联 <style>"
  js: "内联 <script>"
  external_deps: none

# ── 页面结构规则 ──
page_structure:
  breadcrumb:
    "###": "父章节 › 页面标题"
    "####": "父标题 › 子标题"
    max_levels: 3
    separator: "›"
    colors: { level1: "#6366f1", level2: "#334155", level3: "#8b5cf6", separator: "#94a3b8" }
  footer:
    left: "上海天帷智慧数字技术有限公司 / www.tenward.com"
    right: "第 X 页"
  content:
    font_size: { standard: 13px, compact: 12px, min: 11px }
    line_height: "1.4-1.6"
    min_gap: 10px
    card_padding: "12-18px"
  code_comment: "每个 content-box 必须添加高度计算注释"

# ── 禁止项 ──
prohibited:
  - "overflow: hidden/auto/scroll"
  - "任何形式的滚动条"
  - "内容超出 349px 边界"
  - "省略计算步骤直接生成"
  - "忽略 Markdown 标注"
  - "在 .title-bar 添加 padding（高度必须严格25px）"
  - "跳过附录C自检清单"
  - "大量使用 inline style（优先使用预定义 CSS 类）"

# ── 必须执行 ──
must_execute:
  - "每个 content-box 必须提供高度计算注释"
  - "必须精确计算到像素，不允许估算"
  - "必须执行附录C完整自检清单（C.1 至 C.16）"
  - "必须修正所有问题后交付，不允许带问题交付"
  - "必须验证间距自然形成：30+25+1=56，66-56=10px"
  - "必须使用 .two-column-wrapper flexbox 容器（两栏布局不应使用绝对定位）"

# ── 质量检查 ──
quality_checks:
  dimensions:
    - ".ppt-container: 800×450"
    - ".title-bar: top=30, height=25, 无padding, border-bottom"
    - ".content-box: top=66, 740×349"
    - ".two-column-wrapper: top=66, width=740, height=349, display=flex, gap=30"
    - ".two-column-wrapper .left-column/.right-column: flex=1, height=100%"
    - ".ppt-footer: bottom=5, height=20"
  content_boundary:
    - "每页内容总高≤349px"
    - "每页内容填充率≥70%（内容高度≥245px），极简页除外"
    - "每页有高度计算注释"
    - "无overflow"
    - "两栏每栏≤349px（含padding）"
  space_utilization:
    - "短列表（≤5条且<200px）使用.list-items.spacious扩展间距"
    - "极短内容（<175px）升级为highlight-row/card/grid布局"
    - "连续≥3页纯列表时第3页起自动切换布局"
    - "≥3个[DATA]时使用data-card网格而非列表"
  style:
    - "字号/配色/扁平化符合规范"
    - "无box-shadow（ppt-container除外）"
    - ".list-dot: 6×6, border-radius=50%"
    - "间距≥8px"
    - "优先使用预定义 CSS 类，避免大量 inline style"
  page_type:
    - "# → layout-title（无标题栏/页脚）"
    - "## → layout-section（无标题栏/页脚，含增强元素）"
    - "### → layout-content（有标题栏/页脚）"
    - "#### → layout-content + level-3面包屑(#8b5cf6)"
  annotation_handling:
    - "[KEY] → .highlight / .highlight-row / .card-key"
    - "[DATA] → .data-card（配合 .data-grid）"
    - "[CHART:compare] → .compare-container + .compare-item"
    - "[CHART:flow] → .flow-container + .flow-box + .flow-arrow"
    - "[CHART:timeline] → .timeline-bar + .timeline-item"
    - "[CHART:table] → .grid-table"
    - "[CODE:single] → 单栏 <pre><code>"
    - "[CODE:double] → .two-column-wrapper 两栏"
    - "[SECTION:*] → 对应章节页增强组件"
  navigation:
    - "键盘翻页（ArrowDown/PageDown/ArrowUp/PageUp）"
    - "滚动距离=470px"

# ── CSS/HTML 模板 ──
# 完整 CSS 样式和 HTML 结构模板较大，执行时从原规范文件第 8-9 章加载
css_html_source: "specs/convert/outputs/生成PPT风格HTML页面的指令_v0.04@202603071138.md 第8-9章"
