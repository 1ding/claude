<!--
  PPT Slides Design System Template v2.0 (Static)
  =================================================
  色系：深色海军蓝 + 金色点缀（Navy-Gold）
  尺寸：1280×720（标准16:9，与PPT Widescreen一致）
  字体：Noto Sans SC（正文）+ Noto Serif SC（标题/数字）

  v2.1 变更：
  - 移除所有 CSS 动画（@keyframes, animation, transition）
  - 移除所有 :hover 伪类
  - 移除 backdrop-filter, box-shadow（组件内）
  - 移除所有 linear-gradient，全部改为纯色（确保 HTML 与 PPT 效果一致）
  - 布局改为绝对定位优先（无 flex/grid）
  - 添加 data-ppt 属性标记规范

  架构（方案C：锁定层 + 开放层）：
  - 锁定层：以下 CSS 和 JS 原样复制到输出 HTML，不修改
  - 开放层：AI 可在 /* === CUSTOM === */ 后新增组件样式
  - 开放层禁止：animation, transition, :hover, box-shadow, text-shadow

  data-ppt 属性：
  - text   → PPT TextBox
  - shape  → PPT Shape (RoundedRectangle)
  - table  → PPT Table
  - line   → PPT thin Rectangle
  - group  → 容器，子元素独立转换
  - skip   → 不转换（导航栏等）

  坐标系（1280×720 slide 内）：
  - header: top=32px, height=60px（底边 y=92px）
  - 间距：32px（header底边到body顶边）
  - body:   top=124px, height=552px（底边 y=676px）
  - footer: top=688px, height=24px
  - 左右边距: 56px

  flex 使用限制：
  - 布局层禁用 flex/grid（用绝对定位）
  - 叶子组件内允许 flex 居中（flow-box, metric-card, battle-card 等固定尺寸组件）

  ═══════════════════════════════════════
  COMPONENT CATALOG（组件目录）
  ═══════════════════════════════════════

  [slide-cover] 封面/结语页
    <div class="slide slide-cover active" data-slide="0" data-type="cover">
      <div class="cover-content" data-ppt="group">
        <div class="cover-badge" data-ppt="text">标签</div>
        <div class="cover-title" data-ppt="text">标题<span>高亮</span></div>
        <div class="cover-line" data-ppt="line"></div>
        <div class="cover-sub" data-ppt="text">副标题</div>
      </div>
    </div>

  [content slide] 内容页
    <div class="slide" data-slide="N" data-type="content" style="position:relative;">
      <div class="slide-header" data-ppt="text" style="position:absolute;left:56px;top:32px;width:1168px;height:60px;">
        <div class="slide-chapter">章节</div>
        <div class="slide-title">标题</div>
      </div>
      <div class="slide-body" data-ppt="group" style="position:absolute;left:56px;top:124px;width:1168px;height:552px;">
        <!-- 子元素用 position:absolute + px 坐标 -->
      </div>
      <div class="slide-footer" data-ppt="text" style="position:absolute;left:56px;top:688px;width:1168px;height:24px;">
        <span>文档标题</span><span class="page-num">NN</span>
      </div>
    </div>

  [col-card] 卡片
    <div class="col-card" data-ppt="shape" style="position:absolute;left:Xpx;top:Ypx;width:Wpx;height:Hpx;">
      <div class="card-bar" data-ppt="line"></div>
      <h3 data-ppt="text">标题</h3>
      <p data-ppt="text">内容</p>
    </div>

  [mini-table] 表格
    <table class="mini-table" data-ppt="table" style="position:absolute;left:Xpx;top:Ypx;width:Wpx;">
      <thead><tr><th>列1</th></tr></thead>
      <tbody><tr><td>值1</td></tr></tbody>
    </table>

  [bullet-list] 列表
    <ul class="bullet-list" data-ppt="text" style="position:absolute;left:Xpx;top:Ypx;width:Wpx;">
      <li><strong>要点：</strong>说明</li>
    </ul>

  [emphasis-box] 强调框
    <div class="emphasis-box" data-ppt="shape" style="position:absolute;left:Xpx;top:Ypx;width:Wpx;height:Hpx;">
      <p data-ppt="text">内容</p>
    </div>

  [metric-card] 指标卡
    <div class="metric-card" data-ppt="shape" style="position:absolute;left:Xpx;top:Ypx;width:Wpx;height:Hpx;">
      <div class="metric-value" data-ppt="text">99%</div>
      <div class="metric-label" data-ppt="text">标签</div>
    </div>

  [timeline] 时间线（子元素绝对定位）
  [flow-row] 流程图（子元素绝对定位）
  [battle-card] 编号卡片（绝对定位）
-->
<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{{TITLE}}</title>
    <link href="https://fonts.googleapis.com/css2?family=Noto+Sans+SC:wght@300;400;500;700;900&family=Noto+Serif+SC:wght@400;600;700;900&display=swap" rel="stylesheet">
    <style>
        /* === DESIGN TOKENS === */
        :root {
            --navy: #0a1628;
            --navy-mid: #132240;
            --navy-light: #1a3058;
            --gold: #c9a84c;
            --gold-light: #e8cc6a;
            --gold-dim: rgba(201,168,76,0.15);
            --white: #f0ece4;
            --white-pure: #ffffff;
            --text-muted: #8a9bb5;
            --accent-blue: #3b7dd8;
            --accent-red: #d94f4f;
            --accent-green: #3aad6b;
            --accent-teal: #2ba8a8;
            --accent-orange: #e08a3c;
            --slide-w: 1280px;
            --slide-h: 720px;
        }

        /* === BASE RESET === */
        * { margin:0; padding:0; box-sizing:border-box; }
        html, body {
            width:100%; height:100%; overflow:hidden;
            background:#050d1a;
            font-family:'Noto Sans SC',sans-serif;
            color:var(--white);
        }

        /* === PRESENTATION FRAMEWORK === */
        .presentation {
            width:100vw; height:100vh;
            display:flex; align-items:center; justify-content:center;
            position:relative;
        }
        .slide-container {
            width:var(--slide-w); height:var(--slide-h);
            position:relative; overflow:hidden;
            box-shadow:0 20px 80px rgba(0,0,0,0.6);
        }
        .slide {
            position:absolute; top:0; left:0; width:100%; height:100%;
            display:none;
            background:var(--navy); overflow:hidden;
        }
        .slide.active { display:block; }

        /* === COVER SLIDE (static, no animation) === */
        .slide-cover {
            background:var(--navy);
            text-align:center;
        }
        .cover-content {
            position:absolute; top:50%; left:50%; transform:translate(-50%,-50%);
            width:900px;
        }
        .cover-badge {
            display:inline-block; padding:6px 28px;
            border:1px solid var(--gold); color:var(--gold);
            font-size:13px; letter-spacing:6px; font-weight:500; margin-bottom:36px;
        }
        .cover-title {
            font-family:'Noto Serif SC',serif; font-size:44px; font-weight:900;
            line-height:1.35; color:var(--white); margin-bottom:16px;
        }
        .cover-title span { color:var(--gold); }
        .cover-sub {
            font-size:22px; font-weight:300; color:var(--text-muted); letter-spacing:8px;
        }
        .cover-line {
            width:80px; height:2px; background:var(--gold); margin:24px auto;
        }
        .cover-version {
            font-size:13px; color:var(--text-muted); margin-top:10px; letter-spacing:2px;
        }

        /* === CONTENT SLIDE STRUCTURE === */
        .slide-header {
            position:absolute; left:56px; top:32px; width:1168px; height:60px;
        }
        .slide-chapter {
            font-size:12px; font-weight:700; color:var(--gold);
            letter-spacing:4px; text-transform:uppercase;
        }
        .slide-title {
            font-family:'Noto Serif SC',serif; font-size:30px; font-weight:700;
            color:var(--white); margin-top:6px;
        }
        .slide-body {
            position:absolute; left:56px; top:124px; width:1168px; height:552px;
            overflow:hidden;
        }
        .slide-footer {
            position:absolute; left:56px; top:688px; width:1168px; height:24px;
        }
        .bullet-list li:last-child { margin-bottom:0; }
        .slide-footer span {
            font-size:11px; color:var(--text-muted);
        }
        .slide-footer .page-num {
            font-family:'Noto Serif SC',serif; font-weight:700;
            color:var(--gold); font-size:13px;
            position:absolute; right:0; top:0;
        }

        /* === TYPOGRAPHY === */
        .body-text { font-size:15px; line-height:1.75; color:var(--white); font-weight:300; }
        .body-text strong, .body-text b { font-weight:700; color:var(--gold-light); }
        .body-text-sm { font-size:13px; line-height:1.7; color:var(--text-muted); font-weight:300; }
        .section-label {
            font-size:12px; font-weight:700; color:var(--gold);
            letter-spacing:3px; margin-bottom:10px;
        }
        .subtitle {
            font-family:'Noto Serif SC',serif; font-size:20px; font-weight:700;
            color:var(--white); margin-bottom:14px;
        }

        /* === CARD === */
        .col-card {
            background:var(--navy-mid); border-radius:10px; padding:22px;
            border:1px solid rgba(201,168,76,0.12); position:relative; overflow:hidden;
        }
        .col-card .card-bar,
        .col-card::before {
            content:''; position:absolute; top:0; left:0; right:0; height:3px;
            background:var(--gold);
        }
        .card-bar {
            position:absolute; top:0; left:0; right:0; height:3px;
            background:var(--gold);
        }
        .col-card h3 {
            font-family:'Noto Serif SC',serif; font-size:16px; font-weight:700;
            margin-bottom:10px; color:var(--gold-light);
        }
        .col-card p { font-size:13px; line-height:1.65; color:var(--text-muted); font-weight:300; }

        /* === TABLE === */
        .mini-table { width:100%; border-collapse:collapse; font-size:12.5px; }
        .mini-table th {
            background:var(--navy-mid); color:var(--gold); font-weight:700;
            padding:9px 12px; text-align:left;
            border-bottom:2px solid var(--gold); font-size:11.5px; letter-spacing:1px;
        }
        .mini-table td {
            padding:8px 12px; border-bottom:1px solid rgba(255,255,255,0.06);
            color:var(--white); font-weight:300; vertical-align:top; line-height:1.5;
        }

        /* === STATUS TAGS === */
        .status-tag {
            display:inline-block; padding:2px 10px; border-radius:10px;
            font-size:11px; font-weight:500;
        }
        .tag-done   { background:rgba(58,173,107,0.15);  color:var(--accent-green); }
        .tag-attack { background:rgba(217,79,79,0.15);   color:var(--accent-red); }
        .tag-base   { background:rgba(59,125,216,0.15);  color:var(--accent-blue); }
        .tag-tbd    { background:rgba(224,138,60,0.15);  color:var(--accent-orange); }
        .tag-break  { background:rgba(201,168,76,0.2);   color:var(--gold-light); }
        .tag-deep   { background:rgba(43,168,168,0.15);  color:var(--accent-teal); }

        /* === HEATMAP TABLE === */
        .heat-table td.h-attack { background:rgba(217,79,79,0.2); color:#ff8a8a; font-weight:700; }
        .heat-table td.h-break  { background:rgba(201,168,76,0.2); color:var(--gold-light); font-weight:700; }
        .heat-table td.h-deep   { background:rgba(43,168,168,0.12); color:var(--accent-teal); }
        .heat-table td.h-base   { background:rgba(59,125,216,0.1); color:var(--accent-blue); }
        .heat-table td.h-mature { background:rgba(58,173,107,0.12); color:var(--accent-green); }
        .heat-table td.h-lead   { background:rgba(58,173,107,0.2); color:#6ce89a; font-weight:500; }
        .heat-table td.h-tbd    { background:rgba(224,138,60,0.15); color:var(--accent-orange); }

        /* === TIMELINE === */
        .timeline { position:relative; }
        .timeline-line {
            position:absolute; top:36px; left:40px; right:40px; height:2px;
            background:var(--gold);
        }
        .timeline-item { position:absolute; text-align:center; }
        .timeline-dot {
            width:16px; height:16px; border-radius:50%; background:var(--gold);
            margin:28px auto 14px;
        }
        .timeline-year {
            font-family:'Noto Serif SC',serif; font-size:20px; font-weight:900; color:var(--gold);
        }
        .timeline-label { font-size:14px; font-weight:700; color:var(--white); margin-bottom:4px; }
        .timeline-desc { font-size:11.5px; color:var(--text-muted); line-height:1.5; }

        /* === BULLET LIST === */
        .bullet-list { list-style:none; padding:0; }
        .bullet-list li {
            position:relative; padding-left:20px; margin-bottom:10px;
            font-size:14px; line-height:1.65; color:var(--white); font-weight:300;
        }
        .bullet-list li::before {
            content:''; position:absolute; left:0; top:8px;
            width:6px; height:6px; background:var(--gold); border-radius:50%;
        }
        .bullet-list li strong { color:var(--gold-light); font-weight:700; }

        /* === METRIC CARDS === */
        .metric-card {
            background:var(--navy-mid); border-radius:10px; padding:16px; text-align:center;
            border:1px solid rgba(201,168,76,0.1); position:absolute;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
        }
        .metric-value {
            font-family:'Noto Serif SC',serif; font-size:26px; font-weight:900; color:var(--gold);
        }
        .metric-label { font-size:11px; color:var(--text-muted); margin-top:4px; line-height:1.4; }

        /* === BATTLE CARDS === */
        .battle-card {
            background:var(--navy-mid); border-radius:8px; padding:14px 10px; text-align:center;
            border:1px solid rgba(201,168,76,0.1); position:absolute;
            display:flex; flex-direction:column; align-items:center; justify-content:center;
        }
        .battle-num {
            font-family:'Noto Serif SC',serif; font-size:22px; font-weight:900; color:var(--gold);
        }
        .battle-name { font-size:12px; font-weight:500; color:var(--white); margin:4px 0; line-height:1.4; }
        .battle-dept { font-size:10px; color:var(--text-muted); line-height:1.3; }

        /* === TOC === */
        .toc-item {
            position:absolute; display:block; padding:10px 16px; border-radius:8px; cursor:pointer;
        }
        .toc-num {
            font-family:'Noto Serif SC',serif; font-size:14px; font-weight:900;
            color:var(--gold); margin-right:14px;
        }
        .toc-text { font-size:14px; color:var(--white); font-weight:400; }

        /* === EMPHASIS BOX === */
        .emphasis-box {
            background:rgba(201,168,76,0.06);
            border-left:3px solid var(--gold); padding:14px 20px; border-radius:0 8px 8px 0;
        }
        .emphasis-box p { font-size:14px; line-height:1.65; color:var(--white); }

        /* === FLOW DIAGRAM === */
        .flow-box {
            background:var(--navy-mid);
            border:1px solid var(--gold); border-radius:8px;
            font-size:13px; font-weight:500; color:var(--gold-light);
            position:absolute;
            display:flex; align-items:center; justify-content:center;
        }
        .flow-arrow {
            color:var(--gold); font-size:20px; position:absolute;
            display:flex; align-items:center; justify-content:center;
        }

        /* === YEAR BADGE === */
        .year-badge {
            display:inline-block; padding:4px 16px; background:var(--gold); color:var(--navy);
            font-family:'Noto Serif SC',serif; font-weight:900; font-size:16px;
            border-radius:4px;
        }
        .year-theme { font-size:16px; color:var(--gold-light); font-weight:500; }

        /* === MISC === */
        .small-text { font-size:11.5px; color:var(--text-muted); line-height:1.5; }

        /* === NAVIGATION (screen only, data-ppt="skip") === */
        .nav-bar {
            position:fixed; bottom:24px; left:50%; transform:translateX(-50%);
            display:flex; align-items:center; gap:16px;
            background:rgba(10,22,40,0.92);
            padding:8px 20px; border-radius:40px;
            border:1px solid rgba(201,168,76,0.2); z-index:100; user-select:none;
        }
        .nav-btn {
            width:36px; height:36px; border-radius:50%;
            border:1px solid rgba(201,168,76,0.3); background:transparent;
            color:var(--gold); font-size:16px; cursor:pointer;
            display:flex; align-items:center; justify-content:center;
        }
        .nav-progress { display:flex; gap:4px; align-items:center; }
        .nav-dot {
            width:6px; height:6px; border-radius:50%;
            background:rgba(201,168,76,0.2); cursor:pointer;
        }
        .nav-dot.active { width:24px; border-radius:3px; background:var(--gold); }
        .nav-label { font-size:12px; color:var(--text-muted); min-width:40px; text-align:center; }

        /* === RESPONSIVE (screen viewing only) === */
        @media (max-width:1300px) {
            .slide-container { width:96vw; height:calc(96vw * 9/16); }
        }
        @media (max-width:800px) {
            .slide-container { width:100vw; height:calc(100vw * 9/16); }
        }
    </style>
</head>
<body>

<div class="presentation">
    <div class="slide-container" id="slideContainer">
        <!-- ===== SLIDES GO HERE ===== -->
    </div>
</div>

<!-- NAVIGATION BAR (data-ppt="skip") -->
<div class="nav-bar" id="navBar" data-ppt="skip">
    <button class="nav-btn" onclick="prevSlide()">&#8249;</button>
    <span class="nav-label" id="navLabel">1/1</span>
    <div class="nav-progress" id="navProgress"></div>
    <button class="nav-btn" onclick="nextSlide()">&#8250;</button>
</div>

<script>
const slides = document.querySelectorAll('.slide');
let current = 0;
const total = slides.length;

function buildDots() {
    const prog = document.getElementById('navProgress');
    for (let i = 0; i < total; i++) {
        const dot = document.createElement('div');
        dot.className = 'nav-dot' + (i === 0 ? ' active' : '');
        dot.onclick = () => goSlide(i);
        prog.appendChild(dot);
    }
}

function updateNav() {
    document.getElementById('navLabel').textContent = `${current+1}/${total}`;
    document.querySelectorAll('.nav-dot').forEach((d,i) => d.classList.toggle('active', i===current));
}

function goSlide(n) {
    if (n<0 || n>=total) return;
    slides[current].classList.remove('active');
    current = n;
    slides[current].classList.add('active');
    updateNav();
}

function nextSlide() { goSlide(current+1); }
function prevSlide() { goSlide(current-1); }

document.addEventListener('keydown', e => {
    if (e.key==='ArrowRight'||e.key===' '||e.key==='PageDown') { e.preventDefault(); nextSlide(); }
    if (e.key==='ArrowLeft'||e.key==='PageUp') { e.preventDefault(); prevSlide(); }
    if (e.key==='Home') { e.preventDefault(); goSlide(0); }
    if (e.key==='End') { e.preventDefault(); goSlide(total-1); }
});

let touchStartX = 0;
document.addEventListener('touchstart', e => { touchStartX = e.changedTouches[0].screenX; });
document.addEventListener('touchend', e => {
    const diff = touchStartX - e.changedTouches[0].screenX;
    if (Math.abs(diff)>50) { diff>0 ? nextSlide() : prevSlide(); }
});

let wheelTimeout;
document.addEventListener('wheel', e => {
    if (wheelTimeout) return;
    wheelTimeout = setTimeout(() => { wheelTimeout=null; }, 400);
    e.deltaY>0 ? nextSlide() : prevSlide();
}, {passive:true});

buildDots();
updateNav();
</script>
</body>
</html>
