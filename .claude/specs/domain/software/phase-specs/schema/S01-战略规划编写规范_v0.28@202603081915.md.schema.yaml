# S01 战略规划编写规范 Schema
# 来源规范：.claude/specs/domain/software/phase-specs/outputs/S01-战略规划编写规范_v0.28@202603081915.md
# 用途：AI 编写阶段加载此 schema（替代完整规范），提供战略规划报告编写约束
# 完整规则（更多示例和详细说明）：见原规范文件
# 修订日期：2026-03-08

doc_id: S01
doc_name: 战略规划编写规范

# ── 总体结构 ──
report_overview:
  output_doc: "01-战略规划（阶段1唯一正式输出物）"
  downstream: "阶段2宏观需求分析"
  chapters_order_fixed: true

  mandatory_chapters:
    - "第1章 总则（C11要求，文档编号/名称/适用对象/管辖范围/密级）"
    - "第2章 执行摘要"
    - "第3章 市场分析"
    - "第4章 客户分析"
    - "第5章 价值主张"
    - "第6章 商业模式"
    - "第7章 产品架构"
    - "第8章 版本演进"
    - "第9章 风险分析"
    - "第10章 资源需求"

  optional_appendices:
    附录A_术语速查:
      type: "资料性"
      trim_condition: "术语 < 10个时可省略，在正文中解释"
      expansion: "可按概念体系分设多个速查子节（如8库/6图/6链等）"
    附录B_核心概念:
      type: "资料性"
      trim_condition: "概念简单无复杂关系时可省略"
      expansion: "可按概念模块分设多个详解子节"
    附录C_业务架构:
      type: "资料性"
      trim_condition: "模块 < 3个时可省略，在第5章说明"
    附录D_竞品分析:
      type: "资料性"
      trim_condition: "竞品 < 3个时可省略，在第3章说明"
    附录E_财务模型详情:
      type: "资料性"
      trim_condition: "财务模型简单时可省略"
    附录F_技术方案详情:
      type: "资料性"
      trim_condition: "技术方案标准化无特殊选型时可省略"

  mandatory_trim_rule: "必选章节不可裁剪；确实不适用须保留标题并注明'本产品不适用，原因：{具体原因}'"

# ── 跨章节一致性约束 ──
cross_chapter_consistency:
  customer_tier_baseline:
    source: "3.2.2 客户分层"
    must_align:
      - "4.2 客户画像（子章节数=客户分层数）"
      - "4.3 决策链分析（子章节数=客户分层数）"
      - "4.4 购买行为分析（子章节数=客户分层数）"
      - "6.2.1 定价模型（客户分类）"

  financial_data:
    source: "6.6 盈利模型"
    must_align:
      - "10.2 预算规划"
      - "10.4 投入产出分析"
      - "2.5 分期投入规划"
      - "2.6 财务预测"

  product_architecture:
    ch7_derivation_order: "7.1产品架构总览（框架图+域类型+域清单） → 7.2 Strategic Theme 与全景矩阵（THM定义+THM-DOM映射+全景矩阵）"
    must_align:
      - "7.1业务域框架图覆盖7.1.3清单所有域"
      - "7.2.1 THM清单通过7.2.2 THM-DOM映射表关联到7.1.3已定义的域短号"
      - "7.2.3全景矩阵与8.1版本规划双向一致"

  roadmap_summary:
    full_version: "第8章 版本演进"
    compressed_version: "2.9 决策建议各子节（压缩版）"
    rules:
      - "2.9.1 MVP范围 对应 8.1 版本规划（首版本）"
      - "2.9.3 产品路线图 对应 8.1.1 路线图总览"
      - "2.9.4 关键里程碑 对应 8.3 关键里程碑"
    version_function_scope: "各版本功能范围须与7.2.3业务域版本规划矩阵一致"

  risk_summary:
    full_version: "第9章 风险分析"
    compressed_version: "2.7 关键风险（仅P0/P1，压缩为一行）"
    must_align: "两处风险等级和应对措施保持一致"

  exec_summary_traceability:
    rule: "执行摘要不产生新信息——每项数据和结论均应来自正文对应章节"
    mapping:
      "2.1 核心理念": "第5章 价值主张"
      "2.2 项目概述": "全报告核心数据汇总"
      "2.3 市场机会": "第3章 市场分析"
      "2.4 产品与商业": "第5章+第6章+第7章"
      "2.5 分期投入规划": "10.2 预算规划"
      "2.6 财务预测": "6.6+6.3+10.4"
      "2.7 关键风险": "第9章（压缩版）"
      "2.8 可行性评估": "综合第3-10章关键结论"

# ── 第2章 执行摘要 ──
ch2_exec_summary:
  structure:
    required:
      [
        2.1核心理念,
        2.2项目概述,
        2.3市场机会,
        2.4产品与商业,
        2.5分期投入规划,
        2.6财务预测,
        2.7关键风险,
        2.8可行性评估,
        2.9决策建议,
      ]
    "2.9_subsections":
      [2.9.1MVP范围, 2.9.2团队规划, 2.9.3产品路线图, 2.9.4关键里程碑]

  compress_rules:
    "2.9.1": "仅展示P1版本功能范围和核心验收指标，不展开后续版本"
    "2.9.2": "仅呈现各期团队总人数和关键岗位变化，不展开全部岗位"
    "2.9.3": "仅呈现各期核心目标和关键功能，不展开功能明细"
    "2.9.4": "仅列出各期Go/No-Go决策点和核心验收标准"

  expression_norms:
    quantify_compare:
      columns: [对比维度, 传统方式, 产品方式, 提升幅度, 实现前提]
      rule: "实现前提不可省略"

    phased_budget:
      columns: [期数, 时间范围, 期间投入, 累计投入, 主要目标]

    core_metrics:
      columns: [指标, 数值, 说明]
      rule: "数值须具体，不得模糊表述"

    customer_growth:
      columns: [时间节点, 目标客户数, 新增客户数, 客户类型, 关键假设]

    financial_summary:
      columns: [时间节点, 收入, 成本, 净利润, 累计净利润, 关键假设]

    risk_summary:
      columns: [风险等级, 风险名称, 一句话描述, 应对策略]
      rule: "仅摘录P0/P1级风险"

    feasibility_score:
      columns: [评估维度, 评分, 关键依据]
      rule: "评分制须全文统一（建议1-5分或百分制）"

    decision_point:
      columns: [决策点, 验收标准, 继续条件, 止损条件]

    mvp_acceptance:
      columns: [指标名称, 目标值, 度量方式, 数据来源]

    team_by_phase:
      columns: [期数, 团队总人数, 岗位构成, 关键变化]

    position_requirements:
      columns: [岗位名称, 职责简述, 能力要求, 优先级]

    milestone:
      columns: [里程碑, 目标日期, 验收标准, "Go/No-Go"]

# ── 第3章 市场分析 ──
ch3_market_analysis:
  structure:
    sections: [3.1核心痛点分析, 3.2目标市场定义, 3.3市场窗口期, 3.4增长驱动因素]
    "3.2_subsections": [3.2.1市场选择逻辑, 3.2.2客户分层, 3.2.3市场容量估算]

  rules:
    - "困境还原须以具体场景为基础，读者应能'看见'目标客户真实困境"
    - "市场容量估算须标注数据来源与估算方法，不得有无出处数据"
    - "客户分层定义为全报告客户分类基准（向后传递至第4章和第6章）"

  expression_norms:
    adversity_scene:
      elements: [场景标题, 角色, 背景, 流程还原, 结果]
      rule: "流程还原须逐步标注耗时和痛点"

    adversity_table:
      columns: [表现维度, 现状数据, 影响范围, 数据来源]

    adversity_cause_graph:
      format: "ASCII图"
      structure: "左=困境节点 → 中=共同根源 → 右=解决方案"

    scene_selection:
      columns: [候选场景, 市场规模, 痛点强度, 竞争程度, 进入难度, 综合评估]

    customer_tier:
      columns: [客户类型, 典型特征, 产品形态, 客单价区间, 目标客户数]

    market_capacity:
      columns: [客户类型, 潜在客户总数, 客单价, TAM, 目标渗透率, SAM, 估算依据]

# ── 第4章 客户分析 ──
ch4_customer_analysis:
  structure:
    sections: [4.1客户真实场景, 4.2客户画像, 4.3决策链分析, 4.4购买行为分析]
    rule: "4.2/4.3/4.4各按客户分层分设子章节，子章节数=客户分层数"

  expression_norms:
    scene_narrative:
      elements: [主角, 背景, 日常挑战, 尝试过的方案, 未被满足的需求]

    daily_log:
      columns: [时间段, 工作活动, 使用工具, 痛点标注, 耗时占比]

    trigger_factors:
      columns: [触发事件, 触发频率, 紧迫程度, 关联痛点]

    customer_portrait:
      elements:
        [客户类型, 行业特征, 角色特征, 规模指标, 核心痛点, 决策特征, 预算区间]

    decision_chain:
      columns: [决策角色, 关注点, 影响力权重, 触达方式]

    purchase_process:
      columns: [阶段, 客户动作, 我方动作, 典型周期, 关键物料]

# ── 第5章 价值主张 ──
ch5_value_proposition:
  structure:
    sections:
      [
        5.1核心价值主张,
        5.2业务价值生态,
        5.3核心能力模型,
        5.4差异化优势,
        5.5客户ROI分析,
        5.6竞争壁垒总结,
      ]

  rules:
    one_liner_format: '"{产品名}是面向{目标客户}的、{核心技术特征}的、{核心能力}的{品类名称}"'
    quantified_premise: "量化价值承诺表中实现前提不可省略"
    barrier_quantified: "差异化优势各子章节须有量化数据支撑，纯定性视为不完整"
    ecosystem_graph_annotation: "生态系统图（5.2.2）为产品架构核心源点，标注[核心视图]"

  expression_norms:
    problem_compare:
      columns: [问题维度, 传统方式, 传统方式痛点, 产品方案, 改善效果]

    value_compare:
      columns: [对比维度, 传统方案, 竞品A, 本产品, 差异化说明]

    quantified_promise:
      columns: [应用场景, 传统耗时, 产品耗时, 提升倍数, 实现前提]
      rule: "实现前提不可省略"

    ecosystem_participants:
      columns: [参与方, 角色定位, 核心诉求, 价值获取, 价值贡献]

    ecosystem_graph:
      format: "ASCII图，标注[核心视图]"
      structure: "供给侧 → 数据层 → 消费侧"

    data_asset_classification:
      columns: [资产类别, 数据来源, 预估规模, 核心价值, 关联资产]

    capability_definition:
      columns: [能力名称, 能力层级, 定义, 技术基础, 业务价值]

    capability_pain_mapping:
      columns: [核心能力, 对应痛点, 解决方式, 量化效果]

    barrier_description:
      elements: [壁垒名称, 壁垒来源, 量化指标, 竞品复制难度, 持续性]

    customer_roi:
      elements: [投入成本表, 节省成本表, ROI计算, 回本周期, 计算假设]
      roi_formula: "ROI = (节省成本 - 投入成本) / 投入成本 × 100%"
      rule: "计算假设不可省略"

# ── 第6章 商业模式 ──
ch6_business_model:
  structure:
    sections:
      [
        6.1商业模式概述,
        6.2定价策略,
        6.3获客策略,
        6.4客户成功,
        6.5成本结构,
        6.6盈利模型,
      ]

  rules:
    - "定价策略须说明定价锚点（客户参照物）和定价依据"
    - "获客策略各阶段须标注目标客户数、预期转化率、CAC"
    - "6.6盈利模型财务数据须与10.2预算规划和10.4投入产出分析一致"

  expression_norms:
    mode_compare:
      columns: [对比维度, 传统模式, 本产品模式, 优势说明]

    revenue_structure:
      columns: [收入类型, 收费模式, 目标占比, 说明]

    pricing_model_overview:
      columns: [客户类型, 定价模式, 定价锚点, 定价依据, 价格区间]

    pricing_detail:
      columns: [费用项目, 金额, 包含内容, 计费方式]

    pricing_compare:
      columns: [对比对象, 对比对象价格, 本产品价格, 价格差异, 价值差异]

    acquisition_stage:
      elements:
        [阶段名称, 时间范围, 目标客户数, 转化率, CAC, 核心渠道, 具体动作]

    acquisition_summary:
      columns: [阶段, 时间范围, 目标客户数, 核心策略, CAC]

    cost_structure:
      columns: [成本类别, "固定/变动", 金额或占比, 母体复用, 说明]

    phased_revenue:
      columns: [期数, 客户数, 期间收入, 期间成本, 期间利润, 累计利润, 关键假设]

    financial_targets:
      columns: [指标名称, 目标值, 行业基准, 达成时间, 关键前提]

# ── 第7章 产品架构 ──
ch7_product_architecture:
  structure:
    sections:
      [7.1产品架构总览, "7.2 Strategic Theme 与产品架构全景矩阵"]
    "7.1_subsections": [7.1.1业务域框架图(必选), 7.1.2域类型决策(必选), 7.1.3业务域清单(必选)]
    "7.2_subsections": [7.2.1 THM定义(必选), 7.2.2 THM-DOM映射(必选), 7.2.3业务域版本规划矩阵(必选)]

  derivation_order: "7.1总览（框架图+域类型+域清单） → 7.2 THM与全景（THM定义+THM-DOM映射+全景矩阵）"

  domain_types:
    Core: "核心域——差异化竞争力所在，自研"
    Supporting: "支撑域——业务必需但非差异化，定制或外购"
    Generic: "通用域——可外采或复用，外采或开源"

  consistency_rules:
    - "7.1业务域框架图覆盖7.1.3清单所有域"
    - "7.2.1 THM清单通过7.2.2 THM-DOM映射表关联到7.1.3已定义的域短号"
    - "7.2.3全景矩阵与8.1版本规划双向一致"
    - "7.2.3矩阵不应存在THM悬空（有主题无域）或域空洞（有域无任何THM在任何版本涉及）"
    - "7.2.3矩阵版本列数与第8章版本规划版本数一致"

  expression_norms:
    domain_framework_graph: # 业务域框架图规范（合并原架构图+域关系图）
      format: "ASCII图"
      elements:
        域节点: "每个业务域一个节点，标注短号和域名称"
        域类型标注: "核心域=实心框，支撑域=虚线框，通用域/外采=灰色框"
        域群分组: "按域群（如供给侧、消费侧、通用域群）分区排列"
        数据流向: "用箭头标注域间主要数据流向"
        依赖类型: "标注域间关系类型（如 CS/OHS/SK/ACL/Partnership 等 DDD 模式）"
        BC约束标注: "图注须标注：'业务域与阶段3限界上下文（BC）不必然一一对应'"

    domain_type_decision: # 域类型决策规范
      columns: [业务域, 域类型, 判断依据, 构建策略]

    domain_list: # 业务域清单规范
      columns: [语义ID, 短号, 域名称, 域类型, 范围要点, 边界说明, 关键数据]
      id_formats:
        语义ID: "DOM-{域名缩写}（如DOM-CONTENT）"
        短号: "DOM{2位数字}（如DOM01）"
      boundary_rule: "边界说明须明确'本域不做什么'——与相邻域的责任分界"

    thm_list: # THM清单规范
      columns: [短号, 语义ID, 名称, 战略意图]
      id_formats:
        语义ID: "THM-{主题缩写}（如THM-CONTENT-MGMT）"
        短号: "THM{3位数字}（如THM001）"
      rule: "THM与业务域的归属关系通过THM-DOM映射表（7.2.2）独立维护"

    thm_dom_mapping: # THM-DOM映射规范（新增）
      columns: [THM短号, THM名称, 主关联DOM, 辅助关联DOM]
      rule: "一个THM可关联多个DOM；通用域作为Enabler支撑全部THM，不归属特定THM"

    panoramic_matrix: # 业务域版本规划矩阵规范
      columns: [短号, 业务域, 域类型, 所属THM, P1版本, P2版本, Px版本]
      row_order: "按核心域→支撑域→通用域排序"
      cell_rule: "填该版本在该域上的功能演进简述；不涉及填'—'"
      thm_column_rule: "引用7.2.2映射表；通用域填'Enabler（全部）'"
      integrity_check:
        - "每条THM在矩阵中至少出现一次（无悬空主题）"
        - "每个域的Px列不应全为'—'（无空洞域）"

# ── 第8章 版本演进 ──
ch8_roadmap:
  structure:
    sections: [8.1版本规划, 8.2数据资产建设路线, 8.3关键里程碑]
    "8.1_pattern": "8.1.1路线图总览 + 各版本（Px）详情子节"

  rules:
    - "版本规划采用'总览表+各版本详情'方式"
    - "各版本功能范围须与7.2.3业务域版本规划矩阵一致"
    - "本章与执行摘要2.9节一致：执行摘要为压缩版，本章为完整版"

  expression_norms:
    roadmap_overview:
      format: "矩阵表"
      row: "功能模块维度（与产品架构或业务主题对应）"
      column: "版本期数（P1、P2、P3...）"
      annotation: "新增=实心标记，增强=空心标记（全表统一）"

    version_detail:
      elements:
        [
          版本编号,
          时间范围,
          版本目标,
          核心交付功能,
          业务主题覆盖,
          团队配置,
          版本验收标准,
          "Go/No-Go条件",
        ]
      core_functions_table: "含功能名称、所属模块、优先级、验收标准"
      business_theme_ref: "引用7.2.1节THM短号"
      team_align: "须与10.1节一致"

    data_asset_build:
      columns: [数据资产, 建设阶段, 初始来源, 转化机制, 预估规模]
      data_asset_ref: "数据资产名称与5.2.3节数据资产分类表一致"

# ── 第9章 风险分析 ──
ch9_risk:
  structure:
    sections:
      [9.1风险总览, 9.2P0级风险, 9.3P1级风险, 9.4P2级风险, 9.5风险监控机制]

  risk_levels:
    P0: "红色，必须立即处理"
    P1: "黄色，需要关注"
    P2: "绿色，可控"

  rules:
    - "每项风险采用'风险详情表+应对措施列表'的统一结构"
    - "执行摘要2.7节的关键风险为本章P0/P1的压缩版，两处须保持一致"

  expression_norms:
    risk_overview:
      columns: [风险等级, 风险数量, 风险领域, 整体评估]

    risk_detail:
      columns:
        [风险编号, 风险名称, 风险描述, 发生概率, 影响程度, 触发条件, 影响后果]
      number_format: "P{等级}-{序号}，如P0-1"

    mitigation_measures:
      columns: [措施类型, 措施描述, 责任人, 时间要求]
      measure_types: [规避, 缓解, 转移, 接受]

    risk_monitor:
      columns: [监控指标, 关联风险, 预警阈值, 监控频率, 责任人, 升级路径]

# ── 第10章 资源需求 ──
ch10_resources:
  structure:
    sections: [10.1团队资源需求, 10.2预算规划, 10.3时间规划, 10.4投入产出分析]

  rules:
    - "预算规划须区分期间预算和累计预算，注明为规划区间还是精确预测"
    - "10.1团队配置须与2.9.2节团队规划保持一致"
    - "10.2预算数据须与6.5成本结构和6.6盈利模型财务假设一致"
    - "10.3时间规划须与8.3关键里程碑一致"

  expression_norms:
    personnel_by_phase:
      columns: [期数, 岗位名称, 人数, 较上期变化, 说明]

    roi_summary:
      columns: [年度或期数, 累计投入, 累计收入, 累计净利润, ROI, 标注]
      roi_formula: "累计净利润 / 累计投入 × 100%"
      annotation: "须注明'规划区间'或'精确预测'"

    stop_loss_line:
      columns: [期数, 期末验证标准, 最大累计亏损, 止损决策, 沉没成本]
      rule: "期末验证标准须与8.1节版本验收标准一致"

# ── 附录A（可选，资料性）术语速查 ──
appendix_a:
  expansion: "子节数量不限于A.1和英文对照；可按产品概念体系分设多个速查子节"
  expression_norms:
    term_quick_ref:
      columns: [术语, 简要定义, 首次出现]
    english_mapping:
      columns: [中文, 英文, 缩写]

# ── 附录B（可选，资料性）核心概念 ──
appendix_b:
  expansion: "子节数量视概念复杂度而定；可按概念模块分设多个详解子节"
  expression_norms:
    term_relation_graph:
      format: "ASCII图，标注层级关系和关联关系类型"
    concept_definition:
      elements:
        [概念名称, 详细定义, 层级归属, 核心属性, 与其他概念的关系, 示例(宜)]

# ── 附录C（可选，资料性）业务架构 ──
appendix_c:
  expression_norms:
    architecture_graph:
      format: "ASCII图，含分层展示和边界标注"
    module_description:
      elements: [模块名称, 业务职责, 核心功能, 输入输出, 关联模块]

# ── 附录D（可选，资料性）竞品分析 ──
appendix_d:
  expression_norms:
    competitor_classification:
      columns: [竞品名称, 分类维度1(代际), 分类维度2(类型), 市场地位, 核心特点]
    competitor_compare:
      columns: [对比维度, 本产品, 竞品A, 竞品B, 差异化结论]
    competition_strategy:
      elements: [品类定位, 代际策略, 壁垒构建, 竞争节奏]

# ── 附录E（可选，资料性）财务模型详情 ──
appendix_e:
  consistency: "须与6.6盈利模型、10章预算规划和投入产出分析保持一致"
  expression_norms:
    revenue_model:
      elements: [收入公式, 关键参数表, 分期预测, 敏感性变量, 假设清单]
    cost_model:
      elements: [成本分类, 成本公式, 关键参数表, 分期预测, 母体复用]
    profit_model:
      elements:
        [
          盈利公式,
          分期盈利预测,
          盈亏平衡分析,
          敏感性分析,
          情景分析(乐观/基准/悲观),
        ]

# ── 附录F（可选，资料性）技术方案详情 ──
appendix_f:
  expression_norms:
    architecture_selection:
      columns: [选型领域, 候选方案, 选定方案, 选择理由, 风险评估]
    performance_indicators:
      columns: [指标名称, 目标值, 度量方式, 基准参考]
