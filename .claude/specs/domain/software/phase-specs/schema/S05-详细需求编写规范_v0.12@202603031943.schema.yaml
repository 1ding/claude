# BC详细需求编写规范 Schema
# 来源规范：projects/specs/software/phase-specs/outputs/S05-详细需求编写规范_v0.12@202603031943.md
# 用途：AI 内容编写阶段加载此 schema（替代完整规范），提供 BC详细需求 结构与内容约束
# 完整规则（更多示例和详细说明）：见原规范文件
# 最近验证：2026-03-04

doc_id: S05
doc_name: BC详细需求编写规范

# ── 文档结构总览 ──
structure:
  输出物: "BC详细需求规格说明书（每个BC一份，文档编号 05-{BC编号}）"
  正文章节: "第1~9章（固定顺序，不可调整）"
  附录: [附录A术语速查（可选）, 附录B评审检查清单（可选）]
  不可裁剪: [第2章BC概述与边界, 第5章需求分解, 第8章需求追溯矩阵]
  可裁剪条件:
    第3章: "小型项目（Feature<3, Story<10）可简化为单节概述，但角色-Story关联仍须保留"
    第4章: "小型项目可简化为单节概述，场景-Story关联仍须保留"
    第6章: "小型项目可简化，仅汇总关键规则，规则-Story关联仍须保留"
    第7章: "全来源全局基线且无BC特有需求时可并入第5章，BC间交互需求仍须单独列明"
  裁剪约束: "追溯链（Epic→Feature→Story→AC）不断裂，EF约束可追溯"

# ── 第1章 总则 ──
ch1_总则:
  格式: "列表形式，无下级章节，篇幅≤0.5页"
  六项强制元数据（顺序固定）:
    - 文档编号: "05-{BC编号}"
    - 文档名称: "{BC名称}BC详细需求规格说明书"
    - 目的: "规定{BC名称}的Feature、User Story及可测试验收标准"
    - 范围: "{BC名称}BC的需求分解全过程"
    - 管理要点: "核心管理要素，如'三层结构、INVEST原则、追溯矩阵'"
    - 文档密级: "【商密二级】 -- 外发必追责"

# ── 第2章 BC概述与边界 ──
ch2_BC概述与边界:
  节结构: [2.1上游承接验收, 2.2BC基本信息, 2.3BC定位与核心价值, 2.4业务边界, 2.5BC间协作关系, 2.6EF约束清单, 2.7当前版本范围]
  编写顺序: "2.1→2.2→2.3+2.4→2.5→2.6→2.7（2.1最先，假设识别后影响后续各节）"
  引用原则: "BC基本信息、职责定义、业务边界核心判断均引用阶段3/4，标注'引用阶段N X.X节'，不重新定义"
  假设管理: "缺失项记录假设 AS-{BC编号}-{序号}（全文唯一）；后续章节引用时使用该编号"

  上游承接验收清单列:
    必填: [来源阶段, 验收项, 状态]
    可选: [备注（缺失时填假设编号和内容）]
    状态枚举: [已确认, 部分缺失, 缺失]
    覆盖范围: "阶段2/3/4的所有输入项，按本BC实际承接范围筛选"

  BC基本信息表:
    必填项: [BC编号, BC名称, 所属子域, 对应微服务（引用阶段4）, 对应数据库（引用阶段4）, 核心聚合（引用阶段3）]
    格式: "字段 | 内容 两列表"

  BC定位与核心价值: "2~3段叙述，每段≤5句（第一段：职责定义；第二段：核心能力列表；第三段：核心价值+关联角色）"

  业务边界:
    正面清单列: [业务范围, 依据（引用阶段/章节）]
    负面清单列: [业务范围, 归属BC, 边界判断依据]
    完整性: "正面清单覆盖所有承接Epic；负面清单覆盖最易混淆的相邻BC"

  协作关系表列: [协作BC, 协作方向（上游/下游/双向）, 映射模式（ACL/OHS/CF等）, 通信方式（同步API/异步事件/混合）, 交互概述]

  EF约束清单列: [约束编号（EF-{BC编号}-{序号}）, 约束名称, 来源（阶段4章节）, 约束内容, 影响范围（具体到Feature级或NFR类别，禁止写"全部"）, 验收标准]

  版本覆盖表列: [版本, 覆盖Epic, 覆盖Feature（第5章完成后回填）]

# ── 第3章 用户角色 ──
ch3_用户角色:
  节结构: [3.1角色提取, 3.2角色定义, 3.3角色-Epic关联]

  角色提取表列: [角色编号（沿用CL2）, 角色名称, 所属利益相关方（CL0/CL1）, 与本BC的关系, 提取依据（章节号）]
  关系枚举: [直接使用者, 间接使用者, 系统集成方]
  覆盖验证: "每个Epic至少有一个角色关联；无角色覆盖的Epic须标注说明"

  角色定义模型:
    子节格式: "### 3.2.x {角色名称}"
    必填项: [角色编号, 角色名称, 核心目标（引用阶段2）, 在本BC的职责（1~3条可验证行为）, 典型操作场景（引用第4章SC编号）, 交互频率, 典型痛点（引用阶段2）]
    交互频率枚举: [高频（日常）, 中频（周级）, 低频（月级或更低）]
    在本BC的职责: "须为可验证行为（如'审批租户开通申请'），禁止抽象描述（如'管理相关业务'）"

  角色-Epic关联表列: [角色编号, 角色名称, 关联Epic, 关联关系]
  关联关系枚举: [主要使用者, 次要使用者, 审批者, 被通知者]
  约束: "每个Epic≥1个主要使用者；每个角色≥1个Epic关联（否则质疑该角色是否属于本BC）"

  角色编号规则: "沿用阶段2 CL2编号；BC细分用 {CL2编号}-{子序号}（如 CL2-03-A），标注'BC级细分，待阶段2确认'"
  粒度标准:
    合并为同一角色: "业务目标一致且仅权限不同；场景完全重叠；AC无需按角色区分"
    拆分为不同角色: "业务目标不同；场景差异>50%；AC须按角色分别定义"

# ── 第4章 业务场景 ──
ch4_业务场景:
  节结构: [4.1场景识别与细化方法, 4.2场景定义, 4.3场景-Epic-活动映射]

  场景细化步骤表列: [步骤序号, 步骤名称, 步骤说明, 输入（来源，如"阶段2 PL2流程节点清单"）]
  步骤覆盖范围: "提取PL2流程节点 → 识别操作场景 → 细化主/分支/异常流程 → 验证场景覆盖度"

  场景定义模型:
    子节格式: "### 4.2.x {场景名称}"
    必填项: [场景编号（SC-{BC编号}-{三位序号}）, 场景名称（动宾结构）, 来源活动（PL2编号+名称）, 触发条件, 前置条件, 参与角色（引用第3章）, 业务价值, 后置条件, 关联Epic]
    触发条件vs前置条件: "触发条件=启动场景的事件；前置条件=场景前已满足的系统状态"
    流程描述:
      主流程: "编号步骤列表；每步仅一个动作；格式：'N. {操作主体}{动作}{对象}（{约束说明}）'"
      分支流程: "标注分支点：'从主流程第N步分支：当{条件}时，{操作}'"
      异常流程: "格式：'当{异常条件}时 → {处理动作} → {最终状态}'"

  场景-Epic-活动映射表列: [场景编号, 场景名称, 关联Epic, 来源活动, 覆盖状态（已覆盖/部分覆盖/未覆盖）]

  约束:
    - "场景编号 SC-{BC编号}-{三位序号}，从001起连续，不跳号"
    - "场景名称用动宾结构（如'提交试用申请'），禁止名词短语（如'试用申请'）"
    - "参与角色引用第3章编号，不在本章新建"

  粒度标准:
    合适: "主流程3~10步；1~2个角色；1个触发事件；1个完整业务闭环；1~3个Feature"
    应拆分: "主流程>15步；>3个角色交替；多个不同触发事件；含'等待外部响应'节点"
    应合并: "主流程<2步；不构成完整业务闭环（是另一场景的子步骤）"

# ── 第5章 需求分解 ──
ch5_需求分解:
  节结构: [5.1分解方法与原则, 5.2需求层级总览, 5.3Capability拆分（宜，仅跨BC时）, 5.4Feature定义, 5.5User Story定义]

  分解步骤: "Epic/Capability → Feature（每个Feature单PI可交付）→ Story（INVEST原则，单迭代完成）→ AC（可测试无歧义）"

  INVEST原则:
    I（独立）: "可独立交付，不依赖其他未完成Story；不满足→拆除依赖或调整顺序"
    N（可协商）: "实现方式可协商；不满足→移除技术实现细节"
    V（有价值）: "对用户有明确价值；不满足→重写价值描述或合并"
    E（可估算）: "能估算工作量；不满足→补充信息或拆分"
    S（小）: "1~3天内完成；不满足→拆分"
    T（可测试）: "有明确验收标准；不满足→补充AC"

  需求层级表: "9列：Epic | Feature | Story编号 | User Story | AC编号 | 验收标准 | 角色 | 优先级 | 规模（行顺序体现层级，不缩进）"

  Feature定义模型:
    子节格式: "### 5.4.x FT-{编号} {Feature名称}"
    必填项: [Feature编号（FT-{BC编号}-{两位序号}）, Feature名称, 所属Epic, Feature描述（一句话）, 业务价值（一句话）, 包含Story（编号列表）, 关联场景（引用第4章）, 目标版本（P1~P6）, 优先级（P1~P6）]
    粒度标准:
      合适: "3~10个Story；1个PI内可交付；用户可感知；独立可发布"
      应拆分: "Story>15；需跨多个PI"
      应合并: "仅1~2个Story且工作量不足1迭代；用户无法感知独立价值"

  User_Story定义模型:
    子节格式: "### 5.5.x US-{编号} {Story名称}"
    必填项: [Story编号（US-{BC编号}-{三位序号}）, Story名称（动宾结构）, 所属Feature, 用户故事, 角色（引用第3章）, 关联场景（引用第4章）, 关联规则（引用第6章，未完成标注"待确认"）, 优先级（P1~P6）, 规模估算（XS/S/M/L/XL）]
    用户故事格式: "作为{角色名称}，我想要{用户视角的操作描述（不含技术实现细节）}，以便{业务价值描述}"
    粒度标准:
      合适: "1~3天；3~10条AC；1个角色；全部满足INVEST；规模XS~L"
      应拆分: "超过1周；AC>15；涉及>3个角色；I或S不满足；规模XL"
      应合并: "少于2小时；仅1条AC；V不满足（无独立价值）"

  AC表:
    列: [AC编号（AC-{Story序号}-{两位序号}）, 验收标准, AC类型]
    AC类型枚举: [功能型, 数据型, 界面型, 流程型, 规则型, 性能型]
    AC格式: "能{动作}{对象}（{约束条件}）"
    动词要求: "用户视角（填写/选择/查看/上传/提交/导出等），禁止系统视角（调用/存储/渲染等）"
    粒度: "每条AC描述一个独立验收点；'能填写企业名称和所属行业'须拆分为两条AC"

  约束:
    - "每个Story≥1个场景关联；每个场景≥1个Story覆盖"
    - "XL级Story禁止保留，必须拆分为多个M/L级Story后录入"
    - "Story优先级默认继承所属Epic；同Feature下Story优先级跨度≤2级"
    - "优先级一致性：P1 Story→P1版本；P2 Story→P1或P2版本"

# ── 第6章 业务规则汇总 ──
ch6_业务规则汇总:
  节结构: [6.1规则分类体系, 6.2业务规则清单, 6.3规则-Story映射]

  标准分类体系:
    VAL: 校验规则（数据合法性和完整性校验）
    CAL: 计算规则（数值计算、公式推导、自动赋值）
    FLW: 流程规则（流转条件、状态变迁约束）
    AUTH: 权限规则（操作权限、数据可见性约束）
    LMT: 限额规则（数量上限、频次限制、配额约束）
    NTF: 通知规则（触发通知/提醒的条件和方式）

  业务规则清单表列: [规则编号（BR-{BC编号}-{三位序号}）, 规则名称（动宾结构）, 规则描述, 规则类型（引用6.1分类编码）, 关联Story（引用第5章）, 触发时机, 违规处理]
  规则描述格式: "{判断对象}在{触发时机}时，若{判断条件}，则{通过处理}；否则{违规处理}"
  违规处理类型:
    阻断型: "阻止操作继续，向用户提示错误"
    警告型: "允许操作继续，展示警告提示"
    静默型: "不影响用户操作，系统后台记录日志"

  规则-Story映射: "规则→Story映射表（规则编号/规则名称/规则类型/关联Story）+ Story→规则映射表（Story编号/Story名称/关联规则）"

  约束:
    - "规则编号 BR-{BC编号}-{三位序号}，从001起连续，不按分类分段编号"
    - "触发时机具体到用户操作或系统事件（如'表单提交时''状态变更时'），禁止模糊表述"
    - "规则与AC区分：被多个Story引用→业务规则；仅单Story引用→AC内嵌"
    - "每条规则≥1个Story关联"

# ── 第7章 非功能需求细化 ──
ch7_非功能需求细化:
  节结构: [7.1非功能需求来源, 7.2性能需求, 7.3安全需求, 7.4可用性需求, 7.5其他质量属性（宜）, 7.6BC间交互需求, 7.7数据需求]
  细化原则: "全局基线提供下限；Enabler Feature约束不可放宽（指标值须≥EF定义的基线）；BC特有需求按业务重要性补充"
  EF约束处理: "第2章2.6节EF约束中涉及非功能性要求的，须在本章对应类别展开为具体指标"

  编号体系:
    性能需求: "NFR-{BC编号}-P{两位序号}"
    安全需求: "NFR-{BC编号}-S{两位序号}"
    可用性需求: "NFR-{BC编号}-A{两位序号}"
    其他质量属性: "NFR-{BC编号}-Q{两位序号}"
    数据需求: "NFR-{BC编号}-D{两位序号}"
    BC间交互: "ITF-{BC编号}-{两位序号}"

  非功能需求来源汇总表列: [来源（全局基线/Enabler Feature约束/BC特有）, 来源文档（阶段+章节）, 适用范围（性能/安全/可用性等）, 细化原则（继承/收紧/补充）]

  性能需求表列: [需求编号, 需求项, 指标值（量化含单位，如"<2s""支持200并发"）, 来源, 测试场景, 验收方式（性能/压力/基准测试）, 优先级]

  安全需求表列: [需求编号, 需求项, 安全类别（认证/授权/数据安全/传输安全/审计）, 要求描述（无歧义，可直接转化为验收条件）, 来源, 验收方式（安全/渗透/代码审查/配置检查）, 优先级]

  可用性需求表列: [需求编号, 需求项, 指标值（量化含单位，如"≥99.9%"）, 来源, 降级策略（可选）, 验收方式（可用性测试/监控验证/演练验证）, 优先级]

  数据需求表列: [需求编号, 需求类型（存储/迁移/一致性/备份/归档）, 需求描述（量化，如"数据保留7年"）, 来源, 技术约束（可选）, 验收方式]

  BC间交互需求表列: [接口编号, 接口名称, 方向（本BC调出/本BC调入）, 对端BC, 协议（同步REST/同步gRPC/异步事件/异步消息）, 数据格式（关键字段概述）, SLA要求（响应时间/可用性/重试策略）, 来源（引用阶段3/4章节）]
  BC间交互一致性: "7.6节每个协作BC须在7.6节有≥1条交互需求，与2.5节协作关系一一对应"

  约束: "每条NFR须包含量化指标值；无法量化时明确定性标准和验收判断方式，不接受'响应应足够快'等定性描述"

# ── 第8章 需求追溯矩阵 ──
ch8_需求追溯矩阵:
  节结构: [8.1追溯链路说明, 8.2正向追溯矩阵, 8.3反向追溯矩阵, 8.4场景覆盖度验证, 8.5EF约束落实验证, 8.6覆盖度结论]
  编写时机: "在第2~7章全部完成后编写，作为全文档完整性验证"

  追溯链路层级:
    L0: "Business Epic（来源：第2章2.7节；编号：EP-*）"
    L1: "Capability（来源：第5章5.3节；编号：阶段3定义，如有）"
    L2: "Feature（来源：第5章5.4节；编号：FT-{BC编号}-{序号}）"
    L3: "User Story（来源：第5章5.5节；编号：US-{BC编号}-{序号}）"
    L4: "Acceptance Criteria（来源：第5章5.5节；编号：AC-{Story序号}-{序号}）"
    约束层: "Enabler Feature（来源：第2章2.6节；编号：EF-{BC编号}-{序号}）"

  正向追溯表列: [Epic编号, Epic名称, Capability（可选）, Feature编号, Feature名称, Story编号, Story名称, AC数量]
  反向追溯表列: [Story编号, Story名称, Feature编号, Feature名称, Epic编号, Epic名称]
  场景覆盖度验证表列: [场景编号, 场景名称, 覆盖Story（编号列表）, 覆盖状态（已覆盖/部分覆盖/未覆盖）, 备注]
  约束落实验证表列: [约束编号, 约束名称, 落实章节（如"7.2节"）, 落实内容摘要（NFR编号+指标值）, 落实状态（已落实/部分落实/未落实）, 备注]

  覆盖度汇总表列: [验证维度, 总数, 已覆盖, 覆盖率, 结论（通过/有缺口）]
  通过标准（均须100%）:
    - "Epic → Feature 覆盖"
    - "Feature → Story 覆盖"
    - "场景 → Story 覆盖"
    - "Enabler Feature 约束 → 落实"

  约束:
    - "本章不新增/修改任何编号，所有编号与第2~7章完全一致"
    - "覆盖率<100%时须在备注说明处理方案（补充遗漏/记录已知缺口/确认不需覆盖）"

# ── 第9章 优先级与版本规划 ──
ch9_优先级与版本规划:
  节结构: [9.1版本分配规则, 9.2优先级分布, 9.3版本规划详情, 9.4规模估算汇总]

  版本定义:
    P1: "MVP（核心必备，没有就不能用）"
    P2: "增强（重要功能，没有会很不方便）"
    P3: "完善（标准功能，有了更完善）"
    P4: "扩展（扩展功能，支持更多场景）"
    P5: "高级（高级功能，满足深度需求）"
    P6: "理想（远期功能，理想状态下的能力）"

  版本维度统计表列: [版本, Feature数量, Story数量, AC数量, 占比]
  分布建议: "P1 Story数宜占总数20%~40%；P1+P2宜占50%~70%"

  版本规划详情:
    格式: "按版本分设子节（'### 9.3.P1 P1版本规划'等）"
    版本Feature/Story清单表列: [Feature编号, Feature名称, Story编号列表, Story数量, 规模汇总（如"S×2, M×3, L×1"）, 迭代安排（可选）]

  规模等级参考:
    XS: "<0.5天（简单修改、配置调整）"
    S: "0.5~1天（单一功能点）"
    M: "2~3天（标准用户故事）"
    L: "1周（复杂用户故事）"
    XL: "2周+（须拆分，不可直接交付）"
  规模分布统计表列: [规模等级, Story数量, 占比, 备注（XL须列编号和拆分方案）]

  约束:
    - "版本范围不超出第2章2.7节定义"
    - "所有Feature/Story编号、优先级、规模与第5章完全一致，本章不修改定义"
    - "XL级Story须给出拆分方案，拆分后回写第5章并更新第8章"
    - "存在依赖的Story，被依赖方在同版本或更早版本"

