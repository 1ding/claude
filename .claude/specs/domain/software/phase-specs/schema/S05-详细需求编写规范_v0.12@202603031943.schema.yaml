appendix:
  性质: "资料性附录（可选）"
  附录A_术语速查:
    节结构: [A.1需求层级术语索引, A.2本文档特有术语索引]
    说明: "为读者提供BC详细需求相关术语快速查询索引；权威定义见《软件开发术语规范》，本附录仅供快速参照"
  附录B_评审检查清单:
    节结构: [B.1评审检查清单, B.2常见问题（宜）]
    说明: "B.1按维度列出检查项、检查内容和通过标准；B.2提供Story粒度、AC数量、业务规则与AC区别等常见问题处理指引"
    覆盖维度: [Epic覆盖度, 场景覆盖度, Feature完整性, INVEST原则, AC可测试性, 业务规则完整性, 非功能需求细化度, 追溯链完整性]

# ── 编号体系汇总 ──
numbering:
  Feature:      "FT-{BC编号}-{两位序号}，如 FT-BC11-01"
  Story:        "US-{BC编号}-{三位序号}，如 US-BC11-001"
  AC:           "AC-{Story序号}-{两位序号}，如 AC-001-01"
  场景:         "SC-{BC编号}-{三位序号}，如 SC-BC11-001（从001起，连续，不跳号）"
  业务规则:     "BR-{BC编号}-{三位序号}，如 BR-BC11-001（全局连续，不按分类分段）"
  EF约束:       "EF-{BC编号}-{序号}"
  假设:         "AS-{BC编号}-{序号}（全文唯一）"
  性能需求:     "NFR-{BC编号}-P{两位序号}"
  安全需求:     "NFR-{BC编号}-S{两位序号}"
  可用性需求:   "NFR-{BC编号}-A{两位序号}"
  其他质量需求: "NFR-{BC编号}-Q{两位序号}"
  数据需求:     "NFR-{BC编号}-D{两位序号}"
  BC间交互:     "ITF-{BC编号}-{两位序号}"
