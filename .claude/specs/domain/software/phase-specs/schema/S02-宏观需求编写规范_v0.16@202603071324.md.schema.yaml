# 宏观需求编写规范 Schema
# 来源规范：.claude/specs/domain/software/phase-specs/drafts/S02-宏观需求编写规范_v0.16@202603071324.md
# 用途：AI 编写"02-宏观需求规格说明书"阶段加载此 schema（替代完整规范），提供内容约束
# 完整规则（更多示例和详细说明）：见原规范文件
# 修订日期：2026-03-07

doc_id: S02
doc_name: 宏观需求编写规范

# ── 核心方法论 ──
methodology:
  名称: 三线演绎，角色驱动，两维验证
  三线:
    活动线: "PL0(价值链/职能域) → PL1(端到端流程) → PL2(流程节点) = 业务环节"
    角色线: "RL0(所有利益相关方) → RL1(特定利益相关方) → RL2(用户角色)"
    实体线: "EL0(ER全景图) → EL1(具体实体) → EL2(生命周期)"
  推导主线: "角色(RL2)的痛点/期望 → 候选Epic → 抽象过滤 → Epic"
  两维验证: "业务环节(PL2节点)覆盖度 + 实体生命周期(EL2)覆盖度"
  追溯链: "业务目标 → 困境 → 业务环节 → 角色 → Epic → 版本"
  层级标记:
    PL: "流程层级，活动线专用（PL0价值链/PL1端到端流程/PL2流程节点=业务环节）"
    RL: "角色层级，角色线专用（RL0所有利益相关方/RL1特定利益相关方/RL2用户角色）"
    EL: "实体层级，实体线专用（EL0 ER全景/EL1具体实体/EL2生命周期）"
  说明: "v0.16起三线前缀统一为PL/RL/EL，不再使用CL统一前缀"

# ── 章节结构（11章+附录，顺序固定不可调整）──
chapter_structure:
  mandatory_chapters:
    - "第1章 总则（强制元数据）"
    - "第2章 背景与约束（三段式：前置背景+业务背景与目标+需求落位）"
    - "第3章 基于业务环节的宏观需求分析（活动线演绎，PL0→PL1→PL2）"
    - "第4章 基于关键实体生命周期的宏观需求分析（实体线演绎）"
    - "第5章 基于角色的宏观需求分析（角色线演绎）"
    - "第6章 Business Epic 定义与验证（推导+定义+映射验证+完整性验证）"
    - "第7章 基础性宏观需求分析（横切功能需求）"
    - "第8章 非功能宏观需求分析（质量约束）"
    - "第9章 Enabler Epic 定义（基于第7/8章输入，定义跨BC架构级Epic）"
    - "第10章 版本规划与 Epic 分配（Epic→版本映射）"
    - "第11章 追溯矩阵（全链路追溯）"
    - "附录A 术语表（三层：业界通用+天帷通用+文档专有）"
    - "附录B 文档说明（可选）"
    - "修订记录"

# ── 第1章 总则 ──
ch1_general:
  规则: "仅含强制元数据，无实质规范内容，篇幅≤0.5页"
  强制元数据:
    顺序固定: "文档编号 → 文档名称 → 目的 → 范围 → 管理要点 → 文档密级"
    格式: "+   {元数据项}:{内容}"
  示例:
    文档编号: "S02（格式：{前缀}-{序号}，前缀S/C/P）"
    文档密级: "【商密二级】 -- 外发必追责"

# ── 第2章 背景与约束 ──
ch2_background:
  结构: "三段式：2.1前置背景 + 2.2业务背景与目标 + 2.3需求落位"
  编写顺序: "2.1+2.2完成时预建2.3表格框架填入THM清单，第6章完成后回填处置方式和Epic编号"
  ch2_1_前置背景:
    战略基线引用表列: "[THM短号, THM语义ID, THM名称, 战略意图, 所属业务域]"
    版本范围表列: "[版本, 时间范围, 核心目标, 分析详略]"
    约束条件表列: "[约束类型, 约束项, 约束描述, 影响范围]"
    假设与依赖表列: "[类型, 编号(AS-n/DP-n), 描述, 影响范围, 失效后果]"
    规则: "阶段1输出不完整时记录为假设AS-*，标注'来源：阶段1输出缺失'"
  ch2_2_业务背景:
    阶段1输入验收检查表列: "[检查项, 合格标准, 不满足时的处理方式]"
    战略目标引用表列: "[目标维度, 战略目标, 量化指标]"
    阶段目标引用表列: "[版本, 时间范围, 核心目标, 关键成果, 财务目标]"
    困境描述规范:
      列: "[困境编号, 困境名称, 困境描述, 影响范围, 当前应对, 严重程度, 关联目标]"
      编号格式: "语义ID: DLM-{困境描述}；短号: DLM{3位数字}"
      关联目标: "应引用具体目标维度或目标编号（如OBJ-01），避免笼统描述"
      继承规则: "以S01第2.1节困境分析为基线，可按业务目标维度补充或细化；新增困境须标注来源"
    成功标准定义表列: "[维度, 指标, 目标值, 衡量方式]"
  ch2_3_需求落位:
    规则:
      - "01-战略规划第6章中所有THM必须出现，不得静默缺失"
      - "废弃时说明列必填废弃原因"
      - "新增时说明列必填来源，THM列填'-'"
      - "第6章完成后回填处置方式和Epic编号；编写时先预建表格框架"
    需求落位表列: "[THM短号, THM名称, 处置方式, 对应Epic, 说明]"
    处置方式取值: "承接 / 废弃 / 新增"

# ── 第3章 基于业务环节的宏观需求分析（活动线）──
ch3_business_process:
  演绎顺序: "PL0(识别职能域) → PL1(识别端到端流程) → PL2(分解流程节点=业务环节) → 业务域归类"
  S01继承: "S01第4.2节业务价值生态 + 第6.2节业务域划分(DOM)直接继承，不重新定义"
  S01生态继承确认表列: "[S01输出项, S01章节, 继承状态, S02使用方式]"
  端到端流程定义表列: "[流程编号, 流程名称, 业务触发点, 业务终点, 贯穿职能域, 业务价值, 关联困境, 关联目标]"
  流程节点定义表列: "[节点编号, 节点名称, 所属流程, 所属职能域, 参与角色, 节点输入, 节点输出, 业务目标]"
  编号格式:
    端到端流程: "P-{主域缩写}-{序号}"
    流程节点: "BA-{职能域缩写}-{序号}"
  流程节点粒度:
    合适: "有明确输入输出，通常单一职能域，能独立产生价值，1-2个角色负责"
    每个端到端流程节点数: "3-8个"
  业务域继承确认表列: "[DOM短号, 域名称, 域类型, 流程数量, 节点数量]"
  业务域归类:
    流程归类表列: "[业务域, 域缩写, 流程编号, 流程名称]"
    节点归类表列: "[业务域, 域缩写, 节点编号, 节点名称, 所属流程]"
  完整性检查: "所有PL1/PL2均已归入业务域，无重复归属，域缩写与节点编号一致"

# ── 第4章 基于关键实体生命周期的宏观需求分析（实体线）──
ch4_entities:
  实体编号格式: "语义ID: EN-{域缩写}-{实体描述}；短号: EN{3位数字}"
  生命周期阶段编码: "语义ID: {实体语义ID}-LC-{阶段描述}；短号: LC{3位数字}（全局递增）"
  事件编号: "语义ID: EVT-{域缩写}-{事件描述}；短号: EVT{3位数字}（全局递增）"
  实体分类: "根据产品实际业务模式确定（双边平台型/企业工具型/供应链管理型/监管合规型等）"
  生命周期定义表列: "[实体编号, 阶段编码, 阶段名称, 状态(DRAFT/REVIEW/ACTIVE/VOID), 说明, 触发事件编号, 触发事件名称]"
  实体关系表列: "[实体A, 关系类型(1:1/1:N/M:N/包含/引用/派生), 实体B, 关系说明]"
  生命周期→业务环节映射表列: "[实体编号, 实体名称, 阶段编码, 阶段名称, 触发事件编号, 覆盖活动编号(BA-*), 覆盖活动名称, 覆盖状态(有/无)]"
  注意: "4.4节'业务环节'特指第3章PL2流程节点（BA-*）"

# ── 第5章 基于角色的宏观需求分析（角色线）──
ch5_roles:
  演绎顺序: "RL0(利益相关方分类框架) → RL1(特定利益相关方) → RL2(用户角色)"
  S01继承: "S01第4.2节生态参与方为利益相关方基线；S01第3.2节客户画像转化为用户角色"
  筛选规则: "仅'直接用户'类的具体岗位进入RL2角色定义"
  利益相关方编号: "语义ID: SH-{描述}；短号: SH{2位数字}"
  特定利益相关方定义表列: "[利益相关方编号, 利益相关方名称, 所属分类, 所属生态维度, 组织描述, 与产品关系, 影响程度]"
  角色定义表列: "[角色编号, 角色名称, 所属生态维度, 所属利益相关方, 核心目标, 主要职责, 痛点, 期望, 使用频率, 用户画像摘要, 工作场景]"
  角色编号格式: "语义ID: ROLE-{角色名称}；短号: UP-01/UR-01/UC-01（分类前缀方案）或ROLE{3位数字}"
  工作场景:
    类型: "直接作业场景（关联BA-*业务环节）/ 间接作业场景（说明管理/分析对象）"
    编号格式: "语义ID: WS-{角色名}-{场景描述}；短号: WS{3位数字}"
    定义表列: "[场景编号, 场景名称, 场景类型, 所属角色, 场景描述, 工作目标, 关联痛点, 关联期望, 关联活动]"
  角色→业务环节映射表列: "[角色编号, 角色名称, 场景编号, 场景名称, 场景类型, 关联活动编号, 关联活动名称, 活动数量]"
  反向覆盖检查: "所有PL2流程节点(BA-*)须被至少一个直接作业场景覆盖"
  关键旅程触点: "可选；每角色3-5个；编号TP-{角色名}-{触点描述}/TP{3位数字}"
  旅程触点定义表列: "[触点编号, 所属角色, 关联场景, 关联活动, 触点描述, 体验敏感因素, 关联Epic]"

# ── 第6章 Business Epic 定义与验证 ──
ch6_epics:
  S01继承: "能力域与S01第6.2节业务域(DOM)对齐，S01第6.4节全景矩阵作为结构框架"
  推导流程:
    主线: "逐角色逐痛点/期望 → 候选Epic → 抽象过滤 → Epic初始清单"
    验证补充: "业务环节(PL2)覆盖度 + 实体生命周期(EL2)覆盖度 → 发现遗漏 → 补充Epic"
    推导来源标注: "角色驱动 / 实体验证补充 / 活动验证补充"
  抽象过滤判断:
    能力独立性: "是独立业务能力域，非某Epic下的具体功能点"
    多活动覆盖: "覆盖多个PL2流程节点或解决多个角色痛点"
    可拆分性: "可预见地拆分为多个Feature"
    目标对齐: "可直接追溯到业务目标或困境"
    不通过处理: "降级为Feature候选项，记录来源，留待阶段4"
  能力架构:
    层次: "2-4层，根据产品实际业务模式和技术架构确定"
    跨域交互视图: "可选但推荐；记录跨业务域的Epic协作关系"
    跨域交互视图表列: "[源Epic短号, 源Epic所属业务域, 目标Epic短号, 目标Epic所属业务域, 交互类型, 关键数据流向, 说明]"
  Epic编号格式:
    语义ID: "EPIC-{业务域缩写}-{功能模块小写英文连字符}"
    短号: "EPIC{3位数字}，全局唯一，短号不回收"
  Epic定义表列:
    必填: "[Epic编号, Epic名称, 能力定义, 核心要素, 推导来源, 来源角色, 关联活动(BA-*), 依赖关系, 业务价值, 关联困境, 业务边界, 交互边界]"
    选填: "[验证方式]"
  业务边界: "明确Out of Scope；能力级别，不细化到功能点；含待定归属项"
  交互边界: "明确与外部系统/其他Epic的责任分工；包含交互对象/方向/内容"
  待定归属项表列: "[待定能力描述, 可能归属方, 初步建议归属, 确认时间点]"
  业务验收场景:
    要求: "每Epic 1-2个；从角色视角描述；包含可观测结果"
    编号格式: "语义ID: BAS-{Epic短号}-{场景描述}；短号: BAS{3位数字}"
    表列: "[场景编号, 所属Epic, 场景描述]"
  完成标准:
    必要条件:
      - "关联业务环节在线上实现闭环"
      - "成功标准量化指标达成"
      - "关联实体生命周期阶段在线上实现"
      - "来源痛点/期望均被Feature覆盖"
    充分条件:
      - "追溯矩阵全链路无断点"
      - "依赖的基础性需求已交付且可用"
      - "相关非功能需求量化约束已达标"
  映射验证（6.3，即时逐条验证）:
    业务环节→Epic: "[活动编号, 活动名称, Epic短号, Epic名称, 覆盖状态(Y/N)]"
    实体生命周期→Epic: "[实体, 生命周期阶段, Epic短号, Epic名称, 覆盖状态]"
    角色→Epic确认: "[所属利益相关方, 角色编号, 角色名称, 痛点/期望, Epic短号, Epic名称, 覆盖状态]"
  冲突调和: "角色线与实体线/活动线冲突时，以业务目标对齐度为最终裁决标准"
  完整性验证（6.4，全量汇总）:
    定位: "汇总6.3映射结果，计算各维度覆盖度，应在版本规划（第10章）之前完成"
    三个维度:
      - "角色推导完整性（汇总6.3.3，所有角色痛点/期望→Epic）"
      - "业务环节覆盖度（汇总6.3.1，所有PL2流程节点→Epic）"
      - "实体生命周期覆盖度（汇总6.3.2，所有实体阶段→Epic）"
    通过标准: "三个维度无未覆盖项(N)，或未覆盖项有合理说明（如'纯人工操作，不纳入系统'）"

# ── 第7章 基础性宏观需求分析 ──
ch7_foundation:
  定义: "跨BC的功能性横切关注点（功能性），区别于非功能需求（质量约束）"
  典型分类: "[身份认证, 权限管理, 租户管理, 审计日志, 消息通知, 文件管理]"
  需求编号: "语义ID: FR-{能力描述}；短号: FR{2位数字}"
  定义表列: "[需求编号, 需求名称, 需求分类, 需求描述, 能力要点, 目标版本, 建议归属域, 关联Epic]"

# ── 第8章 非功能宏观需求分析 ──
ch8_nfr:
  定义: "质量约束（质量水平），区别于基础性需求（功能性横切）"
  典型分类: "[性能需求, 安全需求, 可用性需求, 可扩展性, 兼容性需求, 可维护性, 易用性需求, 集成接口需求]"
  需求编号: "语义ID: NFR-{类别}-{约束描述}；短号: NFR{3位数字}"
  定义表列: "[需求编号, 需求分类, 需求项, 框架要求, 典型场景, 量化约束, 目标版本, 备注]"
  量化约束原则: "量级优先（如'百毫秒级''千级并发'），仅有充分依据时填精确数值"
  集成接口需求表列: "[集成方向(入站/出站), 外部系统, 集成目的, 数据类型, 集成方式, 目标版本]"

# ── 第9章 Enabler Epic 定义 ──
ch9_enabler_epic:
  定位: "基于第7/8章输入，将跨BC架构级需求定义为 Enabler Epic"
  与Business_Epic关系: "Business Epic 交付用户价值；Enabler Epic 构建架构跑道以支撑业务交付"
  识别逻辑: "遍历第7章FR-*和第8章NFR-*，按架构能力域归组为 Enabler Epic"
  Enabler_Epic编号: "语义ID: EEPIC-{能力域}-{功能描述}；短号: EEPIC{3位数字}"
  定义表列: "[Epic编号, Epic名称, 能力域, 能力定义, 包含的基础性需求(FR-*), 包含的非功能需求(NFR-*), 支撑的业务Epic, 目标版本, 验收标准]"
  Enabler_Business映射表列: "[Business Epic 短号, Business Epic 名称, 依赖的 Enabler Epic, 依赖说明]"

# ── 第10章 版本规划与 Epic 分配 ──
ch10_versioning:
  S01继承: "版本框架继承S01第7.1节版本路线图，版本编号和定位与S01保持一致"
  版本号体系: "X.Y.Z（主版本.规划版本.修订版本）；偶数Y=规划内(P1-P6)，奇数Y=规划外补充版本"
  规划版本映射:
    P1: "v1.0 MVP版本（最高优先级）"
    P2: "v1.2 增强版本"
    P3: "v1.4 完善版本"
    P4: "v1.6 扩展版本"
    P5: "v1.8 高级版本"
    P6: "v2.0 理想版本（最低优先级）"
  优先级说明: "规划版本即优先级，P1最高，P6最低"
  版本分配方法: "WSJF（推荐）或 MoSCoW（简化替代）"
  WSJF评估表列: "[Epic短号, Epic名称, 业务价值, 时间紧迫性, 风险降低/机会促成, 实现规模, WSJF得分]"
  WSJF计算: "(业务价值 + 时间紧迫性 + 风险降低/机会促成) / 实现规模；得分越高优先级越高"
  WSJF评分尺度: "修正Fibonacci序列(1,2,3,5,8,13,20)，相对估算"
  版本规划表列: "[规划版本, 版本号, 版本定位, Epic数量, 关键里程碑]"
  Epic-版本映射表列: "[Epic短号, Epic名称, 规划版本(=优先级), 版本号, 决策依据(WSJF得分), 依赖Epic]"
  补充版本触发决策: "按紧迫性/业务影响/依赖关系/工作量四维度判断创建补充版本还是合并到下一规划版本"

# ── 第11章 追溯矩阵 ──
ch11_traceability:
  追溯链: "目标 → 困境 → 业务环节(PL2) → 利益相关方(SH-*) → 角色 → Epic → 版本"
  分维度追溯:
    - "11.2 困境→业务环节：[困境描述, 解决该困境的活动, 活动贡献]"
    - "11.3 角色→Epic：[角色编号, 角色名称, 痛点/期望, Epic短号, Epic名称, 覆盖状态]"
    - "11.4 业务环节→Epic：[活动编号, 活动名称, Epic短号, Epic名称, 覆盖状态]"
    - "11.5 实体生命周期→Epic：[实体, 生命周期阶段, Epic短号, Epic名称, 覆盖状态]"
    - "11.6 Epic→版本：[Epic短号, Epic名称, 目标版本(=优先级), 覆盖状态]"
  全链路追溯矩阵列: "[目标, 困境, 活动, 利益相关方(SH-*), 角色, Epic, 版本]"
  覆盖度检查标准:
    - "困境覆盖：所有困境都有业务环节支撑"
    - "角色推导覆盖：所有角色痛点/期望有Epic支撑"
    - "业务环节覆盖：所有PL2流程节点都有Epic覆盖"
    - "实体生命周期覆盖：所有实体状态流转有Epic覆盖"
    - "版本覆盖：所有Epic(Business+Enabler)都有版本安排"
    - "基础性需求→Enabler：所有FR-*已归入Enabler Epic"
    - "非功能需求→Enabler：所有NFR-*已归入Enabler Epic"
    - "Enabler-Business映射：所有Business Epic依赖的Enabler Epic已定义"

# ── 双轨制编号体系（全局规则）──
numbering:
  原则: "每个条目由语义ID（业务含义，不变）和短号（简洁易记，递增分配）共同标识"
  引用规则: "首次引用同时标注语义ID和短号；后续引用可仅用短号"
  各类编号汇总:
    战略主题: "语义ID: THM-{描述}；短号: THM{2位数字}"
    困境: "语义ID: DLM-{描述}；短号: DLM{3位数字}"
    业务域: "缩写2-3个字符（如CM/EX/SP）"
    端到端流程: "P-{域缩写}-{序号}"
    流程节点/业务环节: "BA-{域缩写}-{序号}"
    核心实体: "语义ID: EN-{域缩写}-{描述}；短号: EN{3位数字}"
    生命周期阶段: "语义ID: {实体ID}-LC-{描述}；短号: LC{3位数字}（全局递增）"
    事件: "语义ID: EVT-{域缩写}-{描述}；短号: EVT{3位数字}"
    利益相关方: "语义ID: SH-{描述}；短号: SH{2位数字}"
    用户角色: "语义ID: ROLE-{角色名}；短号: UR-01等（分类前缀）"
    工作场景: "语义ID: WS-{角色名}-{描述}；短号: WS{3位数字}"
    旅程触点: "语义ID: TP-{角色名}-{描述}；短号: TP{3位数字}"
    Epic: "语义ID: EPIC-{域缩写}-{功能模块}；短号: EPIC{3位数字}"
    业务验收场景: "语义ID: BAS-{Epic短号}-{描述}；短号: BAS{3位数字}"
    基础性需求: "语义ID: FR-{能力描述}；短号: FR{2位数字}"
    非功能需求: "语义ID: NFR-{类别}-{描述}；短号: NFR{3位数字}"
    Enabler_Epic: "语义ID: EEPIC-{能力域}-{功能描述}；短号: EEPIC{3位数字}"

# ── 裁剪规则 ──
tailoring:
  不可裁剪:
    - "追溯链完整性（目标→困境→活动→角色→Epic→版本）"
    - "第6章 Business Epic 定义与验证（核心产出）"
    - "第2章 背景与约束（前置背景+需求落位必保）"
  可简化（小型项目，Epic<5，角色<3）:
    第3章: "可合并生态系统和业务域，简化为单一业务环节表"
    第4章: "可仅列出关键实体和核心状态流转"
    第5章: "可省略关键旅程触点(5.2.4)和详细角色→业务环节映射(5.3)"
    第7章: "可按需裁减分类，仅列出实际涉及的基础性需求"
    第8章: "可仅定义性能、安全、可用性三项核心非功能需求"
    第9章: "可仅定义与核心Business Epic直接相关的Enabler Epic"
    第10章: "可省略WSJF，采用MoSCoW"
    第11章: "可仅保留全链路追溯矩阵(11.7)"
  可迭代补充:
    - "2.3需求落位：第6章完成后回填处置方式和Epic编号"
    - "5.2.4关键旅程触点：Epic推导后补充"
    - "8.2非功能需求量化约束：技术预研完成后补充"
    - "6.4 Epic完整性验证：追溯矩阵建立后补充"
    - "10.5 WSJF评估：成本估算完成后补充"

# ── 困境与痛点区分 ──
key_distinctions:
  困境vs痛点:
    困境: "业务层面系统性障碍，第2章定义，编号DLM-*"
    痛点: "角色层面具体问题，第5章角色分析定义，驱动Epic推导"
    关系: "困境导致痛点，一个困境→多个角色不同痛点；追溯链：目标→困境→痛点→Epic"
  基础性需求vs非功能需求:
    基础性需求: "需要建设什么通用能力（功能性横切，第7章）"
    非功能需求: "应达到什么质量水平（质量约束，第8章）"
  第6.4章vs第6.3章:
    "6.3": "即时逐条验证，边推导边检查，发现遗漏即时补充Epic"
    "6.4": "全量汇总验证，计算覆盖度百分比，给出通过/不通过结论"
  第6.4章vs第11章:
    "6.4": "侧重验证结论，是版本规划的前置条件"
    "第11章": "侧重审计追溯，是需求评审和回溯的工作基准"
  Business_Epic_vs_Enabler_Epic:
    Business_Epic: "直接交付用户价值的业务能力需求（第6章）"
    Enabler_Epic: "构建架构跑道以支撑业务交付的架构级需求（第9章）"
