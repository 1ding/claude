# 领域设计编写规范 Schema
# 来源规范：.claude/specs/domain/software/phase-specs/outputs/S03-领域设计编写规范_v0.22@202603051845.md
# 用途：AI 内容编写阶段加载此 schema（替代完整规范），提供领域设计文档（03-领域设计）的编写约束
# 完整规则（更多示例和详细说明）：见原规范文件

doc_id: S03
doc_name: 领域设计编写规范

# ── 文档整体结构 ──
document_structure:
  正文章节: [第1章总则, 第2章背景与约束, 第3章领域划分与子域分类, 第4章限界上下文识别与定义,
             第5章上下文映射, 第6章领域事件全景, 第7章核心领域模型概要, 第8章架构需求分析]
  附录:
    规范性: [附录A统一语言]
    资料性: [附录B方法论框架（可选）, 附录C术语表（可选）]
  章节顺序: 固定，不得调整
  裁剪规则: 必备章节不可裁剪；不适用时保留标题并注明"本项目不适用，原因：{具体原因}"
  追溯链完整性: Business Epic → 子域 → BC → Enabler Epic 的链路不得断裂

# ── 第1章 总则 ──
ch1_总则:
  必含字段: [文档编号, 文档名称, 目的, 范围, 管理要点, 文档密级]
  管理要点固定值: "正文8章结构、三层结构、四列章节结构表、表达规范"

# ── 第2章 背景与约束 ──
ch2_背景与约束:
  结构: 三段式（前置背景 → 业务知识获取 → 需求落位）
  sec2_1_前置背景:
    2.1.1_上游基线引用:
      required: true
      表格列: [引用文档, Business Epic数, Epic短号清单, 备注]
      内容: 引用02-宏观需求规格说明书版本和承接的Business Epic清单
    2.1.2_版本范围:
      required: true
      表格列: [版本, 时间范围, 分析详略]
      分析详略取值: [完整设计（当前实施版本）, 规划概述（未来版本）]
    2.1.3_约束条件与假设:
      required: true
      缺失输入处理: 记录假设编号（AS-{两位序号}），格式"来源：阶段N输出缺失"
  sec2_2_业务知识获取:
    2.2.1_知识来源与获取策略:
      required: true
      结构化输入清单列: [输入编号(SI-{序号}), 输入名称, 来源章节, 承接状态(已确认/待确认/缺失), 备注]
      非结构化获取计划列: [计划编号(KA-{序号}), 获取方式, 目标知识, 参与角色, 计划时间, 产出物]
    2.2.2_阶段2成果承接验收:
      required: true
      验收列: [验收项, 所属线, 完整性(完整/部分完整/缺失), 差异说明, 处理方式]
      处理方式取值: [直接使用, 补充后使用, 记录假设（AS-*）]
    2.2.3_知识获取方法:
      required: 宜（小型项目可简化）
      方法定义列: [方法名称, 适用场景, 产出定义, 裁剪标记(必须/推荐/可选)]
    2.2.4_问题空间全景:
      required: true
      结构: 业务全景概述段落（1~2段）+ 核心问题清单表
      核心问题清单列: [问题编号(BP-{序号}), 问题描述, 影响范围, 来源]
      粒度: 对应子域级别，可映射到第3章子域
  sec2_3_需求落位:
    required: true
    编写顺序: >
      2.1+2.2完成时预建框架（填入Business Epic清单，BC归属暂留空）
      → 第4章完成后回填BC归属
      → 第8章完成后补充Enabler Epic新增条目
    表格列: [Epic编号, Epic名称, 处置方式(承接/废弃/新增), BC归属, 说明]
    强制规则:
      - 02-宏观需求中所有Business Epic必须出现，不得静默缺失
      - 废弃时说明列必填废弃原因
      - 新增时说明列必填Enabler Epic名称和识别来源，Epic编号/名称填"-"
      - 承接时BC归属为负责实现的BC编号列表，第4章完成后回填

# ── 第3章 领域划分与子域分类 ──
ch3_领域划分与子域分类:
  章节结构: [3.1子域识别方法, 3.2子域分类标准, 3.3子域定义, 3.4子域与业务域映射, 3.5子域与Business Epic映射, 3.6子域全景图]
  子域定义规范:
    表格列: [子域编号, 子域名称, 分类(核心域/支撑域/通用域), 职责定义, 投资策略, 关键理由]
    职责格式: "管理/处理{业务对象}的{业务能力}"
    投资策略: 核心域→自建；通用域→采购/复用；支撑域→视情况决定
  子域分类决策维度: [竞争差异性, 业务复杂度, 可替代性, 变更频率]
  子域与业务域映射列: [子域编号, 子域名称, 业务域编号, 业务域名称, 映射关系(一对一/拆分/合并/新增/重划边界), 差异说明]
  子域与Epic覆盖关系列: [子域编号, 子域名称, 覆盖的Epic编号, 未覆盖Epic检查]
  子域全景图: 区分三类子域（双线框=核心域、单线框=支撑域、虚线框=通用域），标注依赖关系箭头
  数量约束: 核心域数量不超过子域总数的1/3；超过应检查是否将支撑域误判为核心域
  粒度规则:
    - 两个候选子域的核心业务规则高度耦合 → 合并
    - 一个候选子域内部包含两组独立变化的业务规则 → 拆分

# ── 第4章 限界上下文识别与定义 ──
ch4_限界上下文识别与定义:
  章节结构: [4.1 BC识别方法, 4.2 BC边界划定原则, 4.3 BC定义模板, 4.4 BC与子域关系, 4.5 BC与Business Epic映射, 4.6 BC内聚性验证]
  BC边界划定因素: [语言边界, 业务能力内聚, 团队边界, 数据所有权, 变更频率]
  BC边界划定原则列: [划定因素, 定义, 应用规则, 优先级]
  BC定义字段: [BC编号, BC名称, 英文名称(PascalCase), 所属子域, 职责定义, 边界描述, 核心聚合, 拥有的实体, 关键业务规则, 边界划定依据]
  职责格式: "负责{业务对象}的{业务能力}，对外提供{服务}"
  边界描述格式: "包含：{xxx}；不包含：{yyy}"
  BC与子域映射列: [子域编号, 子域名称, BC编号, BC名称, 映射关系(一对一/一对多/多对一), 说明]
  BC与Epic覆盖关系列: [BC编号, BC名称, 覆盖的Epic编号, 覆盖度检查(完全覆盖/部分覆盖/未覆盖)]
  BC内聚性验证规则列: [规则编号(CV-{序号}), 验证规则, 验证方法]
  BC内聚性验证结果列: [BC编号, 规则编号, 结果(通过/不通过/需关注), 说明]
  数量约束: BC数量宜为子域总数的1~2倍；超过3倍应检查是否过度拆分
  实体所有权唯一: 每个核心实体有且仅有一个BC作为所有者（拥有方 vs 引用方）
  拆分判断: 同一术语出现两种含义时应拆分BC

# ── 第5章 上下文映射 ──
ch5_上下文映射:
  章节结构: [5.1映射模式, 5.2上下文映射图, 5.3 BC间关系定义, 5.4跨BC数据流, 5.5集成策略汇总]
  映射模式定义列: [模式名称(中英文), 定义, 适用场景, 权力关系(上游主导/下游主导/对等/无直接关系)]
  常用DDD映射模式: [Partnership, Shared Kernel, Customer-Supplier, Conformist, ACL, OHS, Published Language, Separate Ways]
  上下文映射图规范:
    节点: BC编号+BC名称方框
    实线箭头: 同步调用（调用方→被调用方）
    虚线箭头: 异步事件（发布方→消费方）
    标注: 连线上方=映射模式缩写；连线下方=关键数据对象（可选）
    BC>8时: 按子域分区布局
  BC间关系定义列: [关系编号(CM-{序号}), 上游BC, 下游BC, 映射模式, 选择理由(1~2句), 集成方式(同步API/异步事件/共享数据/其他), 交互契约]
  跨BC数据流列: [数据流编号(DF-{序号}), 源BC, 目标BC, 数据对象, 流转方式(同步查询/异步事件/数据复制), 一致性策略(强一致/最终一致/无一致性要求), 一致性机制]
  集成策略汇总列: [集成模式, 适用关系编号, 选择依据, 技术约束]
  一致性参考: 资金→强一致；状态同步→最终一致；查询→无要求
  映射模式选择: 每对BC关系仅选一种；需多模式时分为多条记录；与团队组织结构一致

# ── 第6章 领域事件全景 ──
ch6_领域事件全景:
  章节结构: [6.1事件识别方法, 6.2事件分类, 6.3领域事件清单, 6.4事件流转全景图, 6.5事件驱动集成模式（宜）]
  事件命名规则:
    英文: PascalCase + 过去时态，格式"{Entity}{Action}ed"（如 OrderConfirmed）
    中文: "{实体}已{动作}"（如 订单已确认）
  事件分类:
    域内事件: BC内部消费
    跨域事件: 触发其他BC响应
  领域事件定义列: [事件编号, 事件名称, 中文名称, 归属BC(唯一发布者), 分类(域内事件/跨域事件), 触发条件, 核心载荷(字段名列表), 消费者BC]
  核心载荷: 仅列字段名，不含类型定义；域内事件消费者BC填"本BC"
  事件流转全景图: 以BC为节点，跨域事件为虚线箭头（仅展示跨域事件）
  事件驱动集成模式评估列: [模式名称, 适用场景, 适用事件, 评估结论(推荐采用/待评估/不适用), 备注]
  事件语义约束:
    - 事件表示已发生的事实，不含"请求""命令"语义
    - 每个事件对应一次状态变迁（含两个独立业务含义时应拆分）
    - 跨域事件应与第5章数据流表交叉验证

# ── 第7章 核心领域模型概要 ──
ch7_核心领域模型概要:
  章节结构: [7.1建模范围与深度, 7.2聚合识别方法, 7.3各BC聚合清单, 7.4阶段2实体映射, 7.5聚合间引用关系（宜）]
  建模深度选择:
    核心域BC: 完整建模（必须出现在7.3节）
    支撑域BC: 概要建模
    通用域BC: 本章不建模
  建模范围说明列: [BC编号, BC名称, 所属子域分类, 建模深度(完整建模/概要建模/本章不建模), 说明]
  聚合清单规范:
    按BC分设子节: "7.3.N BC-XX {BC名称}聚合清单"
    表格列: [聚合编号, 聚合名称, 英文名称(PascalCase), 聚合根, 核心实体, 关键值对象, 不变量(1~2条), 边界依据]
    单个聚合宜: 1个聚合根 + 不超过5个内部实体/值对象
    聚合边界: 以事务一致性边界划定；每个聚合完整归属一个BC，不得跨BC
  概念区分:
    聚合根: 唯一外部访问入口
    实体: 有唯一标识，有独立生命周期
    值对象: 无标识，通过属性值定义相等性，不可变
  阶段2实体映射列: [阶段2实体名称, 归属BC, 映射为(聚合根/实体/值对象/拆分), 所属聚合, 映射说明]
  聚合间引用关系列: [引用方聚合, 被引用聚合, 引用方式(ID引用/值对象快照), 跨BC标记(BC内/跨BC), 说明]
  引用约束: 仅通过聚合根ID引用，禁止直接对象引用；跨BC禁用值对象快照

# ── 第8章 架构需求分析（Enabler Epic）──
ch8_架构需求分析:
  章节结构: [8.1识别来源, 8.2 Enabler Epic定义模板, 8.3 Enabler Epic清单, 8.4追溯关系, 8.5 ADR, 8.6架构约束传递]
  识别来源维度: [上下文映射集成需求（第5章）, 跨域事件基础设施（第6章）, BC共性需求（第4章）]
  识别来源维度列: [来源维度, 对应章节, 识别方法, 典型产出]
  Enabler_Epic定义字段: [Epic编号(EE-{序号}), Epic名称, 架构能力描述, 业务价值, 识别来源, 关联Business Epic(至少一个), 涉及BC, 优先级(高/中/低), 优先级依据]
  优先级判断:
    高: 阻塞核心域BC
    中: 影响集成效率
    低: 优化性
  Enabler_Epic清单列: [Epic编号, Epic名称, 架构能力描述, 优先级, 关联Business Epic, 涉及BC]
  追溯关系列: [Business Epic编号, Business Epic名称, Enabler Epic编号, 追溯说明]
  ADR字段: [ADR编号(ADR-{三位序号}), 标题, 状态(已决定/待决定/已废弃), 背景(2~3句), 决策, 备选方案, 结果, 关联Epic]
  ADR覆盖: 第3~6章的重大决策
  架构约束传递清单列: [约束编号(AC-{序号}), 约束类别(BC部署约束/集成约束/数据隔离约束/其他), 约束描述, 来源, 影响范围]
  约束质量: 每种集成模式至少一条约束；每条可被阶段4直接采纳，避免笼统表述

# ── 附录A 统一语言（规范性）──
appendix_A_统一语言:
  必备: true
  章节结构: [A.1统一语言原则, A.2领域术语表, A.3术语治理规则, A.4与上游术语的衔接]
  领域术语列: [术语, 英文(PascalCase), 定义(满足"可判断"标准), 所属子域, 所属BC, 阶段2术语映射, 别名, 状态(生效/废弃/待确认)]
  定义"可判断"标准: 定义应使读者能判断某一业务对象是否属于该术语
  收录范围:
    收录: DDD战略设计术语 + 项目业务领域术语（被两处及以上引用，或含义偏离常见用法）
    不收录: 通用技术术语（引用《软件开发术语规范》）
  统一语言原则: 同一术语全文唯一名称；别名仅在术语表记录
  术语映射列: [阶段2术语, 领域术语, 映射关系(等同/包含/被包含/重命名/拆分/合并), 差异说明]
  治理规则覆盖: 新增/变更/废弃流程、冲突解决、跨BC术语一致性检查

# ── 裁剪建议 ──
tailoring:
  标准项目参考: "BC >= 5，跨域交互 >= 3 → 完整执行全部章节"
  小型项目参考: "BC < 3，跨域交互 <= 1"
  小型项目可裁剪:
    - 2.2.3知识获取方法可简化（省略EventStorming等重方法）
    - 第6章可合并入第5章
    - 第7章可省略（留至阶段6 BC总体设计）
  不可裁剪: [2.1前置背景, 2.3需求落位, 第3章, 第4章, 第5章, 附录A]
