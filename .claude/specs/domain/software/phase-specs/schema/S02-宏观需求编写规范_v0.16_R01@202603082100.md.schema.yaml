# 宏观需求编写规范 Schema
# 来源规范：.claude/specs/domain/software/phase-specs/drafts/S02-宏观需求编写规范_v0.16@202603071324.md
# 用途：AI 编写"02-宏观需求规格说明书"阶段加载此 schema（替代完整规范），提供内容约束
# 完整规则（更多示例和详细说明）：见原规范文件
# 修订日期：2026-03-08
# 修订说明：基于02-宏观需求_v0.16反向修订，使schema准确反映实际编写实践

doc_id: S02
doc_name: 宏观需求编写规范

# ── 核心方法论 ──
methodology:
  名称: 三线演绎，角色驱动，两维验证
  三线:
    活动线: "PL0(价值链/职能域) → PL1(端到端流程) → PL2(流程节点) = 业务环节"
    角色线: "RL0(所有利益相关方) → RL1(特定利益相关方) → RL2(用户角色)"
    实体线: "EL0(ER全景图) → EL1(具体实体) → EL2(生命周期)"
  推导主线: "角色(RL2)的痛点/期望 → 候选Epic → 抽象过滤 → Epic"
  两维验证: "业务环节(PL2节点)覆盖度 + 实体生命周期(EL2)覆盖度"
  追溯链: "业务目标 → 困境 → 业务环节 → 角色 → Epic → 版本"
  层级标记:
    PL: "流程层级，活动线专用（PL0价值链/PL1端到端流程/PL2流程节点=业务环节）"
    RL: "角色层级，角色线专用（RL0所有利益相关方/RL1特定利益相关方/RL2用户角色）"
    EL: "实体层级，实体线专用（EL0 ER全景/EL1具体实体/EL2生命周期）"

# ── 章节结构（10章+附录，顺序固定不可调整）──
chapter_structure:
  mandatory_chapters:
    - "第1章 总则（强制元数据）"
    - "第2章 背景与约束（三段式：前置背景+业务背景与目标+需求落位）"
    - "第3章 基于业务环节的宏观需求分析（活动线演绎，以业务域为骨架逐域展开）"
    - "第4章 基于关键实体生命周期的宏观需求分析（实体线演绎）"
    - "第5章 基于角色的宏观需求分析（角色线演绎）"
    - "第6章 Business Epic 定义与验证（推导+定义+映射验证+完整性验证）"
    - "第7章 基础性宏观需求分析（横切功能需求）"
    - "第8章 非功能宏观需求分析（质量约束）"
    - "第9章 Enabler Epic 定义（基于第7/8章输入，定义跨BC架构级Epic）"
    - "第10章 版本规划与追溯验证（Epic→版本映射+全链路追溯矩阵+覆盖度验证）"
    - "附录A 术语表（三层：业界通用+天帷通用+文档专有）"
    - "附录B 文档说明（可选）"
    - "修订记录"

# ── 第1章 总则 ──
ch1_general:
  规则: "仅含强制元数据，无实质规范内容，篇幅≤0.5页"
  强制元数据:
    顺序固定: "文档编号 → 文档名称 → 目的 → 范围 → 管理要点 → 文档密级"
    格式: "+   {元数据项}:{内容}"
  示例:
    文档编号: "S02（格式：{前缀}-{序号}，前缀S/C/P）"
    文档密级: "【商密二级】 -- 外发必追责"

# ── 第2章 背景与约束 ──
ch2_background:
  结构: "三段式：2.1前置背景 + 2.2业务背景与目标 + 2.3需求落位"
  编写顺序: "2.1+2.2完成时预建2.3表格框架填入THM清单，第6章完成后回填处置方式和Epic编号"
  ch2_1_前置背景:
    战略基线引用表列: "[THM短号, THM语义ID, THM名称, 战略意图, 关联业务域]"
    版本范围表列: "[版本, 时间范围, 核心目标, 分析详略]"
    约束条件表列: "[约束类型, 约束项, 约束描述, 影响范围]"
    假设与依赖表列: "[类型, 编号(AS-n/DP-n), 描述, 影响范围, 失效后果]"
    规则: "阶段1输出不完整时记录为假设AS-*，标注'来源：阶段1输出缺失'"
  ch2_2_业务背景:
    阶段1输入验收检查表列: "[检查项, 合格标准, 不满足时的处理方式]"
    战略目标引用表列: "[目标维度, 战略目标, 量化指标]"
    核心价值主张: "说明产品核心价值主张，以图表展示价值实现架构（如8库6图1包）"
    阶段目标引用表列: "[版本, 时间范围, 核心目标, 关键成果, 财务目标]"
    目标客户分层: "说明目标客户分类及各自痛点侧重"
    困境描述规范:
      列: "[困境短号, 困境语义ID, 困境名称, 严重程度, 关联目标]"
      编号格式: "语义ID: DLM-{困境描述}；短号: DLM{3位数字}"
      关联目标: "应引用具体目标维度或目标编号（如OBJ-01），避免笼统描述"
      继承规则: "以S01第2.1节困境分析为基线，可按业务目标维度补充或细化；新增困境须标注来源"
      详细描述: "每个困境含：困境描述、典型场景（text代码块）、困境表现表列、根本原因"
      困境共同根源: "总结所有困境的共同根源（含graph图示）"
    成功标准定义:
      维度: "客户价值、商业价值、产品能力（分节描述）"
      客户价值表列: "[标准维度, 成功标准, 验证方式]"
      商业价值表列: "[标准维度, 成功标准, 目标时间]"
      产品能力表列: "[标准维度, 成功标准, 目标时间]"
  ch2_3_需求落位:
    规则:
      - "01-战略规划第6章中所有THM必须出现，不得静默缺失"
      - "废弃时说明列必填废弃原因"
      - "新增时说明列必填来源，THM列填'-'"
      - "第6章完成后回填处置方式和Epic编号；编写时先预建表格框架"
    需求落位表列: "[THM短号, THM名称, 处置方式, 对应Epic, 说明]"
    处置方式取值: "承接 / 废弃 / 新增"

# ── 第3章 基于业务环节的宏观需求分析（活动线）──
ch3_business_process:
  方法: "以业务域(DOM)为骨架，逐域识别业务场景(BS) → 分析域内流程 → 识别系统化需求 → 归纳候选Epic"
  S01继承: "S01第4.2节业务价值生态 + 第6.2节业务域划分(DOM)直接继承，不重新定义"
  领域分组:
    概念: "领域组(Domain Group, DG)，按业务生态位置将业务域分组"
    表列: "[领域组编号, 领域组名称, 包含业务域, 生态位置]"
    示例: "DG-50 合规知识生产领域(供给侧)、DG-30 企业合规治理领域(消费侧A)、DG-20 知识消费领域(消费侧B)、DG-10 平台基础领域(通用基础)"
  业务域展开对应表列: "[展开章节, 业务域, 关联THM, 场景数量, 战略意图]"
  业务生态系统图:
    要求: "以graph图展示业务生态全景（供给侧+共用数据层+消费侧），标注活动流和数据流"
    定位: "此图是文档的核心源点，后续场景、角色、能力都从此图严格推导"
  图到场景对应: "建立业务生态系统图中各活动到BS场景的严格对应关系"
  逐域展开:
    组织方式: "按领域组分节（如3.2供给侧、3.3消费侧A、3.4消费侧B），每节内按业务域逐个展开"
    每域展开内容: "域内业务场景(BS)清单表 + 各场景的系统需求(REQ-{域缩写}-{序号})"
    场景定义表列: "[场景编号, 场景名称, 业务描述, 参与角色, 系统需求(REQ-*), 候选Epic]"
  端到端流程与跨域需求:
    端到端流程表列: "[流程编号, 流程名称, 贯穿业务域, 触发点, 终点, 关联困境]"
    跨域需求表列: "[需求编号(REQ-X-*), 需求名称, 涉及业务域, 需求描述, 候选Epic]"
  需求归纳与候选Epic:
    定位: "汇总全部域内REQ和跨域REQ，按能力域归纳为候选Epic(cEPIC-*)"
    候选Epic编号: "cEPIC-{域缩写}-{功能描述}（候选前缀c，正式定义后去掉前缀）"
    候选Epic汇总表列: "[候选Epic编号, 候选Epic名称, 来源REQ, 所属业务域]"
  编号格式:
    业务场景: "BS-{域缩写}-{序号}（BS=Business Segment，域缩写2-3字符大写）"
    域内需求: "REQ-{域缩写}-{序号}（域缩写与BS一致）"
    跨域需求: "REQ-X-{序号}（X=跨域）"
    端到端流程: "P-{域缩写}-{序号}"

# ── 第4章 基于关键实体生命周期的宏观需求分析（实体线）──
ch4_entities:
  演绎逻辑: "实体识别 → 实体关系 → 生命周期与需求识别 → 跨实体需求 → 候选Epic补充"
  与第3章关系: "第3章从业务域/场景视角识别需求，本章从实体状态流转视角验证和补充"
  核心实体识别:
    分类方式: "根据产品实际业务模式确定（如内容实体/主体实体/业务实体）"
    分类表列: "[分类, 实体, 归属域, 实体数, 生命周期阶段数]"
  实体编号格式: "语义ID: EN-{域缩写}-{实体描述}；短号: EN{3位数字}"
  实体关系表列: "[实体A, 关系类型(1:1/1:N/M:N/包含/引用/派生), 实体B, 关系说明]"
  生命周期与需求识别:
    合并呈现: "每类实体一张综合表，将生命周期定义与需求识别合并"
    综合表列: "[实体, 关键状态转换, 阶段数, 系统化程度, 需求编号(REQ-EL-*), 系统需求, 覆盖的第3章REQ]"
    需求编号: "REQ-EL-{序号}（EL=Entity Lifecycle，与第3章REQ-{域}-{序号}区分）"
  跨实体需求:
    表列: "[需求编号(REQ-EL-*), 跨实体需求名称, 涉及实体, 需求描述]"
  候选Epic补充:
    定位: "将本章全部实体需求(REQ-EL-*)与第3章候选Epic交叉验证"
    补充表列: "[需求编号, 需求名称, 第3章覆盖情况, 补充方向(补充到已有cEPIC或新增)]"
    结论: "说明是否有新增候选Epic或全部合并到已有候选Epic"

# ── 第5章 基于角色的宏观需求分析（角色线）──
ch5_roles:
  演绎顺序: "RL0(利益相关方分类) → RL1(特定利益相关方) → RL2(用户角色) → 角色→业务活动映射 → 用户概念体系 → 候选Epic推导"
  S01继承: "S01第4.2节生态参与方为利益相关方基线；S01第3.2节客户画像转化为用户角色"
  筛选规则: "仅'直接用户'类的具体岗位进入RL2角色定义"
  利益相关方分类:
    RL0分类表列: "[分类, 数量, 说明, 进入RL2]"
    外部利益相关方表列: "[编号(EX-{序号}), 名称, 与产品关系, 影响方式]"
    外部利益相关方编号: "EX-{序号}（如EX-01），不进入RL2"
  角色定义与需求识别:
    合并呈现: "每类角色一张综合表，将角色定义与需求识别合并"
    角色编号格式: "按用户群分类前缀：UP{2位}(供给侧) / UR{2位}(消费侧A) / UC{2位}(消费侧B)"
    需求编号: "REQ-RL-{序号}（RL=Role Line，与第3/4章REQ区分）"
    推导逻辑: "角色痛点/期望 → REQ-RL需求 → 映射到候选Epic"
    综合表列: "[角色编号, 角色名称, 参与场景(BS-*), 核心痛点, 核心期望, 需求编号(REQ-RL-*), 角色驱动的系统需求, 覆盖的ch3 REQ, 关联困境(DLM-*)]"
    分节组织: "按用户群分节（供给侧角色/消费侧A角色/消费侧B角色）"
  角色→业务活动映射:
    表列: "[角色分类, 角色数, 覆盖的BS场景, 覆盖场景数]"
    覆盖度验证: "所有BS场景须被至少一个角色覆盖"
  用户概念体系:
    定位: "从全部角色归纳出用户概念体系，为后续系统设计提供用户模型基础"
    三层体系表列: "[层次(用户群/用户类型/角色), 概念, 说明, 实例]"
    用户群与基础性需求关系表列: "[用户群, 对应基础性需求(FR-*), 关系说明]"
  候选Epic推导:
    定位: "将全部角色需求(REQ-RL-*)与第3章候选Epic交叉验证"
    角色需求映射表列: "[需求编号, 角色, 映射的候选Epic, 映射完整性]"
    补充需求表列: "[需求编号, 角色, 补充需求描述, 补充到候选Epic]"
    结论: "说明角色维度验证结果和补充需求数量"

# ── 第6章 Business Epic 定义与验证 ──
ch6_epics:
  S01继承: "能力域与S01第6.2节业务域(DOM)对齐"
  输入: "第3章候选Epic(cEPIC-*) + 第4章实体维度补充 + 第5章角色维度补充"
  过程: "候选Epic → 抽象过滤 → 正式Epic定义 → 三维映射验证 → 完整性验证"
  抽象过滤:
    过滤标准:
      能力独立性: "是独立业务能力域，非某Epic下的具体功能点"
      多活动覆盖: "覆盖多个PL2流程节点或解决多个角色痛点"
      可拆分性: "可预见地拆分为多个Feature"
      目标对齐: "可直接追溯到业务目标或困境"
    不通过处理: "降级为Feature候选项，记录来源，留待阶段5"
    合并处理: "功能重叠的候选Epic可合并，记录合并理由"
    过滤结果表列: "[候选Epic, 名称, 过滤结论(通过/合并/降级), 理由]"
  Epic编号格式:
    语义ID: "EPIC-{业务域}-{功能模块小写英文连字符}"
    短号: "EPIC{3位数字}，全局唯一，短号不回收"
  双轨标识对照表:
    定位: "正式Epic定义前，先列出全部Epic的双轨标识对照"
    表列: "[短号, 语义ID, 名称, 业务域]"
  Epic定义:
    组织方式: "按业务域组/领域组分节（如供给侧Epic、消费侧A Epic、消费侧B Epic）"
    定义表列: "[Epic编号(短号), Epic名称, 所属域, 能力定义, 核心要素, 来源REQ, 来源角色, 关联困境(DLM-*), 业务边界]"
    业务边界: "明确Out of Scope，能力级别不细化到功能点"
  映射验证（6.3，汇总验证）:
    业务环节覆盖: "按业务域汇总BS场景→Epic覆盖度，表列: [业务域, BS场景数, 覆盖Epic数, 未覆盖, 覆盖度]"
    实体生命周期覆盖: "按实体分类汇总，表列: [实体分类, 实体数, 阶段总数, 已覆盖, 覆盖度]"
    角色覆盖: "按角色分类汇总，表列: [角色分类, 角色数, 有Epic支撑, 未覆盖, 覆盖度]"
  完整性验证（6.4，三维度汇总）:
    定位: "汇总6.3映射结果，应在版本规划（第10章）之前完成"
    汇总表列: "[验证维度, 总数, 已覆盖, 覆盖度, 结论(通过/不通过)]"
    通过标准: "三个维度无未覆盖项，或未覆盖项有合理说明"
  冲突调和: "角色线与实体线/活动线冲突时，以业务目标对齐度为最终裁决标准"

# ── 第7章 基础性宏观需求分析 ──
ch7_foundation:
  定义: "跨BC的功能性横切关注点（功能性），区别于非功能需求（质量约束）"
  与第9章关系: "本章定义'需要什么基础能力'，第9章将这些需求归组为Enabler Epic"
  典型分类: "[安全基础, 协作基础, 数据基础, 运维基础, 扩展基础]"
  需求编号: "语义ID: FR-{能力描述}；短号: FR{2位数字}"
  定义表列: "[需求编号, 需求名称, 需求分类, 能力描述, 能力要点, 目标版本, 关联Epic]"
  基础性需求与Epic关联:
    定位: "汇总基础性需求对Business Epic的支撑关系"
    关联汇总表列: "[需求分类, FR数量, 支撑的Epic范围, P1版本必需]"

# ── 第8章 非功能宏观需求分析 ──
ch8_nfr:
  定义: "质量约束（质量水平），区别于基础性需求（功能性横切）"
  与第9章关系: "本章定义'应达到什么质量水平'，第9章将关键质量约束归入Enabler Epic"
  典型分类: "[性能需求, 安全需求, 可用性需求, 可扩展性, 兼容性需求, 可维护性, 可移植性]"
  需求编号: "语义ID: NFR-{类别}-{约束描述}；短号: NFR{2位数字}"
  定义表列: "[需求编号, 需求分类, 需求项, 框架要求, 典型场景, 量化约束(量级), 目标版本]"
  量化约束原则: "量级优先（如'百毫秒级''千级并发'），仅有充分依据时填精确数值"
  集成接口需求表列: "[集成方向(入站/出站/双向), 外部系统, 集成目的, 数据类型, 集成方式, 目标版本]"
  非功能需求与部署模式:
    定位: "说明不同部署模式下非功能需求的差异"
    差异表列: "[需求维度, SaaS部署, 私有化部署]"

# ── 第9章 Enabler Epic 定义 ──
ch9_enabler_epic:
  定位: "基于第7/8章输入，将跨BC架构级需求定义为 Enabler Epic"
  与Business_Epic关系: "Business Epic 交付用户价值；Enabler Epic 构建架构跑道以支撑业务交付"
  识别逻辑: "遍历第7章FR-*和第8章NFR-*，按架构能力域归组为 Enabler Epic"
  Enabler_Epic编号:
    语义ID: "EPIC-{能力域}-{功能描述}"
    短号: "EPIC{3位数字}（与Business Epic共享EPIC编号命名空间，全局递增）"
    说明: "Enabler Epic短号紧接Business Epic短号之后分配（如Business Epic EPIC001~036，Enabler Epic EPIC037~044）"
  定义表列: "[语义ID, Epic短号, Epic名称, 能力域, 包含的FR(FR-*), 包含的NFR(NFR-*), 支撑的Business Epic, 目标版本]"
  Enabler_Business映射表列: "[Business Epic 短号, Business Epic 名称, 依赖的 Enabler Epic, 依赖说明]"

# ── 第10章 版本规划与追溯验证 ──
ch10_versioning_and_traceability:
  定位: "将全部Epic分配到版本 + 建立全链路追溯矩阵 + 覆盖度验证"
  S01继承: "版本框架继承S01第7.1节版本路线图，版本编号和定位与S01保持一致"
  版本号体系: "X.Y.Z（主版本.规划版本.修订版本）；偶数Y=规划内(P1-P6)，奇数Y=规划外补充版本"
  规划版本映射:
    P1: "v1.0 MVP版本（最高优先级）"
    P2: "v1.2 增强版本"
    P3: "v1.4 完善版本"
    P4: "v1.6 扩展版本"
    P5: "v1.8 高级版本"
    P6: "v2.0 理想版本（最低优先级）"
  优先级说明: "规划版本即优先级，P1最高，P6最低"
  版本规划:
    版本定义表列: "[规划版本, 版本号, 时间范围, 版本定位, Epic数量(Business+Enabler), 关键里程碑]"
  版本分配方法: "WSJF（推荐）或 MoSCoW（简化替代）"
  WSJF评估:
    表列: "[Epic编号, Epic名称, 所属域, 业务价值, 时间紧迫性, 风险降低, 实现规模, WSJF得分, 目标版本, 依赖Epic]"
    计算: "(业务价值 + 时间紧迫性 + 风险降低) / 实现规模；得分越高优先级越高"
    评分尺度: "修正Fibonacci序列(1,2,3,5,8,13,20)，相对估算"
    分表呈现: "Business Epic 和 Enabler Epic 分别列表"
  Enabler版本分配表列: "[Epic编号, Epic名称, 目标版本, 支撑的Business Epic]"
  全链路追溯矩阵:
    定位: "以DOM为骨架，展示完整双向追溯链"
    追溯链: "DOM → THM → Epic ← REQ ← 角色 ← BS ← DLM"
    Business追溯表列: "[DOM, THM, Epic短号, Epic名称, 来源REQ, 来源角色, 来源BS, 关联困境(DLM-*), 版本]"
    Enabler追溯表列: "[来源FR/NFR, Enabler EPIC短号, Enabler名称, 支撑的Business Epic, 版本]"
  覆盖度验证:
    汇总表列: "[追溯维度, 总数, 已覆盖, 覆盖度]"
    必检维度:
      - "THM→Epic：所有战略主题有Epic承接"
      - "DLM→BA→Epic：所有困境有业务环节和Epic支撑"
      - "DOM→Epic：所有业务域有Epic覆盖"
      - "BA→Epic：所有业务环节(BS-*)有Epic覆盖"
      - "角色→Epic：所有角色需求有Epic支撑"
      - "实体生命周期→Epic：所有实体状态流转有Epic覆盖"
      - "Epic→版本：所有Epic(Business+Enabler)有版本安排"
      - "FR→Enabler：所有FR-*已归入Enabler Epic"
  补充版本触发决策: "按紧迫性/业务影响/依赖关系/工作量四维度判断创建补充版本还是合并到下一规划版本"

# ── 双轨制编号体系（全局规则）──
numbering:
  原则: "每个条目由语义ID（业务含义，不变）和短号（简洁易记，递增分配）共同标识"
  引用规则: "首次引用同时标注语义ID和短号；后续引用可仅用短号"
  各类编号汇总:
    战略主题: "语义ID: THM-{描述}；短号: THM{3位数字}"
    困境: "语义ID: DLM-{描述}；短号: DLM{3位数字}"
    业务域: "缩写2-3个字符大写（如CM/EX/SP），短号DOM{2-3位}"
    领域组: "DG-{编号}（如DG-50, DG-30, DG-20, DG-10）"
    业务场景: "BS-{域缩写}-{序号}（BS=Business Segment）"
    端到端流程: "P-{域缩写}-{序号}"
    域内需求: "REQ-{域缩写}-{序号}"
    跨域需求: "REQ-X-{序号}"
    实体需求: "REQ-EL-{序号}（EL=Entity Lifecycle）"
    角色需求: "REQ-RL-{序号}（RL=Role Line）"
    候选Epic: "cEPIC-{域缩写}-{功能描述}（候选前缀c）"
    核心实体: "语义ID: EN-{域缩写}-{描述}；短号: EN{3位数字}"
    生命周期阶段: "语义ID: {实体ID}-LC-{描述}；短号: LC{3位数字}（全局递增）"
    事件: "语义ID: EVT-{域缩写}-{描述}；短号: EVT{3位数字}"
    外部利益相关方: "EX-{序号}（不进入RL2）"
    用户角色: "按用户群分类前缀：UP{2位}(供给侧) / UR{2位}(消费侧A) / UC{2位}(消费侧B)"
    Business_Epic: "语义ID: EPIC-{域缩写}-{功能模块}；短号: EPIC{3位数字}"
    Enabler_Epic: "语义ID: EPIC-{能力域}-{功能描述}；短号: EPIC{3位数字}（与Business Epic共享命名空间）"
    基础性需求: "语义ID: FR-{能力描述}；短号: FR{2位数字}"
    非功能需求: "语义ID: NFR-{类别}-{约束描述}；短号: NFR{2位数字}"

# ── 裁剪规则 ──
tailoring:
  不可裁剪:
    - "追溯链完整性（目标→困境→活动→角色→Epic→版本）"
    - "第6章 Business Epic 定义与验证（核心产出）"
    - "第2章 背景与约束（前置背景+需求落位必保）"
  可简化（小型项目，Epic<5，角色<3）:
    第3章: "可合并生态系统和业务域，简化为单一业务环节表"
    第4章: "可仅列出关键实体和核心状态流转"
    第5章: "可省略用户概念体系(5.4)和详细角色→业务活动映射(5.3)"
    第7章: "可按需裁减分类，仅列出实际涉及的基础性需求"
    第8章: "可仅定义性能、安全、可用性三项核心非功能需求"
    第9章: "可仅定义与核心Business Epic直接相关的Enabler Epic"
    第10章: "可省略WSJF，采用MoSCoW；可简化追溯矩阵为Epic→版本表"
  可迭代补充:
    - "2.3需求落位：第6章完成后回填处置方式和Epic编号"
    - "5.4用户概念体系：角色定义完成后归纳"
    - "8.1非功能需求量化约束：技术预研完成后补充"
    - "6.4 Epic完整性验证：追溯矩阵建立后补充"
    - "10.2 WSJF评估：成本估算完成后补充"

# ── 困境与痛点区分 ──
key_distinctions:
  困境vs痛点:
    困境: "业务层面系统性障碍，第2章定义，编号DLM-*"
    痛点: "角色层面具体问题，第5章角色分析定义，驱动Epic推导"
    关系: "困境导致痛点，一个困境→多个角色不同痛点；追溯链：目标→困境→痛点→Epic"
  基础性需求vs非功能需求:
    基础性需求: "需要建设什么通用能力（功能性横切，第7章）"
    非功能需求: "应达到什么质量水平（质量约束，第8章）"
  第6.4章vs第6.3章:
    "6.3": "汇总验证，按维度（业务环节/实体/角色）分别统计覆盖度"
    "6.4": "三维度汇总验证，计算覆盖度，给出通过/不通过结论"
  Business_Epic_vs_Enabler_Epic:
    Business_Epic: "直接交付用户价值的业务能力需求（第6章），短号EPIC001起"
    Enabler_Epic: "构建架构跑道以支撑业务交付的架构级需求（第9章），短号紧接Business Epic"
  候选Epic_vs_正式Epic:
    候选Epic: "第3/4/5章推导过程中的初步归纳，编号cEPIC-*（带c前缀）"
    正式Epic: "第6章经抽象过滤后确认的Epic，编号EPIC{3位}（去掉c前缀）"
