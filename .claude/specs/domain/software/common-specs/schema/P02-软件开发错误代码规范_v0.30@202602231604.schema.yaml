# P02-软件开发错误代码规范 Schema
# 来源规范：/home/1ding/claude/projects/specs/software/common-specs/outputs/P02-软件开发错误代码规范_v0.30@202602231604.md
# 用途：AI 内容编写阶段加载此 schema（替代完整规范），提供错误代码约束
# 完整规则（更多示例和详细说明）：见原规范文件
# 生成日期：2026-03-01
# 修订日期：2026-03-04（补充 bc_allocation 分配规则；修正 data 字段定义）

doc_id: P02
doc_name: 软件开发错误代码规范

# ── 设计原则 ──
design_principles:
  唯一性: "每个错误码全局唯一，不同 BC 不得复用同一编号"
  自解释性: "错误信息面向终端用户，以自然语言描述，不暴露技术实现细节"
  可追溯性: "错误码能关联到具体业务规则或校验逻辑，便于从报错快速定位根因"
  可国际化: "错误码作为 i18n 资源文件的消息 Key，运行时按客户端语言动态加载"
  安全性: "错误响应不得暴露 SQL 语句、堆栈跟踪、内部文件路径、数据库结构"
  稳定性: "已发布错误码不得变更含义或删除，只可废弃并标注替代方案"
  最小化: "仅在前端需差异化处理或业务确需细分时新增，避免过度拆分"

# ── 错误码编码格式 ──
error_code_format:
  格式: "E-XXXBBSS"
  结构:
    前缀: "E-（固定）"
    XXX: "HTTP 状态码（400/401/403/404/409/422/429/500/503）"
    BB: "BC 编码（00=通用，01-99=各 BC）"
    SS: "错误序号（01-99），BC 内自增"
  示例:
    - "E-4000001：400 类 / 通用（BB=00）/ 第 01 号 → 参数校验失败"
    - "E-4010002：401 类 / 通用（BB=00）/ 第 02 号 → Token 过期"
    - "E-4000301：400 类 / BC03 / 第 01 号 → BC03 的首个 400 错误"

# ── HTTP 状态码映射 ──
http_status_mapping:
  400: "请求格式错误、参数缺失、类型不匹配、格式校验失败"
  401: "未认证、Token 无效或过期、账户被禁用"
  403: "已认证但无操作权限、跨租户访问被拒绝"
  404: "请求的资源不存在或已被删除"
  409: "数据冲突、乐观锁冲突、唯一约束冲突、重复提交"
  422: "请求格式合法但业务逻辑不允许执行"
  429: "请求频率超过限流阈值"
  500: "未预期的系统异常、未分类的运行时错误"
  503: "服务暂时不可用、依赖服务不可达、维护模式"
  区分标准_400vs422: "400 用于请求本身格式或参数不合法；422 用于请求合法但因业务规则限制无法处理"

# ── 枚举命名规则 ──
enum_naming:
  大写: "全大写，单词间下划线分隔"
  语义: "名称准确反映错误原因，具备自解释性"
  前缀: "不添加冗余前缀（错误码本身已含类型信息）"
  长度: "宜不超过 40 个字符"
  正确示例: ["TOKEN_EXPIRED", "FILE_SIZE_EXCEEDED", "OPTIMISTIC_LOCK_CONFLICT"]
  错误示例: ["tokenExpired", "ERROR_01", "ERR_PARAM_INVALID"]

# ── BC 编码分配 ──
bc_allocation:
  规则: "BB 段直接等于《P01-软件开发编号规范》中该 BC 短号的数字部分（如 BC01- 的 BB 值为 01）"
  通用错误码: "BB=00 为通用错误码，由平台统一定义，所有 BC 直接复用，不得重复定义"
  BC专属错误码: "BB=01~99 为各 BC 专属错误码，由各 BC 在本编码段内自行管理"
  容量: "每个 BC 在每个 HTTP 状态码下可定义 01-99 共 99 个错误码"
  集中管理: "BC 编码由架构师或 Tech Lead 统一分配，禁止 BC 自行占用"
  唯一性: "每个 BC 编码全局唯一且不可变更，BC 废弃后编码不得复用"
  扩展: "若项目 BC 数量超过 99 个，BB 段可扩展为双字母编码（如 aa、ab），与《P01》保持一致"

# ── 自定义错误码扩展判断 ──
custom_error_extension:
  现有错误码完全匹配: "直接复用现有错误码"
  错误提示信息需要调整: "通过参数化消息模板定制"
  新业务规则的校验失败: "在 BC 编码段内新增错误码"
  前端需区分处理的细分场景: "同类错误需不同 UI 处理时新增"
  相似场景但不同错误原因: "优先使用 details 字段区分"

# ── 通用错误码定义（BB=00）──
common_error_codes:
  参数校验类_400:
    E-4000001: {枚举: "PARAM_INVALID", 描述: "参数校验失败"}
    E-4000002: {枚举: "REQUEST_BODY_EMPTY", 描述: "请求体不能为空"}
    E-4000003: {枚举: "PARAM_TYPE_MISMATCH", 描述: "参数类型错误"}
    E-4000004: {枚举: "PARAM_OUT_OF_RANGE", 描述: "参数值超出允许范围"}
    E-4000005: {枚举: "PARAM_LENGTH_EXCEEDED", 描述: "参数长度超限"}
    E-4000006: {枚举: "DATE_FORMAT_INVALID", 描述: "日期格式错误"}
    E-4000007: {枚举: "ENUM_VALUE_INVALID", 描述: "枚举值无效"}
    E-4000008: {枚举: "JSON_FORMAT_INVALID", 描述: "JSON 格式错误"}
    E-4000009: {枚举: "PARAM_REQUIRED", 描述: "缺少必填参数"}
    E-4000010: {枚举: "FILE_TYPE_INVALID", 描述: "文件类型不支持"}
    E-4000011: {枚举: "FILE_SIZE_EXCEEDED", 描述: "文件大小超限"}
    E-4000012: {枚举: "CONTENT_TYPE_INVALID", 描述: "Content-Type 不支持"}
    E-4000013: {枚举: "CHARSET_UNSUPPORTED", 描述: "字符编码不支持"}
    E-4000014: {枚举: "PAGE_PARAM_INVALID", 描述: "分页参数无效"}
    E-4000015: {枚举: "SORT_PARAM_INVALID", 描述: "排序参数无效"}

  认证类_401:
    E-4010001: {枚举: "NOT_LOGGED_IN", 描述: "未登录"}
    E-4010002: {枚举: "TOKEN_EXPIRED", 描述: "Token 已过期"}
    E-4010003: {枚举: "TOKEN_INVALID", 描述: "Token 格式无效"}
    E-4010004: {枚举: "ACCOUNT_DISABLED", 描述: "账户已被禁用"}
    E-4010005: {枚举: "CREDENTIALS_INVALID", 描述: "用户名或密码错误"}
    E-4010006: {枚举: "SESSION_EXPIRED", 描述: "会话已过期"}
    E-4010007: {枚举: "REFRESH_TOKEN_INVALID", 描述: "刷新令牌无效"}

  权限类_403:
    E-4030001: {枚举: "PERMISSION_DENIED", 描述: "无操作权限"}
    E-4030002: {枚举: "DATA_ACCESS_DENIED", 描述: "无数据权限"}
    E-4030003: {枚举: "TENANT_ACCESS_DENIED", 描述: "跨租户访问被拒绝"}
    E-4030004: {枚举: "IP_BLOCKED", 描述: "IP 访问被限制"}
    E-4030005: {枚举: "OPERATION_NOT_ALLOWED", 描述: "当前环境不允许此操作"}

  资源不存在类_404:
    E-4040001: {枚举: "RESOURCE_NOT_FOUND", 描述: "资源不存在"}
    E-4040002: {枚举: "RELATED_RESOURCE_NOT_FOUND", 描述: "关联资源不存在"}
    E-4040003: {枚举: "API_NOT_FOUND", 描述: "接口不存在"}

  冲突类_409:
    E-4090001: {枚举: "OPTIMISTIC_LOCK_CONFLICT", 描述: "数据已被修改"}
    E-4090002: {枚举: "DUPLICATE_KEY", 描述: "数据重复"}
    E-4090003: {枚举: "CONCURRENT_CONFLICT", 描述: "并发操作冲突"}
    E-4090004: {枚举: "DUPLICATE_SUBMISSION", 描述: "重复提交"}

  业务逻辑类_422:
    E-4220001: {枚举: "STATUS_TRANSITION_INVALID", 描述: "当前状态不允许此操作"}
    E-4220002: {枚举: "PRECONDITION_NOT_MET", 描述: "前置条件未满足"}
    E-4220003: {枚举: "QUOTA_EXCEEDED", 描述: "配额已用尽"}
    E-4220004: {枚举: "DEPENDENCY_CONSTRAINT", 描述: "存在依赖关系，无法操作"}

  限流类_429:
    E-4290001: {枚举: "RATE_LIMIT_EXCEEDED", 描述: "请求过于频繁"}
    E-4290002: {枚举: "CONCURRENT_LIMIT", 描述: "并发请求数超限"}

  系统错误类_500_503:
    E-5000001: {枚举: "INTERNAL_ERROR", HTTP: 500, 描述: "系统内部错误"}
    E-5000002: {枚举: "DATABASE_ERROR", HTTP: 500, 描述: "数据库操作异常"}
    E-5000003: {枚举: "CACHE_ERROR", HTTP: 500, 描述: "缓存服务异常"}
    E-5000004: {枚举: "MQ_ERROR", HTTP: 500, 描述: "消息队列异常"}
    E-5000005: {枚举: "DEPENDENCY_SERVICE_FAILED", HTTP: 500, 描述: "依赖服务调用失败"}
    E-5000006: {枚举: "DEPENDENCY_SERVICE_TIMEOUT", HTTP: 500, 描述: "依赖服务调用超时"}
    E-5030001: {枚举: "SERVICE_UNAVAILABLE", HTTP: 503, 描述: "服务暂时不可用"}
    E-5030002: {枚举: "SERVICE_DEGRADED", HTTP: 503, 描述: "服务已降级"}

# ── 统一响应格式 ──
response_format:
  成功响应:
    结构: "{code: 0, message: 'success', data: {}, timestamp: 1706000000000}"
    字段说明:
      code: "业务状态码，0 表示成功"
      message: "状态描述，成功时固定为 'success'"
      data: "响应数据，无数据时为 null 或 {}"
      timestamp: "服务端响应时间戳（Unix 毫秒）"

  错误响应:
    结构: "{code: 4000001, message: '参数校验失败', data: {}, timestamp: 1706000000000, traceId: 'uuid'}"
    字段说明:
      code: "错误码数字部分（去掉 E- 前缀），前端通过 E-${code} 拼接为 i18n Key"
      message: "面向用户的错误提示信息"
      data: "错误详情（可选），帮助定位问题"
      timestamp: "错误发生时间戳（Unix 毫秒）"
      traceId: "分布式链路追踪 ID，格式为 UUID 或 32 位十六进制"

  错误详情字段_data:
    field: "出错的字段名称（参数校验错误）"
    value: "出错的字段实际值（参数校验错误）"
    suggestion: "建议的解决方案或修正指引"
    details: "多个校验错误的详情列表（多字段校验错误）"
    allowedValues: "允许的枚举值列表（枚举值错误）"
    min: "允许的最小值（范围/长度错误）"
    max: "允许的最大值（范围/长度错误）"
    retryAfter: "建议的重试等待秒数（限流错误）"
    currentVersion: "当前数据的版本号（乐观锁冲突）"

# ── 国际化支持 ──
i18n_support:
  加载优先级:
    - "客户端请求头指定的语言（Accept-Language）"
    - "用户账户配置的偏好语言"
    - "系统默认语言（如 zh-CN）"
  资源文件格式: "以错误码为 Key，按语言分别维护（如 error_messages_zh_CN.properties）"
  参数占位符:
    - "{field}：字段名称"
    - "{max}：最大值"
    - "{min}：最小值"
    - "{value}：实际值"
    - "{allowed}：允许的值列表"
