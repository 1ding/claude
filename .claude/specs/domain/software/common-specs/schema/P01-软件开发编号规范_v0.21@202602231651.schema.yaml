# 软件开发编号规范 Schema
# 来源规范：projects/specs/software/common-specs/outputs/P01-软件开发编号规范_v0.21@202602231651.md
# 用途：AI 内容编写阶段加载此 schema（替代完整规范），提供条目编号格式与管理规则约束
# 完整规则（更多示例和详细说明）：见原规范文件
# 修订日期：2026-03-04

doc_id: P01
doc_name: 软件开发编号规范

# ── 双轨标识体系 ──
dual_track:
  semantic_id:
    格式: "{类型前缀}-{模块}-{对象}-{动作/场景}（因类型而异）"
    用途: "系统存储、代码引用、文档索引；一经分配不应变更"
  short_code:
    格式: "{类型前缀}{2~4位数字}（位数因条目类型而异，详见各类型定义）"
    用途: "日常交流、会议讨论、追溯矩阵"
  首次引用: "宜同时标注语义ID和短号，如 EPIC001: 用户认证体系 (EPIC-USER-auth)"
  追溯关系: "语义ID中不应嵌入其他条目的短号或编号；条目间追溯关系通过管理表（关联表）维护"

# ── 通用规则 ──
common_rules:
  字符集:
    类型前缀和业务域: "大写英文字母，如 EPIC、USER"
    对象动作场景: "小写英文字母，如 auth、login"
    例外: "BC名称、SVC名称、DE实体名使用 PascalCase"
    短号前缀: "大写；数字部分零填充至固定位数"
  分隔符:
    层级间: "连字符 -"
    复合词: "连字符 -（如 wrong-password）"
    禁止: "不应使用 _、/、空格"
  唯一性:
    语义ID: "全局唯一"
    短号: "同一类型前缀内唯一，递增分配，不回收"
    类型前缀: "全局唯一，统一登记在附录F"
  长度:
    语义ID: "宜≤60字符，≤5级层级"
    例外: "LC等复合型编号可放宽至80字符"
  短号位数选择:
    2位: "预估≤99个（如BC01）"
    3位: "预估100~999个（如EPIC001）"
    4位: "预估>999个（如TC0001）"
    规则: "位数一经确定不应中途变更；不足时在用完后才扩展"
  语义片段质量:
    长度: "宜1~4个单词"
    禁止: "不应重复类型前缀或业务域已表达的信息（反例：BS-ORDER-standard-order-create）"
    禁止_泛化: "不应使用无区分作用的词（如 do-something）"
  词汇规范: "语义片段应优先使用各类型命名词典中定义的标准词汇；新增词汇应遵循现有命名风格并及时补充至命名词典"
  业务域引用: "语义ID中业务域片段使用语义标识（如USER、ORDER），不应使用短号（如DOM01）"
  废弃: "语义ID保留记录，短号不回收，状态标记为已废弃"
  变更: "语义ID一经分配不变；如确需变更，保留原记录并新建，管理表标注替代关系"

# ── 条目类型速查表 ──
item_types:

  # ─ 产品战略（阶段1）─
  THM:
    名称: "主题（Theme）"
    语义ID: "THM-{战略方向}"
    短号: "THM{3位}"
    示例: "THM001 = THM-growth"
    专项: "同期活跃主题宜≤10个；命名应体现战略意图"

  DOM:
    名称: "业务域（Domain）"
    语义ID: "DOM-{业务域名称}（全大写，如USER、ORDER）"
    短号: "DOM{2~3位}（仅独立引用，不嵌入其他条目语义ID）"
    示例: "DOM01 = DOM-USER"
    专项: "项目启动时建立业务域定义表"

  技术域标识:
    说明: "Enabler类条目语义ID中替代业务域片段"
    标准列表: "ARCH / INFRA / PLATFORM / SEC / DATA / DEVOPS"

  # ─ 宏观需求（阶段2）─
  EPIC:
    名称: "史诗（Epic）"
    语义ID: "EPIC-{业务域}-{功能模块}"
    短号: "EPIC{3位}"
    示例: "EPIC001 = EPIC-USER-auth"
    专项: "Enabler Epic用技术域标识替代业务域片段"

  SROLE:
    名称: "系统角色（System Role）"
    语义ID: "SROLE-{角色名称}"
    短号_默认: "{类别缩写}{2~3位}（多利益相关方项目）"
    短号_备选: "SROLE{3位}（单利益相关方项目）"
    示例: "UP01 = SROLE-platform-admin"
    专项: "类别缩写应为2个大写字母，不应与已有条目类型前缀重复"

  BROLE:
    名称: "业务角色（Business Role）"
    语义ID: "BROLE-{制度域}-{角色描述}"
    短号: "BROLE{3位}"
    示例: "BROLE001 = BROLE-sdlc-security-dev-owner"
    专项: "业务角色应从对应制度文档中直接识别，不应自行创造；制度域缩写应在项目启动时统一登记，与业务域定义表分开维护"

  BG:
    名称: "业务目标（Business Goal）"
    语义ID: "BG-{目标描述}（含动作+对象，如improve-conversion）"
    短号: "BG{3位}"

  DLM:
    名称: "困境（Dilemma）"
    语义ID: "DLM-{困境描述}（结构性障碍，非现象）"
    短号: "DLM{3位}"

  PP:
    名称: "痛点（Pain Point）"
    语义ID: "PP-{角色名}-{痛点描述}"
    短号: "PP{3位}"
    专项: "必须与具体系统角色关联"

  EXP:
    名称: "期望（Expectation）"
    语义ID: "EXP-{角色名}-{期望描述}"
    短号: "EXP{3位}"
    专项: "正向表述；必须与具体系统角色关联"

  SH:
    名称: "利益相关方（Stakeholder）"
    语义ID: "SH-{利益相关方描述}"
    短号: "SH{2位}（仅L0/L1层级；L2用SROLE编号）"

  BS:
    名称: "业务环节（Business Segment）"
    语义ID: "BS-{域缩写}-{活动描述}（活动描述不应重复域缩写）"
    短号: "BS{3位}"
    示例: "BS001 = BS-USER-tenant-onboarding-apply"

  EN:
    名称: "关键实体（Key Entity）"
    语义ID: "EN-{域缩写}-{实体描述}"
    短号: "EN{3位}"
    专项: "实体名与域缩写相同时保留完整名称（如EN-PAYMENT-payment-order）"

  LC:
    名称: "生命周期阶段（Lifecycle）"
    语义ID: "{实体语义ID}-LC-{阶段描述}（前缀为所属EN的语义ID）"
    短号: "LC{3位}（全局递增，不按实体分组）"
    示例: "LC001 = EN-USER-tenant-LC-pending-audit"
    专项: "描述稳定业务状态，不描述瞬时动作"

  EVT:
    名称: "事件（Event）"
    语义ID: "EVT-{域缩写}-{事件描述}（不重复域缩写）"
    短号: "EVT{3位}"
    专项: "应描述具有业务意义的动作或状态变化，不应描述系统内部的技术事件"

  WS:
    名称: "工作场景（Work Scenario）"
    语义ID: "WS-{角色名}-{场景描述}（职责域切入点，非具体操作）"
    短号: "WS{3位}"

  TP:
    名称: "旅程触点（Touchpoint）"
    语义ID: "TP-{角色名}-{触点描述}"
    短号: "TP{3位}"

  BAS:
    名称: "业务验收场景（Business Acceptance Scenario）"
    语义ID: "BAS-{业务域}-{场景描述}（宜以-e2e后缀）"
    短号: "BAS{3位}"

  FR:
    名称: "基础性需求（Foundation Requirements）"
    语义ID: "FR-{能力描述}（跨BC通用能力）"
    短号: "FR{2位}"

  NFR:
    名称: "非功能需求（Non-Functional Requirements）"
    语义ID: "NFR-{类别}-{约束描述}"
    短号: "NFR{3位}"
    类别: "PERF / SEC / AVAIL / SCALE / COMPAT / MAINT / USAB / INTEG / I18N / OBS"
    专项: "约束应可量化可验证"

  # ─ 领域设计（阶段3）─
  BC:
    名称: "限界上下文（Bounded Context）"
    语义ID: "BC-{BC名称}（PascalCase，如OrderPlacement）"
    短号: "BC{2~3位}（不嵌入其他条目语义ID）"
    专项: "名称不应包含业务域名称前缀"

  # ─ 系统设计（阶段4）─
  CAP:
    名称: "能力（Capability）"
    语义ID: "CAP-{业务域}-{能力描述}"
    短号: "CAP{3位}"
    专项: "仅大型项目（多BC协作）使用"

  ECAP:
    名称: "架构能力（Enabler Capability）"
    语义ID: "ECAP-{技术域}-{能力描述}"
    短号: "ECAP{3位}"

  SVC:
    名称: "系统模块/微服务（Service）"
    语义ID: "SVC-{服务名称}（PascalCase，与代码仓库命名一致）"
    短号: "SVC{3位}"

  ADR:
    名称: "架构决策记录（ADR）"
    语义ID: "ADR-{决策主题}"
    短号: "ADR{3位}"
    专项: "一经记录不应删除；推翻时新增ADR并在原记录标注已被取代"

  APM:
    名称: "APM监控项"
    语义ID: "APM-{类别}-{监控描述}"
    短号: "APM{3位}"
    类别: "TRACE / METRIC / ALERT / HEALTH"

  # ─ BC详细需求（阶段5）─
  FT:
    名称: "特性（Feature）"
    语义ID: "FT-{业务域}-{功能集}"
    短号: "FT{3位}"
    专项: "Enabler Feature用技术域标识"

  US:
    名称: "用户故事（User Story）"
    语义ID: "US-{业务域}-[{角色}-]{对象}-{功能/场景}（角色可选）"
    短号: "US{3位}"
    示例: "US001=US-USER-auth-login-password；US090=US-ORDER-buyer-create-standard（含角色）"
    专项: "仅当同一功能因角色不同而产生不同需求时才嵌入角色标识（位于业务域之后、对象之前）；功能不因角色而异时不嵌入"

  AC:
    名称: "验收标准（Acceptance Criteria）"
    语义ID: "AC-{业务域}-{验收场景描述}"
    短号: "AC{3位}"
    专项: "与US的追溯关系通过管理表维护，不嵌入US编号"

  BR:
    名称: "业务规则（Business Rule）"
    语义ID: "BR-{业务域}-{规则描述}"
    短号: "BR{3位}"
    专项: "仅可被多US/AC引用的规则独立编号；单AC内生效的校验不提取为BR"

  # ─ BC总体设计（阶段6）─
  DE:
    名称: "数据实体（Data Entity）"
    语义ID: "DE-{业务域}-{实体名称}（PascalCase，与代码类名一致）"
    短号: "DE{3位}"
    专项: "EN是宏观业务对象；DE是领域模型对象（聚合根/实体/值对象）"

  # ─ BC详细设计（阶段7）─
  API:
    名称: "API接口"
    语义ID: "API-{业务域}-{对象}-{动作}[-{限定词}]"
    短号: "API{3位}"
    示例: "API001=API-USER-auth-login"

  INTG:
    名称: "外部集成接口（Integration Point）"
    语义ID: "INTG-{业务域}-{外部方}-{接口描述}"
    短号: "INTG{3位}"
    专项: "记录外部方API版本；版本变更时新增INTG条目"

  # ─ 开发实现（阶段8）─
  TASK:
    名称: "任务（Task）"
    语义ID: "TASK-{类型}-{任务描述}"
    短号: "TASK{3位}"
    类型: "DEV / TEST / OPS / DOC / DEVOPS"
    专项: "已完成或已取消的Task不应删除，状态置为已完成或已取消"

  STASK:
    名称: "子任务（Sub-task）"
    语义ID: "STASK-{任务场景}-{子任务描述}"
    短号: "STASK{3位}"

  TC:
    名称: "测试用例（Test Case）"
    语义ID: "TC-{业务域}-{功能}-{测试点}（测试API时，功能宜用 {接口功能}-api 形式）"
    短号: "TC{4位}"
    示例: "TC0001=TC-USER-login-valid-input"

  BUG:
    名称: "缺陷（Bug/Defect）"
    语义ID: "BUG-{影响模块}-{简要描述}"
    短号: "BUG{4位}"
    专项: "不应删除；修复后状态置为已关闭"

  CR:
    名称: "变更请求（Change Request）"
    语义ID: "CR-{模块}-{变更内容}（动作-对象形式）"
    短号: "CR{3位}"
    专项: "仅针对已基线化条目"

  RISK:
    名称: "风险（Risk）"
    语义ID: "RISK-{类别}-{风险描述}"
    短号: "RISK{3位}"
    类别: "TECH / BIZ / RES / EXT"
    专项: "不应删除；消除后状态置为已关闭"
