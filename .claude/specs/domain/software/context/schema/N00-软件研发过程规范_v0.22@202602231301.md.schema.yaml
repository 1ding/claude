# 软件研发过程规范 Schema
# 来源规范：projects/specs/software/context/outputs/N00-软件研发过程规范_v0.22@202602231301.md
# 用途：AI 内容编写阶段加载此 schema（替代完整规范），提供研发过程框架约束
# 完整规则（更多示例和详细说明）：见原规范文件

doc_id: N00
doc_name: 软件研发过程规范

# ── 管辖范围 ──
scope:
  管辖: [阶段划分, 各阶段目标, 关键活动, 输入输出, 交付物要求, 过程管理要求]
  不管辖: [具体编写规范(见各交付物专用规范), 编号体系(P01), 术语定义(C99), 错误代码(P02)]

# ── 研发阶段总览 ──
stages:
  count: 8
  顺序: 阶段1产品战略 → 阶段2宏观需求 → 阶段3领域设计 → 阶段4系统设计 → 阶段5BC详细需求 → 阶段6BC总体设计 → 阶段7BC详细设计 → 阶段8开发实现
  关系: 顺序依赖，可根据项目特点迭代和并行

# ── 各阶段定义 ──
stage_details:
  阶段1_产品战略:
    目标: 战略定位、目标市场、价值主张、商业模式；定义 Strategic Theme
    关键输出:
      - 产品战略文档（含产品愿景、价值主张、Strategic Theme 清单）
      - 产品路线图（各里程碑可追溯到 Strategic Theme）
    SAFe层级: Strategic Theme

  阶段2_宏观需求:
    目标: 将 Strategic Theme 分解为 Business Epic，识别核心业务流程和用户场景
    关键输出:
      - 宏观需求文档（含 Business Epic 清单+优先级+验收标准+非功能需求初步定义）
      - 业务流程图
    SAFe层级: Business Epic

  阶段3_领域设计:
    目标: 领域划分（核心域/支撑域/通用域）、BC识别与边界划定、统一语言；识别 Enabler Epic
    关键输出:
      - 领域设计文档（含领域划分+BC识别+上下文映射图+统一语言词汇表+Enabler Epic清单及与Business Epic的追溯关系）
    SAFe层级: Enabler Epic

  阶段4_系统设计:
    目标: 系统整体架构设计；将 Enabler Epic 分解为 Enabler Capability 和 Enabler Feature
    关键输出:
      - 系统设计文档（含系统架构图+技术选型+集成方案+部署架构+非功能需求方案+Enabler Capability/Feature清单及验收标准+上游追溯关系）
    SAFe层级: [Enabler Capability, Enabler Feature]

  阶段5_BC详细需求:
    目标: 将 Business Epic 和 Capability 拆分为 Feature 和 User Story，针对每个BC细粒度需求分析
    关键输出:
      - BC详细需求文档（per BC，含Feature列表+User Story+验收标准+业务规则+数据需求）
    追溯要求: Feature/User Story → 上游 Business Epic；标注受 Enabler Feature 约束的非功能需求
    SAFe层级: [Feature, User Story]

  阶段6_BC总体设计:
    目标: BC内模块划分、领域模型、关键接口、数据方案；将 User Story 初步分解为 Task
    关键输出:
      - BC总体设计文档（per BC）
      - 小BC内容: 模块结构+领域模型概要+接口概要+数据方案+初步Task清单
      - 大BC额外内容: 子领域划分方案+跨子领域约束+公共架构决策+各子领域概要设计
    追溯要求: 设计方案 → Feature/User Story；标注对 Enabler Feature 的落实方式
    SAFe层级: Task（初步分解）

  阶段7_BC详细设计:
    目标: 完成可直接指导编码的详细技术设计；细化 Task 至可分配粒度
    关键输出:
      - 小BC: 1份/BC（含详细领域模型+API规格+数据模型+算法设计+细化Task清单+工作量估算）
      - 大BC: N份/子领域，各子领域文档须遵循总体设计的跨子领域约束
    SAFe层级: Task（细化）

  阶段8_开发实现:
    目标: 按 Task 完成编码、测试、部署，交付可部署软件产品
    关键输出:
      - 源代码（经代码审查，可追溯到 Task 和 User Story）
      - 测试报告（覆盖 User Story 验收标准和 Enabler Feature 非功能需求）
      - 部署包与部署文档
      - 用户手册（如适用）

# ── 大BC / 小BC 判定 ──
bc_scale:
  大BC判定: 满足以下任一条件
    - BC内包含多个可独立演进的业务关注点
    - Feature数量/复杂度导致单份详细设计文档难以维护
    - 存在可由不同团队/人员并行设计的独立模块
  小BC: 不满足大BC任一条件，按传统方式处理（阶段7产出1份文档）

# ── SAFe 需求层级体系 ──
safe_hierarchy:
  总览:
    推荐模型: SAFe 需求层级体系
    原则: Business 和 Enabler 遵循相同规则（均需验收标准、参与优先级排序、可增量交付），区别仅在价值导向
    Business: 直接交付用户价值
    Enabler: 构建架构跑道以支撑未来业务交付

  层级定义:
    Strategic_Theme:
      中文: 战略主题
      含义: 投资组合级的战略方向与业务目标
      粒度: 最粗，跨产品/跨组织
      所在域: 业务需求域
      对应阶段: 阶段1
      分解为: Business Epic

    Business_Epic:
      中文: 业务史诗
      含义: 端到端的业务目标或价值流，跨ART的大粒度业务价值交付
      所在域: 业务需求域
      对应阶段: 阶段2
      上游: Strategic Theme
      分解为: Capability → Feature

    Enabler_Epic:
      中文: 架构史诗
      含义: 架构/基础设施/合规类大粒度技术决策，跨BC的架构决策（如领域边界划定、BC间通信模式、共享内核策略）
      所在域: 系统架构需求域
      对应阶段: 阶段3（识别）
      上游: Business Epic（基于Business Epic和领域划分结果识别）
      分解为: Enabler Capability → Enabler Feature

    Capability:
      中文: 能力
      含义: 跨BC（跨ART）的大解决方案能力，需多个BC协作交付
      所在域: 系统架构需求域
      对应阶段: 阶段3-4
      上游: Business Epic
      分解为: Feature（分配到各BC实现）
      注意: Capability 是 Epic 和 Feature 之间的中间层级

    Enabler_Capability:
      中文: 架构能力
      含义: 跨BC的架构级能力，如统一认证体系、跨服务事件总线、可观测性平台
      所在域: 系统架构需求域
      对应阶段: 阶段4
      上游: Enabler Epic
      分解为: Enabler Feature

    Enabler_Feature:
      中文: 架构特性
      含义: 系统架构约束、集成接口规范、非功能需求指标、基础设施要求等系统层面要求
      所在域: 系统架构需求域
      对应阶段: 阶段4（定义）；阶段5-6（被BC承接落实）
      上游: Enabler Capability
      作用: 约束下游各BC的详细需求和设计

    Feature:
      中文: 特性
      含义: BC级别的可交付功能集，单ART内可交付的功能单元
      所在域: 软件开发需求域
      对应阶段: 阶段5
      上游: Capability（由Capability拆分而来）
      分解为: User Story

    User_Story:
      中文: 用户故事
      含义: 最小可交付价值单元，单个可验收需求项
      所在域: 软件开发需求域
      对应阶段: 阶段5
      上游: Feature
      分解为: Task

    Task:
      中文: 任务
      含义: 可分配给开发人员的具体实现任务，迭代内可完成
      所在域: 软件开发需求域
      对应阶段: 阶段6（初步分解）→ 阶段7（细化）→ 阶段8（执行）
      上游: User Story

  三域与阶段对应:
    业务需求域（对应StRS）:
      - Strategic Theme → 阶段1
      - Business Epic → 阶段2
    系统架构需求域（对应SyRS）:
      - Enabler Epic → 阶段3
      - Enabler Capability → 阶段3-4
      - Enabler Feature → 阶段4
      - Capability（跨BC） → 阶段3-4
    软件开发需求域（对应SRS）:
      - Feature → 阶段5
      - User Story → 阶段5
      - Task → 阶段6-8

  分解链路:
    业务链: "Strategic Theme → Business Epic → Capability → Feature → User Story → Task"
    架构链: "Enabler Epic → Enabler Capability → Enabler Feature（约束下游BC）"

# ── 可追溯链路 ──
traceability:
  主链: "Strategic Theme → Business Epic → Enabler Epic → Enabler Capability/Feature → Capability → Feature → User Story → Task"
  大BC追加: "BC总体设计 → 子领域划分 → 子领域详细设计文档"
  全链路覆盖: "需求项 ↔ 设计文档 ↔ 源代码 ↔ 测试用例"（支持正向追踪和反向溯源）

# ── 过程管理要求 ──
process_mgmt:
  阶段门禁: 每阶段完成后进行阶段评审（正式评审/同行评审/检查单），确认交付物质量和完整性后方可进入下一阶段
  变更管理: 产出物变更须遵循变更管理流程；前序阶段变更需评估对后续阶段影响并同步更新
  可追溯性: 各阶段交付物建立可追溯关联，确保从产品战略到代码实现的双向追溯能力
